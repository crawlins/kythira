        env:
          AWS_DEFAULT_REGION: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}
        run: scripts/aws-asg-leaks.sh audit

      # After the audit, so a leak is reported before it is removed and the
      # job stays red for it (Requirement 4.3).
      - name: Sweep Auto Scaling resources that outlived teardown
        if: always()
        env:
          AWS_DEFAULT_REGION: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}
        run: scripts/aws-asg-leaks.sh sweep

  # ── AWS: aws_ec2_launch_options_real_test ───────────────────────────────
  # Placement groups, spot vs on-demand and provision-timeout cleanup for
  # aws_ec2_quorum_manager (aws-quorum-manager Requirement 16.19 e-i). Its
  # own job for the same two reasons as `aws-asg` above: `aws` has no time
  # left under its 360-minute cap for another 155 minutes of worst-case
  # CTest TIMEOUT, and the tag-scoped sweep is only safe with no second run
  # of this suite live, hence its own concurrency group.
  #
  # It needs only the ec2-quorum-manager bundle. Like `aws-asg` it has no
  # workflow_dispatch input (the file is at GitHub's 25-input cap):
  # `aws_bundle_ec2_quorum` selects it on dispatch, and on a schedule it
  # follows its own REAL_CLOUD_TESTS_AWS_EC2_LAUNCH_OPTIONS_ENABLED
  # variable, so turning it on is a separate decision from the existing
  # weekly ec2-quorum-manager run.
  aws-ec2-launch-options:
    name: Real Cloud Tests (AWS EC2 launch options, ${{ matrix.arch_label }})
    needs: aws
    concurrency:
      group: real-cloud-aws-ec2-launch-options-${{ github.repository }}
      # A run already holding real instances must reach its own teardown.
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    # 155 minutes of worst-case CTest TIMEOUT (tests/CMakeLists.txt), the
    # build, and the audit and sweep.
    timeout-minutes: 300
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    # always(): `needs: aws` is for ordering only. Without it this job is
    # skipped whenever `aws` fails or is itself skipped.
    if: |
      always()
      && (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.aws_enabled == 'true'
        || (github.event.inputs.aws_enabled == null && vars.REAL_CLOUD_TESTS_AWS_ENABLED == 'true'))
      && (github.event.inputs.aws_bundle_ec2_quorum == 'true'
        || (github.event.inputs.aws_bundle_ec2_quorum == null && vars.REAL_CLOUD_TESTS_AWS_EC2_LAUNCH_OPTIONS_ENABLED == 'true'))
    strategy:
      fail-fast: false
      # One leg at a time: each leg's sweep would delete the other's live
      # resources, since both carry the same suite tag.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            arch_label: x64
          - os: ubuntu-24.04-arm
            arch_label: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if AWS_CI_ROLE_ARN is unset
        if: ${{ vars.AWS_CI_ROLE_ARN == '' }}
        run: |
          echo "::error::The EC2 launch-options suite is enabled but the AWS_CI_ROLE_ARN repository variable is unset. See scripts/ci-cloud-credentials/aws/README.md." >&2
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-real-cloud-tests-ec2lo
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      # Fail before the build, not after an hour of compiling, when the role
      # predates the placement-group grants this suite added to the
      # ec2-quorum-manager bundle.
      - name: Fail closed if the CI role lacks the placement-group grants
        run: |
          if ! out=$(aws ec2 describe-placement-groups --filters 'Name=tag:kythira:suite,Values=aws-ec2-launch-options' 2>&1); then
            echo "::error::The CI role cannot call ec2:DescribePlacementGroups: ${out}. Re-run scripts/ci-cloud-credentials/aws/provision-oidc-role.sh with the current ec2-quorum-manager bundle." >&2
            exit 1
          fi

