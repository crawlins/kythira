        env:
          KYTHIRA_AWS_WEB_IDENTITY_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
        run: |
          scripts/run-real-cloud-suite.sh 'real-ec2' '^aws_ec2_launch_options_real_test$' \
            "Check that AWS_CI_ROLE_ARN is assumable via OIDC and carries the ec2-quorum-manager policy."

      # The test step can outlast the credentials configured before it; see
      # the `aws` job's audit refresh for the run that proved it.
      - name: Re-configure AWS credentials for the audit (OIDC)
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-real-cloud-tests-ec2lo-audit
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      # Instances, placement groups and network, re-checked for a bounded
      # wait before a finding counts. Fails the job on a leak or when it
      # cannot look.
