      # GitHub OIDC on its own, because its worst case far outlasts the one
      # hour the credentials above are good for.
      - name: Run asg-quorum-manager bundle
        env:
          KYTHIRA_AWS_WEB_IDENTITY_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
        run: |
          scripts/run-real-cloud-suite.sh 'asg' '^aws_asg_quorum_manager_real_test$' \
            "Check that AWS_CI_ROLE_ARN is assumable via OIDC and carries the asg-quorum-manager policy."

      # The test step can outlast the credentials configured before it; see
      # the `aws` job's audit refresh for the run that proved it.
      - name: Re-configure AWS credentials for the audit (OIDC)
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
