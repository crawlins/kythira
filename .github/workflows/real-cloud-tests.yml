name: Real Cloud Tests

# Runs this project's real-cloud integration tests (today: AWS and GCP —
# see .kiro/specs/ci-real-cloud-tests/ and .kiro/specs/gcp-cloud-services/)
# against actual cloud-provider infrastructure, authenticated via short-lived
# OIDC-federated credentials (AWS role assumption / GCP Workload Identity
# Federation) — no long-lived keys stored as CI secrets.
# Deliberately decoupled from ci.yml: ci.yml's own -LE label filter already
# excludes every real-ec2-labeled test from every ordinary push/PR run, and
# this workflow never modifies that file. Gated by three independent
# on/off levels — see scripts/ci-cloud-credentials/README.md.

on:
  workflow_dispatch:
    inputs:
      run_real_cloud_tests:
        description: "Master switch (overrides REAL_CLOUD_TESTS_ENABLED for this run only)"
        type: boolean
        required: false
      aws_enabled:
        description: "AWS (overrides REAL_CLOUD_TESTS_AWS_ENABLED for this run only)"
        type: boolean
        required: false
      # Also selects the asg-quorum-manager suite (the aws-asg job) and the
      # EC2 launch-options suite (the aws-ec2-launch-options job), which
      # have no inputs of their own because this file is at GitHub's
      # 25-input cap. Their schedule toggles are
      # REAL_CLOUD_TESTS_AWS_ASG_QUORUM_ENABLED and
      # REAL_CLOUD_TESTS_AWS_EC2_LAUNCH_OPTIONS_ENABLED.
      aws_bundle_ec2_quorum:
        description: "AWS bundle: ec2-quorum-manager (+ asg, ec2 launch options)"
        type: boolean
        required: false
      aws_bundle_ca_cluster:
        description: "AWS bundle: ca-cluster-node"
        type: boolean
        required: false
      aws_bundle_ca_cluster_rpc_tls:
        description: "AWS bundle: ca-cluster-node-rpc-tls"
        type: boolean
        required: false
      aws_bundle_ami_build:
        description: "AWS bundle: ami-build (builds the ca_cluster_node AMI via Packer)"
        type: boolean
        required: false
      aws_bundle_object_persistence:
        description: "AWS bundle: object-persistence (S3 objects only, ~free)"
        type: boolean
        required: false
      azure_enabled:
        description: "Azure (overrides REAL_CLOUD_TESTS_AZURE_ENABLED for this run only)"
        type: boolean
        required: false
      azure_bundle_quorum_manager:
        description: "Azure bundle: quorum-manager (VM + VMSS)"
        type: boolean
        required: false
      azure_bundle_key_vault:
        description: "Azure bundle: key-vault (azure_key_vault_ca_provider)"
        type: boolean
        required: false
      azure_bundle_object_persistence:
        description: "Azure bundle: object-persistence (Blob objects only, ~free)"
        type: boolean
        required: false
      gcp_enabled:
        description: "GCP (overrides REAL_CLOUD_TESTS_GCP_ENABLED for this run only)"
        type: boolean
        required: false
      gcp_bundle_quorum_manager:
        description: "GCP bundle: quorum-manager (Compute Engine + MIG suites)"
        type: boolean
        required: false
      gcp_bundle_privateca:
        description: "GCP bundle: privateca (Certificate Authority Service)"
        type: boolean
        required: false
      gcp_bundle_object_persistence:
        description: "GCP bundle: object-persistence (GCS objects only, ~free)"
        type: boolean
        required: false
      oci_enabled:
        description: "OCI (overrides REAL_CLOUD_TESTS_OCI_ENABLED for this run only)"
        type: boolean
        required: false
      # ── HARD LIMIT: 25 workflow_dispatch inputs. This block is AT it. ─────
      #
      # More than 25 makes the whole file invalid — not dispatchable, and not
      # running on its schedule either — and GitHub reports that as a zero-job
      # run named after the file path, never as a PR check. PR #257 took this
      # block from 24 to 27, merged green, and killed the workflow on main.
      #
      # ci.yml's `workflow-input-limits` job now fails a PR that exceeds the
      # cap. To add an input here you must remove one; that is a real decision
      # and the guard exists to make you make it.
      #
      # All three OCI bundles, not one. This job drove its bundles from
      # repository variables alone until task 19 needed to dispatch a single
      # one of them and could not: with no inputs, the only way to run just
      # the object-persistence bundle was to flip
      # REAL_CLOUD_TESTS_OCI_INSTANCE_POOL_ENABLED and _CERTIFICATES_ENABLED
      # to false, dispatch, and flip them back — a window in which a scheduled
      # run silently skips two bundles, and which leaves them off permanently
      # if anything interrupts the restore.
      #
      # Adding an input for the *new* bundle only would have given "how do I
      # enable this for one run?" two answers inside one job, which is why the
      # first version of this block added none. Adding all three settles it the
      # other way: every OCI bundle now behaves exactly like every other
      # provider's.
      oci_bundle_instance_pool:
        description: "OCI bundle: instance-pool (launches a real instance)"
        type: boolean
        required: false
      oci_bundle_certificates:
        description: "OCI bundle: certificates (oci_certificates_provider)"
        type: boolean
        required: false
      oci_bundle_object_persistence:
        description: "OCI bundle: object-persistence (Object Storage objects only, ~free)"
        type: boolean
        required: false
      alibaba_enabled:
        description: "Alibaba Cloud (overrides REAL_CLOUD_TESTS_ALIBABA_ENABLED for this run only)"
        type: boolean
        required: false
      alibaba_bundle_ess_quorum:
        description: "Alibaba bundle: ess-quorum-manager (launches a real ECS instance)"
        type: boolean
        required: false
      alibaba_bundle_oss_persistence:
        description: "Alibaba bundle: oss-persistence (OSS objects only, ~free)"
        type: boolean
        required: false
      # Cloud-vendor monitoring-config tests (doc/TODO.md "Metrics
      # Backends", real-cloud tier): each stands up the routing mechanism
      # its example config in docker/cloud-monitoring/ describes against
      # the real vendor service — no C++ build involved, so these are their
      # own lightweight jobs with their own toggles rather than bundles
      # inside the provider test jobs above.
      aws_monitoring_enabled:
        description: "AWS CloudWatch monitoring config (overrides REAL_CLOUD_TESTS_AWS_MONITORING_ENABLED for this run only)"
        type: boolean
        required: false
      azure_monitoring_enabled:
        description: "Azure Monitor monitoring config (overrides REAL_CLOUD_TESTS_AZURE_MONITORING_ENABLED for this run only)"
        type: boolean
        required: false
      alibaba_monitoring_enabled:
        description: "Alibaba CloudMonitor monitoring config (overrides REAL_CLOUD_TESTS_ALIBABA_MONITORING_ENABLED for this run only)"
        type: boolean
        required: false
  schedule:
    # Monday 06:00 UTC — balances catching real-infrastructure drift early
    # against not incurring real cloud spend needlessly. Adjust freely.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # ── AWS ──────────────────────────────────────────────────────────────────
  # Runs on both x86_64 and native arm64 runners so the Graviton/arm64 branch
  # in tests/aws_quorum_manager_real_ec2_test.cpp (instance-type fallback,
  # AMI architecture filter, target_arch selection) actually gets compiled
  # and exercised by CI instead of only ever existing as unbuilt source on an
  # x86_64-only runner. See .kiro/specs/arm64-ci-verification/ Requirement 7.
  aws:
    name: Real Cloud Tests (AWS, ${{ matrix.arch_label }})
    runs-on: ${{ matrix.os }}
    # All three bundle ctest steps below can run sequentially in this one
    # job when every bundle is enabled. Sum of their own worst-case CTest
    # TIMEOUT properties (tests/CMakeLists.txt): 10800s (ec2-quorum-manager)
    # + 1800s (ca-cluster-node) + 9000s (ca-cluster-node-rpc-tls) = 360 min,
    # plus build/checkout/credential overhead. 360 is GitHub Actions'
    # own default job timeout cap for hosted runners, so this is set
    # explicitly to that ceiling rather than left implicit. With every
    # bundle on, a run in which all three hit their worst case at once
    # would now be cut off by the cap; real runs sit far below it (the
    # ec2-quorum-manager bundle took 53m43s of its 180 min on run
    # 36337979088). If that ever binds, move a bundle into its own job
    # rather than trimming a TIMEOUT below its cases' needs. Applies to both
    # the x64 and arm64 matrix legs — the sequential-bundle math above
    # doesn't depend on architecture.
    timeout-minutes: 360
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.aws_enabled == 'true'
        || (github.event.inputs.aws_enabled == null && vars.REAL_CLOUD_TESTS_AWS_ENABLED == 'true'))

    strategy:
      fail-fast: false
      # Run the x64 and arm64 legs one at a time, not concurrently. Each test
      # case stands up a full VPC (with a NAT gateway, an EIP and up to nine
      # instances) against a test account on the default per-region service
      # quotas (5 VPCs, 5 EIPs). Two legs running at once double the peak
      # footprint, and when both were simultaneously inside the long 9-node
      # AZ-outage cases — which hold their VPC for tens of minutes — the
      # combined demand exceeded the 5-VPC limit and CreateVpc started failing
      # with "maximum number of VPCs has been reached". Serialising the legs
      # keeps peak usage to a single leg's worth (verified to fit), at the cost
      # of ~2x wall-clock on this weekly/on-demand workflow.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            arch_label: x64
          - os: ubuntu-24.04-arm
            arch_label: arm64

    env:
      BUNDLE_EC2_QUORUM: ${{ (github.event.inputs.aws_bundle_ec2_quorum == 'true') || (github.event.inputs.aws_bundle_ec2_quorum == null && vars.REAL_CLOUD_TESTS_AWS_EC2_QUORUM_ENABLED == 'true') }}
      BUNDLE_CA_CLUSTER: ${{ (github.event.inputs.aws_bundle_ca_cluster == 'true') || (github.event.inputs.aws_bundle_ca_cluster == null && vars.REAL_CLOUD_TESTS_AWS_CA_CLUSTER_ENABLED == 'true') }}
      BUNDLE_CA_CLUSTER_RPC_TLS: ${{ (github.event.inputs.aws_bundle_ca_cluster_rpc_tls == 'true') || (github.event.inputs.aws_bundle_ca_cluster_rpc_tls == null && vars.REAL_CLOUD_TESTS_AWS_CA_CLUSTER_RPC_TLS_ENABLED == 'true') }}
      # .kiro/specs/cloud-object-persistence/ task 17. Unlike the three
      # bundles above this one launches nothing — it writes, reads and
      # deletes objects under a single prefix of an existing bucket — so it
      # contributes no meaningful wall-clock to this job's 360-minute budget
      # and runs on both matrix legs rather than being pinned to x64.
      BUNDLE_OBJECT_PERSISTENCE: ${{ (github.event.inputs.aws_bundle_object_persistence == 'true') || (github.event.inputs.aws_bundle_object_persistence == null && vars.REAL_CLOUD_TESTS_AWS_OBJECT_PERSISTENCE_ENABLED == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if AWS_CI_ROLE_ARN is unset
        if: ${{ vars.AWS_CI_ROLE_ARN == '' }}
        run: |
          echo "::error::REAL_CLOUD_TESTS_AWS_ENABLED is true but the AWS_CI_ROLE_ARN repository variable is unset. See scripts/ci-cloud-credentials/aws/README.md." >&2
          exit 1

      # A job whose every bundle is disabled still builds, authenticates and
      # reports success while running zero tests. run-real-cloud-suite.sh's
      # own skip guard cannot catch this: a step disabled by `if:` never runs
      # the script at all. See this job's sibling guard in the azure job for
      # the real occurrence that motivated adding these.
      - name: Fail closed if no test bundle is enabled
        if: ${{ env.BUNDLE_EC2_QUORUM != 'true' && env.BUNDLE_CA_CLUSTER != 'true' && env.BUNDLE_CA_CLUSTER_RPC_TLS != 'true' && env.BUNDLE_OBJECT_PERSISTENCE != 'true' }}
        run: |
          echo "::error::The AWS job was enabled but every test bundle is disabled, so it would run zero tests and still report success. Set one or more of REAL_CLOUD_TESTS_AWS_EC2_QUORUM_ENABLED / REAL_CLOUD_TESTS_AWS_CA_CLUSTER_ENABLED / REAL_CLOUD_TESTS_AWS_CA_CLUSTER_RPC_TLS_ENABLED / REAL_CLOUD_TESTS_AWS_OBJECT_PERSISTENCE_ENABLED, or pass the aws_bundle_* workflow_dispatch inputs." >&2
          exit 1

      # The bucket is an operator-owned prerequisite — the engine reads and
      # writes objects and never administers storage — so an unset variable
      # can only surface as the suite's exit-77 skip, which the run step
      # below converts into a failure. Failing here instead names the
      # variable rather than leaving a scavenger hunt, and it does so before
      # the ~1 hour build rather than after it.
      - name: Fail closed if the object-persistence bucket variable is unset
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' && vars.AWS_OBJECT_PERSISTENCE_BUCKET == '' }}
        run: |
          echo "::error::The object-persistence bundle is enabled but the AWS_OBJECT_PERSISTENCE_BUCKET repository variable is unset. Run scripts/ci-cloud-credentials/aws/provision-object-persistence-bucket.sh and set the variable it prints." >&2
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-real-cloud-tests
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      # ── System dependencies (identical to ci.yml's build-and-test job) ────
      # Retries the whole update+install cycle: the ubuntu-24.04-arm runner
      # image has been observed losing outbound HTTP(S) route to
      # ports.ubuntu.com for a minute or more at a time, well past what
      # apt's own per-package retry window covers.
      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          # autoconf/autoconf-archive/automake/libtool: see ci.yml's own
          # "Install system dependencies" step for why (vcpkg's gperf port,
          # a host-tool dependency of proxygen -- now an unconditional
          # vcpkg.json dependency like boost-beast, so any workflow running
          # `vcpkg install` against this manifest needs these regardless of
          # which Kconfig transports it actually builds).
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 \
                 cmake \
                 ninja-build \
                 libfiu-dev \
                 ccache \
                 autoconf \
                 autoconf-archive \
                 automake \
                 libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            echo "value=arm64-linux" >> "$GITHUB_OUTPUT"
          else
            echo "value=x64-linux" >> "$GITHUB_OUTPUT"
          fi

      # Exports the environment vcpkg's x-aws backend reads. Writer policy is
      # in the action: only a push to main gets the read-write key.
      # See .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          # runner.arch keeps the x64 and arm64 legs' caches isolated from
          # each other (.kiro/specs/arm64-ci-verification/ Requirement 4).
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}

      # vcpkg's x-gha binary cache talks to the Actions cache API directly, but
      # ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN are only exposed to actions, not
      # to `run:` steps. This re-exports them so the vcpkg invocation below can
      # reach the cache.
      - name: Export Actions cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          # From the OCI build cache action (x-aws); x-gha no longer exists.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      # ccache: lower priority than ci.yml's own jobs since this workflow only
      # runs weekly/on-demand (a longer cache-reuse window, smaller practical
      # benefit), but the same restore-broad/save-unique mechanism as
      # ci.yml's build-and-test/coverage jobs. runner.arch is part of the key
      # for the same reason as the vcpkg cache key above — this job now has
      # both x64 and arm64 legs, and runner.os alone is "Linux" for both.
      # See .kiro/specs/ccache-adoption/ and
      # .kiro/specs/arm64-ci-verification/ Requirement 4.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      - name: Configure (Release, real-cloud tests enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_AWS_REAL_EC2_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — aws"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      # Hand this job's AWS identity back to AWS before any test runs.
      #
      # `.github/actions/oci-build-cache` writes AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY, AWS_REGION and AWS_ENDPOINT_URL into
      # $GITHUB_ENV so vcpkg's x-aws backend and sccache can reach Oracle's
      # S3-compatible API. $GITHUB_ENV is job-wide, so from that step onward
      # this job carried Oracle's access key beside the AWS_SESSION_TOKEN the
      # OIDC step set near the top -- a credential pair belonging to two
      # different clouds. The AWS SDK's default chain reads all three from
      # the environment, so `aws_s3_object_persistence_real_test`'s
      # reachability preflight could not authenticate, the suite skipped with
      # 77, and the bundle's fail-closed guard reported it as the red seen on
      # the September 14, 2026 scheduled run.
      #
      # Both halves below were measured rather than assumed:
      #
      # - The endpoint matters only to the AWS CLI, not to the C++ tests.
      #   The aws-sdk-cpp build this repo links carries no AWS_ENDPOINT_URL
      #   string at all (`strings libaws-cpp-sdk-core.a`), and the tests set
      #   `aws_client_config::region` explicitly rather than reading
      #   AWS_REGION. But the AMI-resolution steps further down *are* the
      #   CLI, and on aws-cli/2.35.11 an AWS_ENDPOINT_URL of
      #   `https://oracle.example.com` sends DescribeImages to
      #   `https://oracle.example.com/`. They would have broken next.
      # - Clearing it to empty is enough: the same CLI with
      #   AWS_ENDPOINT_URL='' resolves DescribeImages to
      #   `https://ec2.us-east-1.amazonaws.com/`, i.e. empty is read as
      #   unset rather than as an empty endpoint.
      - name: Clear the build cache's Oracle endpoint
        run: echo "AWS_ENDPOINT_URL=" >> "$GITHUB_ENV"

      # Re-assume the CI role, which rewrites AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN and AWS_REGION as one
      # consistent set. Nothing after this point uses the build cache, so
      # trading Oracle's credentials away here costs nothing.
      - name: Re-configure AWS credentials for the test steps (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-real-cloud-tests
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      - name: Fail closed if a real-EC2 test binary is missing
        run: |
          for t in aws_quorum_manager_real_ec2_test ca_cluster_node_real_ec2_test ca_cluster_node_rpc_tls_real_ec2_test; do
            if [ ! -x "build/tests/$t" ]; then
              echo "::error::$t was not built — check LIBSSH2_FOUND/KYTHIRA_HAS_AWS_SDK at configure time." >&2
              exit 1
            fi
          done

      # Separate from the guard above because this binary has its own
      # configure-time gate (Kconfig AWS_S3_PERSISTENCE, which
      # tests/CMakeLists.txt reads as _KYTHIRA_GATE_AWS_S3_PERSISTENCE) —
      # a build with the three real-EC2 binaries present and this one absent
      # is a defconfig question, not a find_package one, and the message has
      # to say so.
      - name: Fail closed if the object-persistence test binary is missing
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' }}
        run: |
          if [ ! -x "build/tests/aws_s3_object_persistence_real_test" ]; then
            echo "::error::aws_s3_object_persistence_real_test was not built — check AWSSDK_FOUND and Kconfig AWS_S3_PERSISTENCE at configure time." >&2
            exit 1
          fi

      # Deliberately the FIRST bundle to run, ahead of the three real-EC2
      # ones. This job mints its credentials at the top and the EC2 bundles
      # can hold the runner for hours; those suites re-federate as they go
      # (KYTHIRA_AWS_WEB_IDENTITY_ROLE_ARN below), but this one takes the
      # static one-hour session credentials as they are. Running it last
      # would reproduce the expired-credential failure the azure job
      # documents, for a suite that finishes in under a minute.
      #
      # Exit 77 is the suite's "not configured" skip. In CI that is a
      # misconfiguration, not a skip — the bundle was explicitly enabled —
      # so it is converted into a loud failure rather than a silent green.
      - name: Run object-persistence bundle (S3)
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' }}
        env:
          KYTHIRA_AWS_S3_BUCKET: ${{ vars.AWS_OBJECT_PERSISTENCE_BUCKET }}
          KYTHIRA_AWS_REGION: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}
        run: |
          rc=0
          ./build/tests/aws_s3_object_persistence_real_test --log_level=test_suite || rc=$?
          if [ $rc -eq 77 ]; then
            echo "::error::The suite skipped for want of configuration, but this bundle was enabled. Check the credentials step, AWS_OBJECT_PERSISTENCE_BUCKET, and that the CI role carries the object-persistence policy." >&2
            exit 1
          fi
          exit $rc

      # aws_quorum_manager_real_ec2_test's own RealEc2Fixture re-resolves
      # the AMI via ec2:DescribeImages in its constructor, which Boost.Test
      # re-runs once per test case (10x per full suite run) when
      # KYTHIRA_TEST_AMI_ID is unset — a real run surfaced this hitting
      # AWS throttling partway through, failing the last few cases with
      # "could not determine AMI" once DescribeImages stopped returning
      # results. Resolving it once here and passing it through
      # KYTHIRA_TEST_AMI_ID (which the fixture already checks first, before
      # ever calling DescribeImages itself) avoids the repeated-call
      # pattern entirely rather than just retrying it.
      - name: Resolve test AMI ID
        if: ${{ env.BUNDLE_EC2_QUORUM == 'true' }}
        id: resolve-ami
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            ARCH=arm64
          else
            ARCH=x86_64
          fi
          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters "Name=name,Values=al2023-ami-*${ARCH}*" "Name=architecture,Values=${ARCH}" "Name=virtualization-type,Values=hvm" \
            --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
            --output text)
          if [ -z "${AMI_ID}" ] || [ "${AMI_ID}" = "None" ]; then
            echo "::error::Could not resolve a current al2023 AMI for architecture ${ARCH}." >&2
            exit 1
          fi
          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"

      - name: Run ec2-quorum-manager bundle
        if: ${{ env.BUNDLE_EC2_QUORUM == 'true' }}
        env:
          KYTHIRA_TEST_IAM_INSTANCE_PROFILE: kythira-aws-quorum-test-node-profile
          KYTHIRA_TEST_AMI_ID: ${{ steps.resolve-ami.outputs.ami_id }}
          # The static session credentials configure-aws-credentials exported
          # expire after one hour; this suite runs longer. The test builds its
          # AWS clients on a provider that re-federates OIDC as they expire
          # (tests/aws_refreshing_credentials_provider.hpp), which needs the
          # role to re-assume — the runner already injects the OIDC token
          # endpoint (ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN) because this job has
          # id-token: write.
          KYTHIRA_AWS_WEB_IDENTITY_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
        run: |
          scripts/run-real-cloud-suite.sh 'real-ec2' '^aws_quorum_manager_real_ec2_test$' \
            "Check that AWS_CI_ROLE_ARN is assumable via OIDC and carries the ec2-quorum-manager policy."

      # Both ca-cluster-node bundles need a pre-built AMI with
      # /usr/local/bin/ca_cluster_node already installed (they SSH in and
      # start the binary directly - unlike ec2-quorum-manager, which only
      # needs a generic AMI). The ami-build job below produces exactly this,
      # tagged kythira:component=ca-cluster-node / kythira:arch, but is its
      # own independent, rarely-run bundle (it creates a new AMI + snapshot
      # every invocation, so it isn't run automatically alongside these
      # tests) - resolve the latest one already built rather than depending
      # on ami-build having just run in this same workflow invocation.
      - name: Resolve ca_cluster_node AMI ID
        if: ${{ env.BUNDLE_CA_CLUSTER == 'true' || env.BUNDLE_CA_CLUSTER_RPC_TLS == 'true' }}
        id: resolve-ca-cluster-ami
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            ARCH=arm64
          else
            ARCH=amd64
          fi
          AMI_ID=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=tag:kythira:component,Values=ca-cluster-node" "Name=tag:kythira:arch,Values=${ARCH}" \
            --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
            --output text)
          if [ -z "${AMI_ID}" ] || [ "${AMI_ID}" = "None" ]; then
            echo "::error::No kythira:component=ca-cluster-node AMI found for architecture ${ARCH}. Run the ami-build bundle at least once first (aws_bundle_ami_build workflow_dispatch input, or REAL_CLOUD_TESTS_AWS_AMI_BUILD_ENABLED)." >&2
            exit 1
          fi
          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"

      # The OIDC session assumed at "Re-configure AWS credentials for the test
      # steps" lasts one hour, and the bundles above it are not bounded by
      # anything: on run 36337979088 the ec2-quorum-manager bundle alone ran
      # 53m43s, so the rpc-tls bundle below started 60m12s after that refresh
      # and every one of its cases failed in the fixture ctor with
      # `ExpiredToken: The security token included in the request is expired`.
      # It read as an rpc-tls defect and was not one.
      #
      # Refresh per bundle rather than raising --session-duration-seconds, for
      # the same reason the audit's refresh below gives: a duration long enough
      # today is silently wrong the first time the suite grows. Re-assuming
      # mid-job works for AWS (the audit step has always done it); note this is
      # NOT true of google-github-actions/auth, whose ID token is fixed at job
      # start.
      - name: Re-configure AWS credentials for the ca-cluster-node bundles (OIDC)
        if: ${{ env.BUNDLE_CA_CLUSTER == 'true' || env.BUNDLE_CA_CLUSTER_RPC_TLS == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-real-cloud-tests-ca-cluster
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      - name: Run ca-cluster-node bundle
        if: ${{ env.BUNDLE_CA_CLUSTER == 'true' }}
        env:
          KYTHIRA_EC2_TEST_AMI: ${{ steps.resolve-ca-cluster-ami.outputs.ami_id }}
        run: |
          scripts/run-real-cloud-suite.sh 'real-ec2' '^ca_cluster_node_real_ec2_test$' \
            "Check AWS_CI_ROLE_ARN's ca-cluster-node policy and that the resolved AMI has /usr/local/bin/ca_cluster_node installed."

      - name: Re-configure AWS credentials for the rpc-tls bundle (OIDC)
        if: ${{ env.BUNDLE_CA_CLUSTER_RPC_TLS == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-real-cloud-tests-rpc-tls
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      - name: Run ca-cluster-node-rpc-tls bundle
        if: ${{ env.BUNDLE_CA_CLUSTER_RPC_TLS == 'true' }}
        env:
          KYTHIRA_EC2_TEST_AMI: ${{ steps.resolve-ca-cluster-ami.outputs.ami_id }}
        run: |
          scripts/run-real-cloud-suite.sh 'real-ec2' '^ca_cluster_node_rpc_tls_real_ec2_test$' \
            "Check AWS_CI_ROLE_ARN's ca-cluster-node policy and that the resolved AMI has /usr/local/bin/ca_cluster_node installed."

      # Post-run audit. Nothing else in this job verifies that teardown
      # actually happened: the tests tear down their own resources, and a
      # test that fails mid-case is exactly the one whose teardown did not
      # finish. `if: always()` because the runs worth auditing are the failed
      # ones.
      #
      # Written after the Alibaba job proved the cost of not having this. Its
      # teardown had been failing since August 24, 2026 for want of one RAM
      # permission, and five instances accrued -- the oldest 29 days old,
      # found only when a human went looking. The audit that should have
      # caught it existed but was itself broken, which is why every failure
      # path below says THE AUDIT DID NOT RUN rather than exiting on a
      # message that reads like a clean result.
      # Fresh credentials for the audit, because the ones the tests ran on
      # have expired by the time it starts.
      #
      # The assumed-role session is 3600s (provision-oidc-role.sh's
      # --session-duration-seconds default) and the audit is the last step of
      # a job whose bundles take longer than that between them. Measured on
      # run 36035268163: credentials were re-configured at 18:43:16, the
      # audit started at 19:48:09 -- 64m53s later -- and every call failed
      # with `RequestExpired: Request has expired`. The audit correctly
      # reported THE AUDIT DID NOT RUN, so it has never yet produced a real
      # answer for AWS on a full run.
      #
      # `if: always()` on this step as well as the audit, and that pairing is
      # the point: a failing bundle is exactly when teardown is most likely
      # to have been skipped, so the audit must still run -- and it cannot
      # run on credentials nobody refreshed. Without `always()` here the
      # refresh would be skipped precisely on the runs that need auditing.
      #
      # Raising --session-duration-seconds was the alternative and was not
      # taken: it needs a number chosen to outlast a job whose length is not
      # bounded by anything, and it would be silently wrong again the first
      # time the suite grew.
      - name: Re-configure AWS credentials for the audit (OIDC)
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-real-cloud-tests-audit
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      - name: Audit for leaked instances
        if: always()
        env:
          AWS_DEFAULT_REGION: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "No AWS credentials in the environment (the credentials step failed or never ran) — nothing to audit with."
            exit 0
          fi
          audit_failed() {
            echo "::error::THE AUDIT DID NOT RUN ($1). This is not a clean result: instances may have outlived teardown and be billing now. Check EC2 in ${AWS_DEFAULT_REGION} for instances tagged kythira:managed-by=ec2_quorum_manager." >&2
            exit 1
          }
          # Scoped by the tag the producer itself applies, not by name: a name
          # prefix would also match anything an operator created by hand.
          #
          # Two values, because the manager is not the only thing here that
          # launches an instance. aws_quorum_manager_real_ec2_test's fixture
          # builds a bastion of its own, and it carried only a Name tag until
          # 2026-09-29 -- so this filter could not see it even when tagging had
          # succeeded, and i-0c7193ec59f352ab2 ran ~44h while this step printed
          # "instances: clean". A tag the audit never reads is not coverage.
          leaked=$(aws ec2 describe-instances \
            --filters 'Name=tag:kythira:managed-by,Values=ec2_quorum_manager,aws_quorum_manager_real_ec2_test' \
                      'Name=instance-state-name,Values=pending,running,shutting-down,stopping,stopped' \
            --query 'Reservations[].Instances[].{id:InstanceId,state:State.Name,type:InstanceType,launched:LaunchTime,cluster:Tags[?Key==`kythira:cluster`]|[0].Value}' \
            --output json) || audit_failed "the DescribeInstances call failed"
          count=$(printf '%s' "${leaked}" | jq 'if . == null then 0 else length end') \
            || audit_failed "DescribeInstances returned a response this step could not parse"
          [ -n "${count}" ] || audit_failed "the parsed instance count was empty"
          found=0
          if [ "${count}" -ne 0 ]; then
            echo "::error::Post-run audit found ${count} non-terminated instance(s) carrying kythira:managed-by — teardown did not complete. They are being billed." >&2
            printf '%s' "${leaked}" | jq . >&2
            found=1
          else
            echo "instances: clean (nothing non-terminated carrying kythira:managed-by)."
          fi

          # Instances are not the only thing these tests create, and were not
          # the thing that actually leaked. The real-EC2 fixture builds a
          # whole network per case -- VPC, subnets, internet and NAT
          # gateways, route tables, NACLs -- each tagged Name=kyt-<uuid>-*,
          # and tears them down in-process. A case that dies partway, or a
          # delete that fails on a lingering dependency, orphans the network
          # with nothing left that can find it again: until this commit the
          # bundle's IAM policy granted Create/Delete for all of it and no
          # Describe at all, so neither teardown nor any audit could
          # enumerate what it had lost track of.
          #
          # Measured on 2026-09-22: 19 `kyt-*-vpc` VPCs had accumulated in
          # us-east-1 and the run failed with "CreateVpc: The maximum number
          # of VPCs has been reached", while the instance audit above --
          # truthfully -- reported clean.
          #
          # NAT gateways are checked separately and first among the network
          # resources because they are the ones that cost money by the hour;
          # a leaked VPC is free and merely exhausts a quota.
          nat=$(aws ec2 describe-nat-gateways \
            --filter 'Name=tag:Name,Values=kyt-*' 'Name=state,Values=available,pending' \
            --query 'NatGateways[].{id:NatGatewayId,state:State,vpc:VpcId,created:CreateTime}' \
            --output json) || audit_failed "the DescribeNatGateways call failed"
          nat_count=$(printf '%s' "${nat}" | jq 'if . == null then 0 else length end') \
            || audit_failed "DescribeNatGateways returned a response this step could not parse"
          [ -n "${nat_count}" ] || audit_failed "the parsed NAT gateway count was empty"
          if [ "${nat_count}" -ne 0 ]; then
            echo "::error::Post-run audit found ${nat_count} NAT gateway(s) tagged kyt-* — these bill hourly." >&2
            printf '%s' "${nat}" | jq . >&2
            found=1
          else
            echo "nat gateways: clean."
          fi

          # A denial here means the role predates this bundle's
          # ec2:DescribeVpcs grant; re-run
          # scripts/ci-cloud-credentials/aws/provision-oidc-role.sh. It is
          # reported as the audit not running rather than as clean, because
          # that is what it is.
          # Two filters, because the real-EC2 fixture is not the only thing
          # here that builds a VPC and it is the only one that tags what it
          # builds.
          #
          # `ca_cluster_node_real_ec2_test` and
          # `ca_cluster_node_rpc_tls_real_ec2_test` create their own VPCs at
          # the hardcoded 10.220.0.0/16 and 10.221.0.0/16 and apply **no tags
          # at all**, so a Name filter cannot see them. Found on 2026-09-25:
          # two such VPCs were sitting in the account while the tagged audit
          # reported on five others and, truthfully, never mentioned these.
          #
          # Matching them by CIDR works because those blocks are compile-time
          # constants in the tests rather than anything the run chooses. The
          # better fix is for those tests to tag what they create, the way
          # aws_ec2_quorum_manager does; until then this filter is what
          # notices, and it is deliberately exact rather than a 10.22x
          # wildcard so it can never claim a VPC these tests did not make.
          vpcs=$(aws ec2 describe-vpcs \
            --filters 'Name=tag:Name,Values=kyt-*-vpc' \
            --query 'Vpcs[].{id:VpcId,cidr:CidrBlock,name:Tags[?Key==`Name`]|[0].Value}' \
            --output json) || audit_failed "the DescribeVpcs call failed — if this is an authorization error, re-run provision-oidc-role.sh to pick up the ec2:DescribeVpcs grant"
          ca_vpcs=$(aws ec2 describe-vpcs \
            --filters 'Name=cidr,Values=10.220.0.0/16,10.221.0.0/16' \
            --query 'Vpcs[?IsDefault==`false`].{id:VpcId,cidr:CidrBlock,name:`ca-cluster-node (untagged)`}' \
            --output json) || audit_failed "the DescribeVpcs call for the ca-cluster-node CIDRs failed"
          # unique_by(.id), because the two filters now overlap. Before the
          # ca-cluster-node fixtures tagged what they create they matched only the
          # CIDR query; now they carry kyt-*-vpc Name tags too, so every one of
          # them matches BOTH and a plain `add` counts it twice. Measured on run
          # 36612317090: 7 leaked VPCs reported as 11, with half the dependency
          # inventory printed twice.
          #
          # The CIDR query still earns its place -- CreateVpc and CreateTags are
          # two calls, so a fixture that dies between them leaks a VPC with no
          # Name tag at all -- but overlap is now the normal case rather than the
          # exception, and an audit that inflates its own count is one nobody
          # will trust the next time it reports a real number.
          vpcs=$(printf '%s\n%s' "${vpcs}" "${ca_vpcs}" \
            | jq -s 'add // [] | unique_by(.id)') \
            || audit_failed "the two VPC listings could not be combined"
          vpc_count=$(printf '%s' "${vpcs}" | jq 'if . == null then 0 else length end') \
            || audit_failed "DescribeVpcs returned a response this step could not parse"
          [ -n "${vpc_count}" ] || audit_failed "the parsed VPC count was empty"
          if [ "${vpc_count}" -ne 0 ]; then
            echo "::error::Post-run audit found ${vpc_count} kyt-*-vpc VPC(s) — teardown did not complete. These do not bill, but the per-region VPC quota is finite and CreateVpc fails for every later run once it is reached." >&2
            printf '%s' "${vpcs}" | jq . >&2
            found=1
          else
            echo "vpcs: clean."
          fi

          # The instance check at the top of this step is scoped by tag, which
          # is the same blind spot the VPC filter had: an instance the fixture
          # never tagged is invisible to it. Measured on 2026-09-29 --
          # i-0c7193ec59f352ab2, a t4g.micro with no tags and no key pair, ran
          # ~44h inside a leaked kyt-* VPC while BOTH legs of run 36426191450
          # printed "instances: clean". Unlike a leaked VPC, which only costs
          # quota, an instance bills for every hour it survives, so this is the
          # blind spot that costs money.
          #
          # Scoped by the leaked VPCs just found, not by "untagged anywhere":
          # an instance inside a network this audit already believes is an
          # orphaned test VPC is certainly a test leak, whereas an
          # untagged-instance-anywhere filter would fire on anything an
          # operator launched by hand -- and a false alarm here trains the
          # reader to ignore the one alarm that guards spend. The narrowing
          # costs no coverage: a running instance keeps its VPC alive, so a
          # test VPC that tore down successfully cannot still hold one.
          leaked_vpc_ids=$(printf '%s' "${vpcs}" | jq -r '.[].id' | tr '\n' ' ') \
            || audit_failed "the leaked-VPC id list could not be extracted"
          if [ -n "${leaked_vpc_ids// /}" ]; then
            vpc_csv=$(printf '%s' "${leaked_vpc_ids}" | tr -s ' ' ',' | sed 's/^,//; s/,$//')
            stragglers=$(aws ec2 describe-instances \
              --filters "Name=vpc-id,Values=${vpc_csv}" \
                        'Name=instance-state-name,Values=pending,running,shutting-down,stopping,stopped' \
              --query 'Reservations[].Instances[].{id:InstanceId,state:State.Name,type:InstanceType,launched:LaunchTime,vpc:VpcId,managedBy:Tags[?Key==`kythira:managed-by`]|[0].Value}' \
              --output json) || audit_failed "the DescribeInstances call scoped to leaked VPCs failed"
            straggler_count=$(printf '%s' "${stragglers}" | jq 'if . == null then 0 else length end') \
              || audit_failed "the leaked-VPC instance listing could not be parsed"
            [ -n "${straggler_count}" ] || audit_failed "the parsed leaked-VPC instance count was empty"
            if [ "${straggler_count}" -ne 0 ]; then
              echo "::error::Post-run audit found ${straggler_count} non-terminated instance(s) inside leaked VPC(s) — including any the kythira:managed-by filter above cannot see. They are being billed." >&2
              printf '%s' "${stragglers}" | jq . >&2
              found=1
            else
              echo "instances inside leaked VPCs: none."
            fi

            # What is actually holding each leaked VPC. A non-default network
            # ACL blocks DeleteVpc even with no subnets attached, and nothing
            # else here looks for one: on 2026-09-29 four of eleven leaked VPCs
            # failed DeleteVpc with DependencyViolation for exactly that, and
            # the API never names the dependency. Printing the inventory means
            # the next cleanup does not have to rediscover it.
            #
            # A denied Describe is reported as denied, never as an empty list —
            # an inventory that cannot see is not an inventory that found
            # nothing. If these read "(denied)", the role is missing the grant;
            # re-run scripts/ci-cloud-credentials/aws/provision-oidc-role.sh.
            for vid in ${leaked_vpc_ids}; do
              acls=$(aws ec2 describe-network-acls --filters "Name=vpc-id,Values=${vid}" \
                --query 'NetworkAcls[?IsDefault==`false`].NetworkAclId' --output text) || acls="(denied)"
              subs=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${vid}" \
                --query 'Subnets[].SubnetId' --output text) || subs="(denied)"
              igws=$(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=${vid}" \
                --query 'InternetGateways[].InternetGatewayId' --output text) || igws="(denied)"
              sgs=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=${vid}" \
                --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text) || sgs="(denied)"
              echo "  ${vid} holds: nacls=[${acls:-none}] subnets=[${subs:-none}] igws=[${igws:-none}] sgs=[${sgs:-none}]"
            done
          fi

          [ "${found}" -eq 0 ] || exit 1
          echo "Post-run audit clean: no leaked instances (tagged or not), NAT gateways or VPCs in ${AWS_DEFAULT_REGION}."

  # ── AWS: aws_asg_quorum_manager (.kiro/specs/aws-asg-real-cloud-tests/) ──
  # Its own job rather than a step in `aws` above, for two reasons:
  #
  # - Time. `aws` already sums 345 minutes of worst-case CTest TIMEOUT
  #   against its 360-minute cap, and this suite's own TIMEOUT is another
  #   20700s (345 min, derived in tests/CMakeLists.txt). Appended there, a
  #   worst-case run would be killed by the job timeout mid-case, which is a
  #   SIGKILL that strands whatever that case created.
  # - The sweep. Its tag-scoped delete is only safe while no second run of
  #   this suite is live, so this job is serialised across runs by its own
  #   concurrency group, and runs after `aws` so the two never compete for
  #   the region's VPC quota.
  #
  # No workflow_dispatch input of its own (Requirement 6): the file is at
  # GitHub's 25-input cap. `aws_bundle_ec2_quorum` selects both
  # quorum-manager suites on dispatch; on a schedule this job follows its
  # own REAL_CLOUD_TESTS_AWS_ASG_QUORUM_ENABLED variable, independently of
  # REAL_CLOUD_TESTS_AWS_EC2_QUORUM_ENABLED.
  aws-asg:
    name: Real Cloud Tests (AWS ASG, ${{ matrix.arch_label }})
    needs: aws
    concurrency:
      group: real-cloud-aws-asg-${{ github.repository }}
      # A run already holding real groups must reach its own teardown.
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    # always(): `needs: aws` is for ordering only. Without it this job is
    # skipped whenever `aws` fails or is itself skipped.
    if: |
      always()
      && (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.aws_enabled == 'true'
        || (github.event.inputs.aws_enabled == null && vars.REAL_CLOUD_TESTS_AWS_ENABLED == 'true'))
      && (github.event.inputs.aws_bundle_ec2_quorum == 'true'
        || (github.event.inputs.aws_bundle_ec2_quorum == null && vars.REAL_CLOUD_TESTS_AWS_ASG_QUORUM_ENABLED == 'true'))
    strategy:
      fail-fast: false
      # One leg at a time: each leg's sweep would delete the other's live
      # groups, since both carry the same suite tag.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            arch_label: x64
          - os: ubuntu-24.04-arm
            arch_label: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if AWS_CI_ROLE_ARN is unset
        if: ${{ vars.AWS_CI_ROLE_ARN == '' }}
        run: |
          echo "::error::The asg-quorum-manager bundle is enabled but the AWS_CI_ROLE_ARN repository variable is unset. See scripts/ci-cloud-credentials/aws/README.md." >&2
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-real-cloud-tests-asg
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      # Requirement 6.4: an enabled bundle whose prerequisites are missing
      # fails here, before the build, naming what is missing. Without the
      # bundle the role cannot even describe a group, and the suite would
      # fail only after an hour of compiling.
      - name: Fail closed if the CI role lacks the asg-quorum-manager bundle
        run: |
          if ! out=$(aws autoscaling describe-auto-scaling-groups --max-items 1 2>&1); then
            echo "::error::The asg-quorum-manager bundle is enabled but the CI role cannot call autoscaling:DescribeAutoScalingGroups: ${out}. Re-run scripts/ci-cloud-credentials/aws/provision-oidc-role.sh with the asg-quorum-manager bundle." >&2
            exit 1
          fi

      # ── System dependencies (identical to ci.yml's build-and-test job) ────
      # Retries the whole update+install cycle: the ubuntu-24.04-arm runner
      # image has been observed losing outbound HTTP(S) route to
      # ports.ubuntu.com for a minute or more at a time, well past what
      # apt's own per-package retry window covers.
      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          # autoconf/autoconf-archive/automake/libtool: see ci.yml's own
          # "Install system dependencies" step for why (vcpkg's gperf port,
          # a host-tool dependency of proxygen -- now an unconditional
          # vcpkg.json dependency like boost-beast, so any workflow running
          # `vcpkg install` against this manifest needs these regardless of
          # which Kconfig transports it actually builds).
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 \
                 cmake \
                 ninja-build \
                 libfiu-dev \
                 ccache \
                 autoconf \
                 autoconf-archive \
                 automake \
                 libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

