      # KYTHIRA_AWS_WEB_IDENTITY_ROLE_ARN lets the suite re-federate through
      # GitHub OIDC on its own, because its worst case far outlasts the one
      # hour the credentials above are good for. The suite resolves its own
      # Amazon Linux 2023 AMI for the runner's architecture.
