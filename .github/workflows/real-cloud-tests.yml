name: Real Cloud Tests

# Runs this project's real-cloud integration tests (today: AWS and GCP —
# see .kiro/specs/ci-real-cloud-tests/ and .kiro/specs/gcp-cloud-services/)
# against actual cloud-provider infrastructure, authenticated via short-lived
# OIDC-federated credentials (AWS role assumption / GCP Workload Identity
# Federation) — no long-lived keys stored as CI secrets.
# Deliberately decoupled from ci.yml: ci.yml's own -LE label filter already
# excludes every real-ec2-labeled test from every ordinary push/PR run, and
# this workflow never modifies that file. Gated by three independent
# on/off levels — see scripts/ci-cloud-credentials/README.md.

on:
  workflow_dispatch:
    inputs:
      run_real_cloud_tests:
        description: "Master switch (overrides REAL_CLOUD_TESTS_ENABLED for this run only)"
        type: boolean
        required: false
      aws_enabled:
        description: "AWS (overrides REAL_CLOUD_TESTS_AWS_ENABLED for this run only)"
        type: boolean
        required: false
      aws_bundle_ec2_quorum:
        description: "AWS bundle: ec2-quorum-manager"
        type: boolean
        required: false
      aws_bundle_ca_cluster:
        description: "AWS bundle: ca-cluster-node"
        type: boolean
        required: false
      aws_bundle_ca_cluster_rpc_tls:
        description: "AWS bundle: ca-cluster-node-rpc-tls"
        type: boolean
        required: false
      aws_bundle_ami_build:
        description: "AWS bundle: ami-build (builds the ca_cluster_node AMI via Packer)"
        type: boolean
        required: false
      aws_bundle_object_persistence:
        description: "AWS bundle: object-persistence (S3 objects only, ~free)"
        type: boolean
        required: false
      azure_enabled:
        description: "Azure (overrides REAL_CLOUD_TESTS_AZURE_ENABLED for this run only)"
        type: boolean
        required: false
      azure_bundle_quorum_manager:
        description: "Azure bundle: quorum-manager (VM + VMSS)"
        type: boolean
        required: false
      azure_bundle_key_vault:
        description: "Azure bundle: key-vault (azure_key_vault_ca_provider)"
        type: boolean
        required: false
      azure_bundle_object_persistence:
        description: "Azure bundle: object-persistence (Blob objects only, ~free)"
        type: boolean
        required: false
      gcp_enabled:
        description: "GCP (overrides REAL_CLOUD_TESTS_GCP_ENABLED for this run only)"
        type: boolean
        required: false
      gcp_bundle_quorum_manager:
        description: "GCP bundle: quorum-manager (Compute Engine + MIG suites)"
        type: boolean
        required: false
      gcp_bundle_privateca:
        description: "GCP bundle: privateca (Certificate Authority Service)"
        type: boolean
        required: false
      gcp_bundle_object_persistence:
        description: "GCP bundle: object-persistence (GCS objects only, ~free)"
        type: boolean
        required: false
      # Deliberately no oci_bundle_* inputs. The oci job drives its bundles
      # from repository variables alone (see its `env:` block) — including the
      # object-persistence bundle added for
      # .kiro/specs/cloud-object-persistence/ task 17. Adding dispatch inputs
      # for OCI would mean changing how every OCI bundle is selected, not just
      # the new one, so the difference is preserved rather than smoothed over.
      oci_enabled:
        description: "OCI (not yet implemented — see doc/TODO.md Cloud Provider Support)"
        type: boolean
        required: false
      alibaba_enabled:
        description: "Alibaba Cloud (overrides REAL_CLOUD_TESTS_ALIBABA_ENABLED for this run only)"
        type: boolean
        required: false
      alibaba_bundle_ess_quorum:
        description: "Alibaba bundle: ess-quorum-manager (launches a real ECS instance)"
        type: boolean
        required: false
      alibaba_bundle_oss_persistence:
        description: "Alibaba bundle: oss-persistence (OSS objects only, ~free)"
        type: boolean
        required: false
      # Cloud-vendor monitoring-config tests (doc/TODO.md "Metrics
      # Backends", real-cloud tier): each stands up the routing mechanism
      # its example config in docker/cloud-monitoring/ describes against
      # the real vendor service — no C++ build involved, so these are their
      # own lightweight jobs with their own toggles rather than bundles
      # inside the provider test jobs above.
      aws_monitoring_enabled:
        description: "AWS CloudWatch monitoring config (overrides REAL_CLOUD_TESTS_AWS_MONITORING_ENABLED for this run only)"
        type: boolean
        required: false
      azure_monitoring_enabled:
        description: "Azure Monitor monitoring config (overrides REAL_CLOUD_TESTS_AZURE_MONITORING_ENABLED for this run only)"
        type: boolean
        required: false
      gcp_monitoring_enabled:
        description: "GCP Cloud Monitoring monitoring config (overrides REAL_CLOUD_TESTS_GCP_MONITORING_ENABLED for this run only)"
        type: boolean
        required: false
      oci_monitoring_enabled:
        description: "OCI Monitoring monitoring config (overrides REAL_CLOUD_TESTS_OCI_MONITORING_ENABLED for this run only)"
        type: boolean
        required: false
      alibaba_monitoring_enabled:
        description: "Alibaba CloudMonitor monitoring config (overrides REAL_CLOUD_TESTS_ALIBABA_MONITORING_ENABLED for this run only)"
        type: boolean
        required: false
  schedule:
    # Monday 06:00 UTC — balances catching real-infrastructure drift early
    # against not incurring real cloud spend needlessly. Adjust freely.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # ── AWS ──────────────────────────────────────────────────────────────────
  # Runs on both x86_64 and native arm64 runners so the Graviton/arm64 branch
  # in tests/aws_quorum_manager_real_ec2_test.cpp (instance-type fallback,
  # AMI architecture filter, target_arch selection) actually gets compiled
  # and exercised by CI instead of only ever existing as unbuilt source on an
  # x86_64-only runner. See .kiro/specs/arm64-ci-verification/ Requirement 7.
  aws:
    name: Real Cloud Tests (AWS, ${{ matrix.arch_label }})
    runs-on: ${{ matrix.os }}
    # All three bundle ctest steps below can run sequentially in this one
    # job when every bundle is enabled. Sum of their own worst-case CTest
    # TIMEOUT properties (tests/CMakeLists.txt): 10800s (ec2-quorum-manager)
    # + 900s (ca-cluster-node) + 9000s (ca-cluster-node-rpc-tls) = 345 min,
    # plus build/checkout/credential overhead. 360 is GitHub Actions'
    # own default job timeout cap for hosted runners, so this is set
    # explicitly to that ceiling rather than left implicit. Applies to both
    # the x64 and arm64 matrix legs — the sequential-bundle math above
    # doesn't depend on architecture.
    timeout-minutes: 360
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.aws_enabled == 'true'
        || (github.event.inputs.aws_enabled == null && vars.REAL_CLOUD_TESTS_AWS_ENABLED == 'true'))

    strategy:
      fail-fast: false
      # Run the x64 and arm64 legs one at a time, not concurrently. Each test
      # case stands up a full VPC (with a NAT gateway, an EIP and up to nine
      # instances) against a test account on the default per-region service
      # quotas (5 VPCs, 5 EIPs). Two legs running at once double the peak
      # footprint, and when both were simultaneously inside the long 9-node
      # AZ-outage cases — which hold their VPC for tens of minutes — the
      # combined demand exceeded the 5-VPC limit and CreateVpc started failing
      # with "maximum number of VPCs has been reached". Serialising the legs
      # keeps peak usage to a single leg's worth (verified to fit), at the cost
      # of ~2x wall-clock on this weekly/on-demand workflow.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            arch_label: x64
          - os: ubuntu-24.04-arm
            arch_label: arm64

    env:
      BUNDLE_EC2_QUORUM: ${{ (github.event.inputs.aws_bundle_ec2_quorum == 'true') || (github.event.inputs.aws_bundle_ec2_quorum == null && vars.REAL_CLOUD_TESTS_AWS_EC2_QUORUM_ENABLED == 'true') }}
      BUNDLE_CA_CLUSTER: ${{ (github.event.inputs.aws_bundle_ca_cluster == 'true') || (github.event.inputs.aws_bundle_ca_cluster == null && vars.REAL_CLOUD_TESTS_AWS_CA_CLUSTER_ENABLED == 'true') }}
      BUNDLE_CA_CLUSTER_RPC_TLS: ${{ (github.event.inputs.aws_bundle_ca_cluster_rpc_tls == 'true') || (github.event.inputs.aws_bundle_ca_cluster_rpc_tls == null && vars.REAL_CLOUD_TESTS_AWS_CA_CLUSTER_RPC_TLS_ENABLED == 'true') }}
      # .kiro/specs/cloud-object-persistence/ task 17. Unlike the three
      # bundles above this one launches nothing — it writes, reads and
      # deletes objects under a single prefix of an existing bucket — so it
      # contributes no meaningful wall-clock to this job's 360-minute budget
      # and runs on both matrix legs rather than being pinned to x64.
      BUNDLE_OBJECT_PERSISTENCE: ${{ (github.event.inputs.aws_bundle_object_persistence == 'true') || (github.event.inputs.aws_bundle_object_persistence == null && vars.REAL_CLOUD_TESTS_AWS_OBJECT_PERSISTENCE_ENABLED == 'true') }}
      # ccache >=4.0 defaults to ~/.cache/ccache, not ~/.ccache — without
      # this, the Restore/Save ccache steps below (path: ~/.ccache) never
      # see what ccache actually wrote. See ci.yml's build-and-test job for
      # the same fix and .kiro/specs/ccache-adoption/ Task 7 for how this
      # was found (every restore silently missed, Save failed outright).
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if AWS_CI_ROLE_ARN is unset
        if: ${{ vars.AWS_CI_ROLE_ARN == '' }}
        run: |
          echo "::error::REAL_CLOUD_TESTS_AWS_ENABLED is true but the AWS_CI_ROLE_ARN repository variable is unset. See scripts/ci-cloud-credentials/aws/README.md." >&2
          exit 1

      # A job whose every bundle is disabled still builds, authenticates and
      # reports success while running zero tests. run-real-cloud-suite.sh's
      # own skip guard cannot catch this: a step disabled by `if:` never runs
      # the script at all. See this job's sibling guard in the azure job for
      # the real occurrence that motivated adding these.
      - name: Fail closed if no test bundle is enabled
        if: ${{ env.BUNDLE_EC2_QUORUM != 'true' && env.BUNDLE_CA_CLUSTER != 'true' && env.BUNDLE_CA_CLUSTER_RPC_TLS != 'true' && env.BUNDLE_OBJECT_PERSISTENCE != 'true' }}
        run: |
          echo "::error::The AWS job was enabled but every test bundle is disabled, so it would run zero tests and still report success. Set one or more of REAL_CLOUD_TESTS_AWS_EC2_QUORUM_ENABLED / REAL_CLOUD_TESTS_AWS_CA_CLUSTER_ENABLED / REAL_CLOUD_TESTS_AWS_CA_CLUSTER_RPC_TLS_ENABLED / REAL_CLOUD_TESTS_AWS_OBJECT_PERSISTENCE_ENABLED, or pass the aws_bundle_* workflow_dispatch inputs." >&2
          exit 1

      # The bucket is an operator-owned prerequisite — the engine reads and
      # writes objects and never administers storage — so an unset variable
      # can only surface as the suite's exit-77 skip, which the run step
      # below converts into a failure. Failing here instead names the
      # variable rather than leaving a scavenger hunt, and it does so before
      # the ~1 hour build rather than after it.
      - name: Fail closed if the object-persistence bucket variable is unset
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' && vars.AWS_OBJECT_PERSISTENCE_BUCKET == '' }}
        run: |
          echo "::error::The object-persistence bundle is enabled but the AWS_OBJECT_PERSISTENCE_BUCKET repository variable is unset. Run scripts/ci-cloud-credentials/aws/provision-object-persistence-bucket.sh and set the variable it prints." >&2
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-real-cloud-tests
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      # ── System dependencies (identical to ci.yml's build-and-test job) ────
      # Retries the whole update+install cycle: the ubuntu-24.04-arm runner
      # image has been observed losing outbound HTTP(S) route to
      # ports.ubuntu.com for a minute or more at a time, well past what
      # apt's own per-package retry window covers.
      - name: Install system dependencies
        run: |
          # autoconf/autoconf-archive/automake/libtool: see ci.yml's own
          # "Install system dependencies" step for why (vcpkg's gperf port,
          # a host-tool dependency of proxygen -- now an unconditional
          # vcpkg.json dependency like boost-beast, so any workflow running
          # `vcpkg install` against this manifest needs these regardless of
          # which Kconfig transports it actually builds).
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 \
                 cmake \
                 ninja-build \
                 libfiu-dev \
                 ccache \
                 autoconf \
                 autoconf-archive \
                 automake \
                 libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            echo "value=arm64-linux" >> "$GITHUB_OUTPUT"
          else
            echo "value=x64-linux" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          # runner.arch keeps the x64 and arm64 legs' caches isolated from
          # each other (.kiro/specs/arm64-ci-verification/ Requirement 4).
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}

      # vcpkg's x-gha binary cache talks to the Actions cache API directly, but
      # ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN are only exposed to actions, not
      # to `run:` steps. This re-exports them so the vcpkg invocation below can
      # reach the cache.
      - name: Export Actions cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          export VCPKG_BINARY_SOURCES='clear;x-gha,readwrite'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      # ccache: lower priority than ci.yml's own jobs since this workflow only
      # runs weekly/on-demand (a longer cache-reuse window, smaller practical
      # benefit), but the same restore-broad/save-unique mechanism as
      # ci.yml's build-and-test/coverage jobs. runner.arch is part of the key
      # for the same reason as the vcpkg cache key above — this job now has
      # both x64 and arm64 legs, and runner.os alone is "Linux" for both.
      # See .kiro/specs/ccache-adoption/ and
      # .kiro/specs/arm64-ci-verification/ Requirement 4.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-realcloud-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-realcloud-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
            ccache-realcloud-${{ runner.os }}-${{ runner.arch }}-

      - name: ccache size limit
        run: ccache --max-size=2G

      - name: Configure (Release, real-cloud tests enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            -DKYTHIRA_AWS_REAL_EC2_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-realcloud-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Fail closed if a real-EC2 test binary is missing
        run: |
          for t in aws_quorum_manager_real_ec2_test ca_cluster_node_real_ec2_test ca_cluster_node_rpc_tls_real_ec2_test; do
            if [ ! -x "build/tests/$t" ]; then
              echo "::error::$t was not built — check LIBSSH2_FOUND/KYTHIRA_HAS_AWS_SDK at configure time." >&2
              exit 1
            fi
          done

      # Separate from the guard above because this binary has its own
      # configure-time gate (Kconfig AWS_S3_PERSISTENCE, which
      # tests/CMakeLists.txt reads as _KYTHIRA_GATE_AWS_S3_PERSISTENCE) —
      # a build with the three real-EC2 binaries present and this one absent
      # is a defconfig question, not a find_package one, and the message has
      # to say so.
      - name: Fail closed if the object-persistence test binary is missing
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' }}
        run: |
          if [ ! -x "build/tests/aws_s3_object_persistence_real_test" ]; then
            echo "::error::aws_s3_object_persistence_real_test was not built — check AWSSDK_FOUND and Kconfig AWS_S3_PERSISTENCE at configure time." >&2
            exit 1
          fi

      # Deliberately the FIRST bundle to run, ahead of the three real-EC2
      # ones. This job mints its credentials at the top and the EC2 bundles
      # can hold the runner for hours; those suites re-federate as they go
      # (KYTHIRA_AWS_WEB_IDENTITY_ROLE_ARN below), but this one takes the
      # static one-hour session credentials as they are. Running it last
      # would reproduce the expired-credential failure the azure job
      # documents, for a suite that finishes in under a minute.
      #
      # Exit 77 is the suite's "not configured" skip. In CI that is a
      # misconfiguration, not a skip — the bundle was explicitly enabled —
      # so it is converted into a loud failure rather than a silent green.
      - name: Run object-persistence bundle (S3)
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' }}
        env:
          KYTHIRA_AWS_S3_BUCKET: ${{ vars.AWS_OBJECT_PERSISTENCE_BUCKET }}
          KYTHIRA_AWS_REGION: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}
        run: |
          rc=0
          ./build/tests/aws_s3_object_persistence_real_test --log_level=test_suite || rc=$?
          if [ $rc -eq 77 ]; then
            echo "::error::The suite skipped for want of configuration, but this bundle was enabled. Check the credentials step, AWS_OBJECT_PERSISTENCE_BUCKET, and that the CI role carries the object-persistence policy." >&2
            exit 1
          fi
          exit $rc

      # aws_quorum_manager_real_ec2_test's own RealEc2Fixture re-resolves
      # the AMI via ec2:DescribeImages in its constructor, which Boost.Test
      # re-runs once per test case (10x per full suite run) when
      # KYTHIRA_TEST_AMI_ID is unset — a real run surfaced this hitting
      # AWS throttling partway through, failing the last few cases with
      # "could not determine AMI" once DescribeImages stopped returning
      # results. Resolving it once here and passing it through
      # KYTHIRA_TEST_AMI_ID (which the fixture already checks first, before
      # ever calling DescribeImages itself) avoids the repeated-call
      # pattern entirely rather than just retrying it.
      - name: Resolve test AMI ID
        if: ${{ env.BUNDLE_EC2_QUORUM == 'true' }}
        id: resolve-ami
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            ARCH=arm64
          else
            ARCH=x86_64
          fi
          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters "Name=name,Values=al2023-ami-*${ARCH}*" "Name=architecture,Values=${ARCH}" "Name=virtualization-type,Values=hvm" \
            --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
            --output text)
          if [ -z "${AMI_ID}" ] || [ "${AMI_ID}" = "None" ]; then
            echo "::error::Could not resolve a current al2023 AMI for architecture ${ARCH}." >&2
            exit 1
          fi
          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"

      - name: Run ec2-quorum-manager bundle
        if: ${{ env.BUNDLE_EC2_QUORUM == 'true' }}
        env:
          KYTHIRA_TEST_IAM_INSTANCE_PROFILE: kythira-aws-quorum-test-node-profile
          KYTHIRA_TEST_AMI_ID: ${{ steps.resolve-ami.outputs.ami_id }}
          # The static session credentials configure-aws-credentials exported
          # expire after one hour; this suite runs longer. The test builds its
          # AWS clients on a provider that re-federates OIDC as they expire
          # (tests/aws_refreshing_credentials_provider.hpp), which needs the
          # role to re-assume — the runner already injects the OIDC token
          # endpoint (ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN) because this job has
          # id-token: write.
          KYTHIRA_AWS_WEB_IDENTITY_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
        run: |
          scripts/run-real-cloud-suite.sh 'real-ec2' '^aws_quorum_manager_real_ec2_test$' \
            "Check that AWS_CI_ROLE_ARN is assumable via OIDC and carries the ec2-quorum-manager policy."

      # Both ca-cluster-node bundles need a pre-built AMI with
      # /usr/local/bin/ca_cluster_node already installed (they SSH in and
      # start the binary directly - unlike ec2-quorum-manager, which only
      # needs a generic AMI). The ami-build job below produces exactly this,
      # tagged kythira:component=ca-cluster-node / kythira:arch, but is its
      # own independent, rarely-run bundle (it creates a new AMI + snapshot
      # every invocation, so it isn't run automatically alongside these
      # tests) - resolve the latest one already built rather than depending
      # on ami-build having just run in this same workflow invocation.
      - name: Resolve ca_cluster_node AMI ID
        if: ${{ env.BUNDLE_CA_CLUSTER == 'true' || env.BUNDLE_CA_CLUSTER_RPC_TLS == 'true' }}
        id: resolve-ca-cluster-ami
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            ARCH=arm64
          else
            ARCH=amd64
          fi
          AMI_ID=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=tag:kythira:component,Values=ca-cluster-node" "Name=tag:kythira:arch,Values=${ARCH}" \
            --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
            --output text)
          if [ -z "${AMI_ID}" ] || [ "${AMI_ID}" = "None" ]; then
            echo "::error::No kythira:component=ca-cluster-node AMI found for architecture ${ARCH}. Run the ami-build bundle at least once first (aws_bundle_ami_build workflow_dispatch input, or REAL_CLOUD_TESTS_AWS_AMI_BUILD_ENABLED)." >&2
            exit 1
          fi
          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"

      - name: Run ca-cluster-node bundle
        if: ${{ env.BUNDLE_CA_CLUSTER == 'true' }}
        env:
          KYTHIRA_EC2_TEST_AMI: ${{ steps.resolve-ca-cluster-ami.outputs.ami_id }}
        run: |
          scripts/run-real-cloud-suite.sh 'real-ec2' '^ca_cluster_node_real_ec2_test$' \
            "Check AWS_CI_ROLE_ARN's ca-cluster-node policy and that the resolved AMI has /usr/local/bin/ca_cluster_node installed."

      - name: Run ca-cluster-node-rpc-tls bundle
        if: ${{ env.BUNDLE_CA_CLUSTER_RPC_TLS == 'true' }}
        env:
          KYTHIRA_EC2_TEST_AMI: ${{ steps.resolve-ca-cluster-ami.outputs.ami_id }}
        run: |
          scripts/run-real-cloud-suite.sh 'real-ec2' '^ca_cluster_node_rpc_tls_real_ec2_test$' \
            "Check AWS_CI_ROLE_ARN's ca-cluster-node policy and that the resolved AMI has /usr/local/bin/ca_cluster_node installed."

  # ── AWS: ca_cluster_node AMI build (Packer) ─────────────────────────────
  # Independent of the `aws` job above: builds a new AMI (and its backing
  # snapshot) on every run, which persists and accrues storage cost until an
  # operator deregisters it — see packer/ca_cluster_node/README.md's cleanup
  # section — so this is its own explicitly-toggled bundle, never bundled
  # into the weekly ca-cluster-node real-EC2 test run.
  # .kiro/specs/ca-cluster-node-ami/ Requirement 13.
  ami-build:
    name: Build ca_cluster_node AMI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.aws_enabled == 'true'
        || (github.event.inputs.aws_enabled == null && vars.REAL_CLOUD_TESTS_AWS_ENABLED == 'true'))
      && (github.event.inputs.aws_bundle_ami_build == 'true'
        || (github.event.inputs.aws_bundle_ami_build == null && vars.REAL_CLOUD_TESTS_AWS_AMI_BUILD_ENABLED == 'true'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if AWS_CI_ROLE_ARN is unset
        if: ${{ vars.AWS_CI_ROLE_ARN == '' }}
        run: |
          echo "::error::REAL_CLOUD_TESTS_AWS_AMI_BUILD_ENABLED is true but the AWS_CI_ROLE_ARN repository variable is unset. See scripts/ci-cloud-credentials/aws/README.md." >&2
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-ami-build
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      # Retries the whole repo-setup+update+install cycle: the
      # ubuntu-24.04-arm runner image has been observed losing outbound
      # HTTP(S) route to ports.ubuntu.com for a minute or more at a time,
      # well past what apt's own per-package retry window covers.
      - name: Install Packer
        run: |
          for attempt in 1 2 3; do
            if timeout 120 curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add - \
                 && timeout 300 sudo apt-add-repository "deb [arch=$(dpkg --print-architecture)] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
                 && timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends packer; then
              exit 0
            fi
            echo "::warning::Packer install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::Packer install failed after 3 attempts" >&2
          exit 1

      # extract-binary.sh's Docker build (invoked by "Build AMI" below)
      # COPYs this entire checkout into the build context, and
      # docker/ca_cluster_node/Dockerfile's cmake configure step expects
      # vcpkg_installed/<triplet> to already be populated there
      # (-DCMAKE_PREFIX_PATH=/src/vcpkg_installed/$TRIPLET) - it never runs
      # vcpkg itself. Without this, folly_FOUND/httplib_FOUND are false
      # (CMakeLists.txt lines ~512-518), cmd/ca_cluster_node is never
      # add_subdirectory'd, and the Docker build fails "ninja: error:
      # unknown target 'ca_cluster_node'" - this bundle had never actually
      # built on a fresh runner before Task 12's real verification caught
      # it. Same triplet/feature set as ci.yml's/this workflow's own aws
      # job, keyed on matrix.arch rather than runner.arch since Packer's
      # arch naming (amd64/arm64) is already unambiguous here.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "value=arm64-linux" >> "$GITHUB_OUTPUT"
          else
            echo "value=x64-linux" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}

      # vcpkg's x-gha binary cache talks to the Actions cache API directly, but
      # ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN are only exposed to actions, not
      # to `run:` steps. This re-exports them so the vcpkg invocation below can
      # reach the cache.
      - name: Export Actions cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          export VCPKG_BINARY_SOURCES='clear;x-gha,readwrite'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      - name: Build AMI
        run: |
          packer/ca_cluster_node/scripts/build.sh \
            --arch ${{ matrix.arch }} \
            --region ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: ca-cluster-node-ami-manifest-${{ matrix.arch }}
          path: packer-manifest.json

  # ── Azure ────────────────────────────────────────────────────────────────
  # .kiro/specs/azure-cloud-services/ — azure_vm_quorum_manager,
  # azure_vmss_quorum_manager, azure_key_vault_ca_provider. Authenticated via
  # Workload Identity Federation (azure/login@v2, no client secret), mirroring
  # the AWS job's OIDC approach. See
  # scripts/ci-cloud-credentials/azure/README.md for one-time setup.
  azure:
    name: Real Cloud Tests (Azure)
    runs-on: ubuntu-24.04
    # 60 minutes was not enough: a real run of this job (PR #125) was killed
    # by the job timeout while still mid-compile, having never reached the
    # actual test-running step at all. Unlike the AWS job above, whose own
    # 360-minute budget is dominated by real-EC2 test wall-clock time (its
    # own comment's math: 345 minutes of CTest TIMEOUTs alone), this job's
    # two real-Azure tests only need up to 1200s combined (600s each,
    # tests/CMakeLists.txt) -- the dominant cost here is `cmake --build
    # build -j$(nproc)` compiling the *whole* project from scratch against
    # a cold vcpkg cache (this job's own vcpkg-realcloud-azure-... cache key
    # had never been populated before that run). Matching the AWS job's own
    # ceiling (360 -- "GitHub Actions' own default job timeout cap for
    # hosted runners", per that job's comment) rather than guessing a
    # smaller number and risking a second timeout on the next cold cache
    # miss.
    timeout-minutes: 360
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.azure_enabled == 'true'
        || (github.event.inputs.azure_enabled == null && vars.REAL_CLOUD_TESTS_AZURE_ENABLED == 'true'))

    env:
      BUNDLE_QUORUM_MANAGER: ${{ (github.event.inputs.azure_bundle_quorum_manager == 'true') || (github.event.inputs.azure_bundle_quorum_manager == null && vars.REAL_CLOUD_TESTS_AZURE_QUORUM_MANAGER_ENABLED == 'true') }}
      BUNDLE_KEY_VAULT: ${{ (github.event.inputs.azure_bundle_key_vault == 'true') || (github.event.inputs.azure_bundle_key_vault == null && vars.REAL_CLOUD_TESTS_AZURE_KEY_VAULT_ENABLED == 'true') }}
      # .kiro/specs/cloud-object-persistence/ task 17.
      BUNDLE_OBJECT_PERSISTENCE: ${{ (github.event.inputs.azure_bundle_object_persistence == 'true') || (github.event.inputs.azure_bundle_object_persistence == null && vars.REAL_CLOUD_TESTS_AZURE_OBJECT_PERSISTENCE_ENABLED == 'true') }}
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if Azure CI identity variables are unset
        if: ${{ vars.AZURE_CI_CLIENT_ID == '' || vars.AZURE_CI_TENANT_ID == '' || vars.AZURE_CI_SUBSCRIPTION_ID == '' }}
        run: |
          echo "::error::REAL_CLOUD_TESTS_AZURE_ENABLED is true but AZURE_CI_CLIENT_ID/AZURE_CI_TENANT_ID/AZURE_CI_SUBSCRIPTION_ID are not all set. See scripts/ci-cloud-credentials/azure/README.md." >&2
          exit 1

      # This guard exists because the failure it catches actually happened.
      # Runs 30633133161 and 30642873722 (July 31, 2026) both reported the
      # Azure job as SUCCESS while "Run quorum-manager bundle" and "Run
      # key-vault bundle" were each `skipped` — the job installed
      # dependencies, built both real-Azure binaries, authenticated via
      # Workload Identity Federation, ran no tests at all, and went green.
      # Those two runs were then read as evidence that the real-Azure suite
      # had passed against a live subscription, which it never has.
      #
      # run-real-cloud-suite.sh's fail-closed-on-skip check (added August 1,
      # 2026) cannot catch this case by construction: it fires when the suite
      # runs but skips its cases, whereas here the workflow step itself is
      # disabled by `if:` and the script is never invoked.
      - name: Fail closed if no test bundle is enabled
        if: ${{ env.BUNDLE_QUORUM_MANAGER != 'true' && env.BUNDLE_KEY_VAULT != 'true' && env.BUNDLE_OBJECT_PERSISTENCE != 'true' }}
        run: |
          echo "::error::The Azure job was enabled but every test bundle is disabled, so it would run zero tests and still report success. Set REAL_CLOUD_TESTS_AZURE_QUORUM_MANAGER_ENABLED, REAL_CLOUD_TESTS_AZURE_KEY_VAULT_ENABLED and/or REAL_CLOUD_TESTS_AZURE_OBJECT_PERSISTENCE_ENABLED, or pass the azure_bundle_* workflow_dispatch inputs. See scripts/ci-cloud-credentials/azure/README.md." >&2
          exit 1

      # Both values, not one: azure_blob_client addresses
      # https://<account>.blob.core.windows.net/<container>/..., so an unset
      # account and an unset container are different misconfigurations and
      # naming only the first would send an operator back here twice. See the
      # aws job's equivalent guard for why this fails before the build.
      - name: Fail closed if the object-persistence variables are unset
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' && (vars.AZURE_OBJECT_PERSISTENCE_ACCOUNT == '' || vars.AZURE_OBJECT_PERSISTENCE_CONTAINER == '') }}
        run: |
          fail=0
          [ -z "${{ vars.AZURE_OBJECT_PERSISTENCE_ACCOUNT }}" ] && { echo "::error::AZURE_OBJECT_PERSISTENCE_ACCOUNT repository variable is unset but the object-persistence bundle is enabled." >&2; fail=1; }
          [ -z "${{ vars.AZURE_OBJECT_PERSISTENCE_CONTAINER }}" ] && { echo "::error::AZURE_OBJECT_PERSISTENCE_CONTAINER repository variable is unset but the object-persistence bundle is enabled." >&2; fail=1; }
          echo "Run scripts/ci-cloud-credentials/azure/provision-object-persistence-container.sh and set the variables it prints." >&2
          exit $fail

      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 \
                 cmake \
                 ninja-build \
                 libfiu-dev \
                 ccache \
                 autoconf \
                 autoconf-archive \
                 automake \
                 libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-azure-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}

      # vcpkg's x-gha binary cache talks to the Actions cache API directly, but
      # ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN are only exposed to actions, not
      # to `run:` steps. This re-exports them so the vcpkg invocation below can
      # reach the cache.
      - name: Export Actions cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          export VCPKG_BINARY_SOURCES='clear;x-gha,readwrite'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-realcloud-azure-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-realcloud-azure-${{ runner.os }}-${{ github.ref_name }}-
            ccache-realcloud-azure-${{ runner.os }}-

      - name: ccache size limit
        run: ccache --max-size=2G

      - name: Configure (Release, real-Azure tests enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/x64-linux \
            -DKYTHIRA_AZURE_REAL_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-realcloud-azure-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Fail closed if a real-Azure test binary is missing
        run: |
          for t in azure_quorum_manager_real_test azure_key_vault_ca_provider_real_test; do
            if [ ! -x "build/tests/$t" ]; then
              echo "::error::$t was not built — check KYTHIRA_HAS_AZURE_SDK/KYTHIRA_HAS_AZURE_KEY_VAULT at configure time." >&2
              exit 1
            fi
          done

      # Its own guard, and its own message: this binary's configure-time gate
      # is Kconfig AZURE_BLOB_PERSISTENCE, which additionally depends on
      # HTTP_TRANSPORT_TLS — azure_blob_client speaks the Blob REST API over
      # httplib rather than taking a storage-SDK dependency (task 0.6), so a
      # TLS-less build loses this suite while leaving the two above intact.
      - name: Fail closed if the object-persistence test binary is missing
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' }}
        run: |
          if [ ! -x "build/tests/azure_blob_object_persistence_real_test" ]; then
            echo "::error::azure_blob_object_persistence_real_test was not built — check KYTHIRA_HAS_AZURE_SDK and Kconfig AZURE_BLOB_PERSISTENCE (which depends on HTTP_TRANSPORT_TLS) at configure time." >&2
            exit 1
          fi

      # Deliberately placed here, immediately before the test-running steps,
      # not at the top of the job before the build: a real run (PR #125)
      # logged in here first thing, then took ~84 minutes to cold-build the
      # whole project against an empty vcpkg/ccache cache, and by the time
      # the test steps below actually ran, the GitHub-issued OIDC client
      # assertion azure/login@v2 exchanged for an AAD session token had long
      # since expired (AADSTS700024: "Client assertion is not within its
      # valid time range" -- observed exactly 84 minutes after the original
      # login, well past both the ~5-10 minute GitHub OIDC token lifetime
      # and the AAD access token's own lifetime, with no automatic refresh
      # available since azure/login@v2 only fetches that OIDC token once,
      # at the step's own execution time). Logging in here instead keeps the
      # gap between authentication and actually using the credentials to the
      # width of the two ctest steps below, not the build's own highly
      # variable (cold vs. warm cache) duration.
      - name: Azure login (Workload Identity Federation)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_CI_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_CI_SUBSCRIPTION_ID }}

      # First of the three, immediately after the login, for the reason the
      # login step's own comment gives: the AAD session this job mints is
      # short-lived, and this suite finishes in under a minute where the
      # quorum-manager one can run for ten. It is also the only bundle here
      # that is not CTest-registered — object_persistence_real_support.hpp
      # explains why — so it is invoked by name rather than through
      # run-real-cloud-suite.sh, the same contract the alibaba and oci jobs
      # follow.
      #
      # Exit 77 is the suite's "not configured" skip, converted to a loud
      # failure: the bundle was explicitly enabled, so a skip is a
      # misconfiguration and a silently-green job is indistinguishable from a
      # passing one.
      - name: Run object-persistence bundle (Blob)
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' }}
        env:
          KYTHIRA_AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_OBJECT_PERSISTENCE_ACCOUNT }}
          KYTHIRA_AZURE_BLOB_CONTAINER: ${{ vars.AZURE_OBJECT_PERSISTENCE_CONTAINER }}
        run: |
          rc=0
          ./build/tests/azure_blob_object_persistence_real_test --log_level=test_suite || rc=$?
          if [ $rc -eq 77 ]; then
            echo "::error::The suite skipped for want of configuration, but this bundle was enabled. Check the login step, AZURE_OBJECT_PERSISTENCE_ACCOUNT/_CONTAINER, and that AZURE_CI_CLIENT_ID holds Storage Blob Data Contributor on that account — an Owner role does NOT grant blob data access." >&2
            exit 1
          fi
          exit $rc

      - name: Run quorum-manager bundle
        if: ${{ env.BUNDLE_QUORUM_MANAGER == 'true' }}
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_CI_SUBSCRIPTION_ID }}
          AZURE_TEST_RESOURCE_GROUP: ${{ vars.AZURE_TEST_RESOURCE_GROUP }}
          AZURE_TEST_LOCATION: ${{ vars.AZURE_TEST_LOCATION }}
          AZURE_TEST_VNET_ID: ${{ vars.AZURE_TEST_VNET_ID }}
          AZURE_TEST_NSG_ID: ${{ vars.AZURE_TEST_NSG_ID }}
          AZURE_TEST_SUBNET_ID_ZONE1: ${{ vars.AZURE_TEST_SUBNET_ID_ZONE1 }}
          AZURE_TEST_SUBNET_ID_ZONE2: ${{ vars.AZURE_TEST_SUBNET_ID_ZONE2 }}
          AZURE_TEST_SUBNET_ID_ZONE3: ${{ vars.AZURE_TEST_SUBNET_ID_ZONE3 }}
          # Standard_D2s_v5 (this test's own hardcoded default) hit
          # SkuNotAvailable ("Capacity Restrictions") in eastus on a real
          # run. Standard_B2s is a much more broadly available burstable
          # SKU, less prone to regional capacity exhaustion, and more than
          # sufficient for a VM this test creates only to immediately probe
          # power state and tear down.
          AZURE_TEST_VM_SIZE: ${{ vars.AZURE_TEST_VM_SIZE }}
        run: |
          scripts/run-real-cloud-suite.sh 'real-azure' '^azure_quorum_manager_real_test$' \
            "Check the AZURE_CI_* federated-credential variables and that AZURE_TEST_RESOURCE_GROUP still exists in the subscription."

      - name: Run key-vault bundle
        if: ${{ env.BUNDLE_KEY_VAULT == 'true' }}
        env:
          AZURE_TEST_KEY_VAULT_URL: ${{ vars.AZURE_TEST_KEY_VAULT_URL }}
          AZURE_TEST_KEY_VAULT_KEY_NAME: ${{ vars.AZURE_TEST_KEY_VAULT_KEY_NAME }}
        run: |
          echo "${{ secrets.AZURE_TEST_KEY_VAULT_CA_CERT_PEM }}" > /tmp/azure-test-ca-cert.pem
          AZURE_TEST_KEY_VAULT_CA_CERT_FILE=/tmp/azure-test-ca-cert.pem \
            scripts/run-real-cloud-suite.sh 'real-azure' '^azure_key_vault_ca_provider_real_test$' \
              "Check the AZURE_CI_* federated-credential variables, that AZURE_TEST_KEY_VAULT_URL resolves, and that AZURE_TEST_KEY_VAULT_CA_CERT_PEM is set."

  gcp:
    name: Real Cloud Tests (GCP)
    runs-on: ubuntu-24.04
    # Same protected environment as the aws/ami-build jobs: the real-cloud
    # repository variables (GCP_CI_WORKLOAD_IDENTITY_PROVIDER,
    # GCP_CI_SERVICE_ACCOUNT, GCP_REAL_CLOUD_TESTS_PROJECT, and the enable
    # toggles) and any approval gate guarding real cloud spend live there —
    # without this the job would read those vars as empty and skip auth.
    environment: real-cloud-tests
    # Needed for Workload Identity Federation: google-github-actions/auth@v2
    # exchanges the runner's OIDC token for short-lived GCP credentials, so no
    # service-account JSON key is ever stored as a CI secret (Requirement 24.2).
    permissions:
      contents: read
      id-token: write
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.gcp_enabled == 'true'
        || (github.event.inputs.gcp_enabled == null && vars.REAL_CLOUD_TESTS_GCP_ENABLED == 'true'))
    env:
      BUNDLE_QUORUM_MANAGER: ${{ (github.event.inputs.gcp_bundle_quorum_manager == 'true') || (github.event.inputs.gcp_bundle_quorum_manager == null && vars.REAL_CLOUD_TESTS_GCP_QUORUM_MANAGER_ENABLED == 'true') }}
      BUNDLE_PRIVATECA: ${{ (github.event.inputs.gcp_bundle_privateca == 'true') || (github.event.inputs.gcp_bundle_privateca == null && vars.REAL_CLOUD_TESTS_GCP_PRIVATECA_ENABLED == 'true') }}
      # .kiro/specs/cloud-object-persistence/ task 17.
      BUNDLE_OBJECT_PERSISTENCE: ${{ (github.event.inputs.gcp_bundle_object_persistence == 'true') || (github.event.inputs.gcp_bundle_object_persistence == null && vars.REAL_CLOUD_TESTS_GCP_OBJECT_PERSISTENCE_ENABLED == 'true') }}
      CCACHE_DIR: /home/runner/.ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if GCP WIF variables are unset
        if: ${{ vars.GCP_CI_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_CI_SERVICE_ACCOUNT == '' }}
        run: |
          echo "::error::REAL_CLOUD_TESTS_GCP_ENABLED is true but GCP_CI_WORKLOAD_IDENTITY_PROVIDER and/or GCP_CI_SERVICE_ACCOUNT repository variables are unset. See scripts/ci-cloud-credentials/gcp/README.md." >&2
          exit 1

      # See the azure job's equivalent guard for the real occurrence that
      # motivated these; the same hole exists in every provider job.
      - name: Fail closed if no test bundle is enabled
        if: ${{ env.BUNDLE_QUORUM_MANAGER != 'true' && env.BUNDLE_PRIVATECA != 'true' && env.BUNDLE_OBJECT_PERSISTENCE != 'true' }}
        run: |
          echo "::error::The GCP job was enabled but every test bundle is disabled, so it would run zero tests and still report success. Set REAL_CLOUD_TESTS_GCP_QUORUM_MANAGER_ENABLED, REAL_CLOUD_TESTS_GCP_PRIVATECA_ENABLED and/or REAL_CLOUD_TESTS_GCP_OBJECT_PERSISTENCE_ENABLED, or pass the gcp_bundle_* workflow_dispatch inputs. See scripts/ci-cloud-credentials/gcp/README.md." >&2
          exit 1

      # See the aws job's equivalent guard: the bucket is an operator-owned
      # prerequisite, so an unset variable can only surface as the suite's
      # exit-77 skip after a full build. Name it here instead.
      - name: Fail closed if the object-persistence bucket variable is unset
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' && vars.GCP_OBJECT_PERSISTENCE_BUCKET == '' }}
        run: |
          echo "::error::The object-persistence bundle is enabled but the GCP_OBJECT_PERSISTENCE_BUCKET repository variable is unset. Run scripts/ci-cloud-credentials/gcp/provision-object-persistence-bucket.sh and set the variable it prints." >&2
          exit 1

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      # ── System dependencies (identical to the aws job) ────────────────────
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev ccache \
                 autoconf autoconf-archive automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          # "-gcp" suffix, NOT "-edhoc": this job installs the gcp manifest
          # feature (google-cloud-cpp), so its vcpkg_installed differs from the
          # aws job's edhoc-only tree. Sharing the "-edhoc-" key would let this
          # job restore an aws-populated cache that lacks google-cloud-cpp,
          # leaving KYTHIRA_HAS_GCP_SDK false and the real-GCE/CAS test binaries
          # unbuilt.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-gcp-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}

      # vcpkg's x-gha binary cache talks to the Actions cache API directly, but
      # ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN are only exposed to actions, not
      # to `run:` steps. This re-exports them so the vcpkg invocation below can
      # reach the cache.
      - name: Export Actions cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          export VCPKG_BINARY_SOURCES='clear;x-gha,readwrite'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=gcp
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-realcloud-gcp-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-realcloud-gcp-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
            ccache-realcloud-gcp-${{ runner.os }}-${{ runner.arch }}-

      - name: ccache size limit
        run: ccache --max-size=2G

      - name: Configure (Release, real-cloud tests enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            -DKYTHIRA_GCP_REAL_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-realcloud-gcp-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}

      # Mirror the aws job's fail-closed guard: if google-cloud-cpp did not
      # resolve (wrong vcpkg feature, stale cache) then KYTHIRA_HAS_GCP_SDK is
      # false, the real-test targets are never add_subdirectory'd, and the
      # ctest -R steps below would match zero tests and pass silently. Fail
      # loudly instead so a misconfigured run is a red X, not a green no-op.
      - name: Fail closed if a real-GCP test binary is missing
        run: |
          for t in gcp_quorum_manager_real_gce_test gcp_privateca_provider_real_test; do
            if [ ! -x "build/tests/$t" ]; then
              echo "::error::$t was not built — check KYTHIRA_HAS_GCP_SDK/KYTHIRA_HAS_GCP_PRIVATECA at configure time (did vcpkg install the gcp feature?)." >&2
              exit 1
            fi
          done

      # Its own guard because its dependency is a different one: this suite
      # needs google-cloud-cpp's *storage* component, which Kconfig GCP_STORAGE
      # finds independently of the compute components the two binaries above
      # need. The vcpkg gcp feature installs both, so the failure this catches
      # is a defconfig that turned GCP_STORAGE(_PERSISTENCE) off, not a stale
      # cache — and the message has to point at the right one.
      - name: Fail closed if the object-persistence test binary is missing
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' }}
        run: |
          if [ ! -x "build/tests/gcp_gcs_object_persistence_real_test" ]; then
            echo "::error::gcp_gcs_object_persistence_real_test was not built — check that google-cloud-cpp::storage resolved and Kconfig GCP_STORAGE_PERSISTENCE is on at configure time." >&2
            exit 1
          fi

      # Runs before the two long bundles: this job authenticates at the top,
      # ahead of a build that can take an hour from cold, so the shortest
      # suite goes first and the WIF credentials are at their freshest when
      # it does. Invoked by name, not through run-real-cloud-suite.sh — the
      # object-persistence suites are deliberately never CTest-registered
      # (object_persistence_real_support.hpp says why), so there is no label
      # to select.
      #
      # GCS rate-limits mutations of a single object to roughly 1/s
      # (spike-notes.md Finding 19); the latency case already spaces its
      # samples for that, so this step needs no throttling of its own.
      - name: Run object-persistence bundle (GCS)
        if: ${{ env.BUNDLE_OBJECT_PERSISTENCE == 'true' }}
        env:
          KYTHIRA_GCS_BUCKET: ${{ vars.GCP_OBJECT_PERSISTENCE_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_REAL_CLOUD_TESTS_PROJECT }}
        run: |
          rc=0
          ./build/tests/gcp_gcs_object_persistence_real_test --log_level=test_suite || rc=$?
          if [ $rc -eq 77 ]; then
            echo "::error::The suite skipped for want of configuration, but this bundle was enabled. Check the workload-identity credentials, GCP_OBJECT_PERSISTENCE_BUCKET, and that the CI service account holds an object-level binding ON THAT BUCKET." >&2
            exit 1
          fi
          exit $rc

      - name: Run quorum-manager bundle (Compute Engine + MIG)
        if: ${{ env.BUNDLE_QUORUM_MANAGER == 'true' }}
        env:
          KYTHIRA_GCP_REAL_TESTS: "1"
          GCP_PROJECT_ID: ${{ vars.GCP_REAL_CLOUD_TESTS_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REAL_CLOUD_TESTS_REGION || 'us-central1' }}
        run: |
          scripts/run-real-cloud-suite.sh 'real-gce' '^gcp_quorum_manager_real_gce_test$' \
            "Check the workload-identity credentials, the service account's compute roles, and that GCP_REAL_CLOUD_TESTS_PROJECT names a project with the Compute Engine API enabled."

      - name: Run privateca bundle (Certificate Authority Service)
        if: ${{ env.BUNDLE_PRIVATECA == 'true' }}
        env:
          KYTHIRA_GCP_REAL_TESTS: "1"
          GCP_PROJECT_ID: ${{ vars.GCP_REAL_CLOUD_TESTS_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REAL_CLOUD_TESTS_REGION || 'us-central1' }}
        run: |
          scripts/run-real-cloud-suite.sh 'real-privateca' '^gcp_privateca_provider_real_test$' \
            "The fixture provisions its own CA pool when GCP_TEST_CA_POOL is unset, so a skip means the preflight could not reach CAS — check the service account's privateca roles and that the Certificate Authority Service API is enabled."

  # ── OCI ──────────────────────────────────────────────────────────────────
  # Single x64 leg, unlike the AWS job's x64+arm64 matrix: nothing in
  # oci_instance_pool_quorum_manager or oci_certificates_provider branches on
  # host architecture — there is no equivalent of the AMI/instance-type
  # selection that made the AWS arm64 leg worth its runtime. The *instances*
  # these tests launch may well be Ampere; that is the tenancy's Instance
  # Configuration, not the runner's architecture.
  oci:
    name: Real Cloud Tests (OCI)
    runs-on: ubuntu-24.04
    # Worst case: the quorum suite's provision/assess/decommission case waits
    # up to 900s for an instance, plus the ladder walk and the certificates
    # suite's issuance polls. 120 minutes is generous against a measured ~5
    # minutes for both suites, which leaves room for a region under pressure
    # without letting a wedged run hold a runner for six hours.
    timeout-minutes: 120
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.oci_enabled == 'true'
        || (github.event.inputs.oci_enabled == null && vars.REAL_CLOUD_TESTS_OCI_ENABLED == 'true'))

    env:
      # Repository variables only, with no workflow_dispatch counterpart —
      # unlike the aws/azure/gcp jobs above. That is this job's existing
      # convention and the object-persistence bundle keeps it: giving one
      # bundle a dispatch input and not the others would make "how do I turn
      # this on for a single run?" have two answers in the same job.
      BUNDLE_INSTANCE_POOL: ${{ vars.REAL_CLOUD_TESTS_OCI_INSTANCE_POOL_ENABLED == 'true' }}
      BUNDLE_CERTIFICATES: ${{ vars.REAL_CLOUD_TESTS_OCI_CERTIFICATES_ENABLED == 'true' }}
      # .kiro/specs/cloud-object-persistence/ task 17.
      BUNDLE_OBJECT_PERSISTENCE: ${{ vars.REAL_CLOUD_TESTS_OCI_OBJECT_PERSISTENCE_ENABLED == 'true' }}
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - uses: actions/checkout@v4

      # Mirrors the AWS job's equivalent guard. A provider job with every
      # bundle off would run zero tests and report success, which is the
      # "green because nothing ran" failure this project keeps finding.
      - name: Fail if no bundle is enabled
        run: |
          if [ "${BUNDLE_INSTANCE_POOL}" != "true" ] && [ "${BUNDLE_CERTIFICATES}" != "true" ] \
             && [ "${BUNDLE_OBJECT_PERSISTENCE}" != "true" ]; then
            echo "::error::The OCI job was enabled but every test bundle is disabled, so it would run zero tests and still report success. Set REAL_CLOUD_TESTS_OCI_INSTANCE_POOL_ENABLED, REAL_CLOUD_TESTS_OCI_CERTIFICATES_ENABLED and/or REAL_CLOUD_TESTS_OCI_OBJECT_PERSISTENCE_ENABLED." >&2
            exit 1
          fi

      # Mirrors the AWS job's AWS_CI_ROLE_ARN guard: an unset resource
      # variable would surface as the suites' exit-77 skip, which the bundle
      # steps below already convert to a failure — but failing here names the
      # actual variable instead of leaving a scavenger hunt.
      - name: Fail closed if a resource variable is unset
        run: |
          fail=0
          [ -z "${{ vars.OCI_CI_REGION }}" ] && { echo "::error::OCI_CI_REGION repository variable is unset." >&2; fail=1; }
          [ -z "${{ vars.OCI_CI_COMPARTMENT_ID }}" ] && { echo "::error::OCI_CI_COMPARTMENT_ID repository variable is unset." >&2; fail=1; }
          if [ "${BUNDLE_INSTANCE_POOL}" = "true" ] && [ -z "${{ vars.OCI_CI_INSTANCE_POOL_ID }}" ]; then
            echo "::error::OCI_CI_INSTANCE_POOL_ID repository variable is unset but the instance-pool bundle is enabled." >&2; fail=1
          fi
          if [ "${BUNDLE_CERTIFICATES}" = "true" ] && [ -z "${{ vars.OCI_CI_CERTIFICATE_AUTHORITY_ID }}" ]; then
            echo "::error::OCI_CI_CERTIFICATE_AUTHORITY_ID repository variable is unset but the certificates bundle is enabled." >&2; fail=1
          fi
          # No bucket is provisioned for this bundle: it reuses
          # kythira-ci-artifacts, which the heartbeat bundle already created
          # and already grants the CI group object access to. The variable
          # still has to be set, because the suite names the bucket and this
          # job must not guess it.
          if [ "${BUNDLE_OBJECT_PERSISTENCE}" = "true" ] && [ -z "${{ vars.OCI_OBJECT_PERSISTENCE_BUCKET }}" ]; then
            echo "::error::OCI_OBJECT_PERSISTENCE_BUCKET repository variable is unset but the object-persistence bundle is enabled (set it to kythira-ci-artifacts unless a separate bucket was provisioned)." >&2; fail=1
          fi
          exit $fail

      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev ccache \
                 autoconf autoconf-archive automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect.
      # This job passed the flag without installing kconfiglib from the day
      # it was written, which silently configured in autodetect mode instead
      # — cmake/Kconfig.cmake now FATAL_ERRORs on exactly that, so this step
      # is load-bearing, not hygiene.
      - name: Install kconfiglib
        run: timeout 300 pip3 install --user -r scripts/kconfig/requirements.txt

      # The dependency tree this job needs is exactly build-and-test's
      # (edhoc feature, x64) — same cache key on purpose, so the first oci
      # run restores the tree those jobs already built instead of
      # cold-building ~40 minutes of ports. This job never got past its
      # credentials step before that step worked, which is how "the job has
      # no vcpkg install at all" stayed invisible until the first real
      # configure ran.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}

      # vcpkg's x-gha binary cache talks to the Actions cache API directly, but
      # ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN are only exposed to actions, not
      # to `run:` steps. This re-exports them so the vcpkg invocation below can
      # reach the cache.
      - name: Export Actions cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          export VCPKG_BINARY_SOURCES='clear;x-gha,readwrite'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-realcloud-oci-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-realcloud-oci-${{ runner.os }}-${{ github.ref_name }}-
            ccache-realcloud-oci-${{ runner.os }}-

      - name: ccache size limit
        run: ccache --max-size=2G

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/x64-linux \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig

      # Built as named targets rather than via `ctest`: neither real-OCI binary
      # is registered with CTest at all (tests/CMakeLists.txt explains why), so
      # there is no label to select and the job invokes them directly below.
      - name: Build the real-OCI suites
        run: |
          targets=""
          # The instance-pool bundle also builds the on-instance heartbeat
          # binary (Requirement 4.4): it is uploaded to the artifacts bucket
          # after the credentials step and executed ON the provisioned pool
          # instance by its cloud-init, which makes this runner's glibc a
          # wire-format constraint — ubuntu-24.04 here must not run ahead of
          # the pool image's Ubuntu 24.04 (see cmd/oci_heartbeat_writer/).
          [ "${BUNDLE_INSTANCE_POOL}" = "true" ] && targets="$targets oci_quorum_manager_real_test oci_heartbeat_writer_node"
          [ "${BUNDLE_CERTIFICATES}" = "true" ] && targets="$targets oci_certificates_provider_real_test"
          # The only provider job that needs a target line for the
          # object-persistence suite: aws/azure/gcp run `cmake --build build`
          # over everything, whereas this job builds a named list precisely
          # because none of its suites is CTest-registered.
          [ "${BUNDLE_OBJECT_PERSISTENCE}" = "true" ] && targets="$targets oci_object_storage_persistence_real_test"
          # shellcheck disable=SC2086
          cmake --build build --target $targets

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-realcloud-oci-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      # ── Credentials (Requirement 14.2 — keyless federation) ──────────────
      #
      # Deliberately placed AFTER the build, immediately before the test
      # steps — the same hard-won ordering the azure job documents: its
      # login originally ran at the top of the job, an 84-minute cold
      # build followed, and the credentials were expired before the first
      # test step ran. The UPST minted here has the same shape of budget,
      # so the gap between minting and using it is kept to seconds.
      #
      # OCI IAM Workload Identity Federation: this job's GitHub OIDC JWT plus
      # a freshly generated session key are exchanged for a short-lived User
      # Principal Session Token (spike-notes.md Finding 17). The identity-
      # domain side — the trust `github-actions-kythira`, its confidential
      # OAuth client, and the impersonated service user
      # `kythira-ci-federation` — is documented in
      # scripts/ci-cloud-credentials/oci/README.md.
      #
      # The exchange is ~10 lines of openssl + curl, done inline rather than
      # via the third-party action the spike evaluated
      # (gtrevorrow/oci-token-exchange-action): the client secret and the
      # minted token stay inside this step, and the wire contract is small
      # enough that owning it beats auditing someone else's implementation
      # of it.
      #
      # No long-lived API key exists anywhere in this path: the OIDC JWT is
      # minted per run by GitHub, the session key pair is generated below and
      # never leaves the runner, and the UPST expires on its own. The
      # OCI_WIF_CLIENT_* pair is not a credential for any OCI principal — it
      # only authorises *presenting* a valid GitHub-signed JWT to the
      # exchange endpoint.
      - name: Obtain OCI credentials (Workload Identity Federation)
        env:
          OCI_DOMAIN_URL: ${{ secrets.OCI_DOMAIN_URL }}
          OCI_WIF_CLIENT_ID: ${{ secrets.OCI_WIF_CLIENT_ID }}
          OCI_WIF_CLIENT_SECRET: ${{ secrets.OCI_WIF_CLIENT_SECRET }}
        run: |
          for v in OCI_DOMAIN_URL OCI_WIF_CLIENT_ID OCI_WIF_CLIENT_SECRET; do
            if [ -z "$(eval echo "\$$v")" ]; then
              echo "::error::The $v secret is unset in the real-cloud-tests environment. See scripts/ci-cloud-credentials/oci/README.md (Credentials)." >&2
              exit 1
            fi
          done
          # A secret pasted with a trailing newline turns the exchange URL
          # into two lines and curl answers exit 3 ("URL rejected: Malformed
          # input") — observed on this job's first live run. None of these
          # three values legitimately contains whitespace, so strip it all
          # rather than asking every future paste to be perfect.
          OCI_DOMAIN_URL=$(printf '%s' "$OCI_DOMAIN_URL" | tr -d '[:space:]')
          OCI_WIF_CLIENT_ID=$(printf '%s' "$OCI_WIF_CLIENT_ID" | tr -d '[:space:]')
          OCI_WIF_CLIENT_SECRET=$(printf '%s' "$OCI_WIF_CLIENT_SECRET" | tr -d '[:space:]')

          # The ephemeral session key pair the UPST will be bound to. The
          # exchange wants the public half as base64 PKIX DER (the same
          # sanitized form the Instance Principal federation body uses).
          openssl genrsa -out /tmp/oci-session-key.pem 2048 2>/dev/null
          public_key=$(openssl rsa -in /tmp/oci-session-key.pem -pubout -outform DER 2>/dev/null | base64 -w0)

          # This job's own GitHub OIDC JWT. The audience is the convention the
          # exchange tooling expects; the trust validates issuer, signature
          # (via GitHub's JWKS) and the sub claim, which for this job is
          # repo:crawlins/kythira:environment:real-cloud-tests.
          jwt=$(timeout 60 curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://cloud.oracle.com" | jq -r '.value')
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "::error::Could not obtain a GitHub OIDC token — is 'id-token: write' still in this job's permissions?" >&2
            exit 1
          fi

          response=$(timeout 120 curl -sS -u "$OCI_WIF_CLIENT_ID:$OCI_WIF_CLIENT_SECRET" \
            "$OCI_DOMAIN_URL/oauth2/v1/token" \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:oci:token-type:oci-upst' \
            --data-urlencode 'subject_token_type=jwt' \
            --data-urlencode "subject_token=$jwt" \
            --data-urlencode "public_key=$public_key")
          token=$(echo "$response" | jq -r '.token // empty')
          if [ -z "$token" ]; then
            # The response carries OCI's error json and no secrets — the one
            # thing worth having in the log when the exchange fails. The
            # decoded sub claim is printed alongside it because the trust's
            # impersonation rule matches on exactly that string, and "No
            # rules matched" names neither side of the comparison; sub is
            # repo/environment metadata, not a credential.
            sub_payload=$(echo "$jwt" | cut -d. -f2 | tr '_-' '/+')
            pad=$(( (4 - ${#sub_payload} % 4) % 4 ))
            [ $pad -gt 0 ] && sub_payload="$sub_payload$(printf '=%.0s' $(seq $pad))"
            echo "::error::The UPST exchange failed: $response (JWT sub: $(echo "$sub_payload" | base64 -d 2>/dev/null | jq -r '.sub // "undecodable"'))" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          # Mask the session key line by line: values appended to GITHUB_ENV
          # are NOT auto-masked the way `secrets` are, and every later step
          # that declares this env var gets it echoed verbatim into the log's
          # env dump. add-mask only takes single-line values, hence per-line.
          while IFS= read -r keyline; do
            [ -n "$keyline" ] && echo "::add-mask::$keyline"
          done < /tmp/oci-session-key.pem

          {
            echo "KYTHIRA_OCI_SECURITY_TOKEN=$token"
            echo "KYTHIRA_OCI_PRIVATE_KEY_PEM<<KYTHIRA_SESSION_KEY_EOF"
            cat /tmp/oci-session-key.pem
            echo "KYTHIRA_SESSION_KEY_EOF"
            echo "KYTHIRA_OCI_REGION=${{ vars.OCI_CI_REGION }}"
            echo "KYTHIRA_OCI_COMPARTMENT_ID=${{ vars.OCI_CI_COMPARTMENT_ID }}"
            echo "KYTHIRA_OCI_INSTANCE_POOL_ID=${{ vars.OCI_CI_INSTANCE_POOL_ID }}"
            echo "KYTHIRA_OCI_CERTIFICATE_AUTHORITY_ID=${{ vars.OCI_CI_CERTIFICATE_AUTHORITY_ID }}"
            echo "KYTHIRA_OCI_OBJECT_BUCKET=${{ vars.OCI_OBJECT_PERSISTENCE_BUCKET }}"
          } >> "$GITHUB_ENV"
          rm -f /tmp/oci-session-key.pem
          echo "UPST obtained (${#token} chars); session key exported to the suite environment."

      # First bundle to run, immediately after the credentials step and ahead
      # of the heartbeat publish, for the reason that step's own comment
      # gives: the UPST is short-lived and this suite finishes in about a
      # minute. `|| rc=$?`, not `; rc=$?` — run steps execute under `bash -e`,
      # so a bare failing command ends the step before the rc check runs.
      #
      # ── READ THIS BEFORE TRUSTING A RED RUN OF THIS STEP ─────────────────
      #
      # This tenancy intermittently declines VALID Object Storage requests
      # with `404 BucketNotFound` — measured at 3-16%, across
      # PUT/GET/DELETE/LIST (spike-notes.md). Until that is understood, a
      # failure here is ambiguous in a way the other four providers' are not:
      # it may be a defect or it may be the tenancy. The honest response to
      # red is to take the `opc-request-id` from the decline and work the
      # compartment audit log — specifically checking whether a policy `where`
      # clause was added, which broke this exact path once before
      # (policies/heartbeat.txt). Re-running until green launders a real
      # regression into a flake.
      - name: Object Storage persistence bundle
        if: env.BUNDLE_OBJECT_PERSISTENCE == 'true'
        run: |
          rc=0
          ./build/tests/oci_object_storage_persistence_real_test --log_level=test_suite || rc=$?
          if [ $rc -eq 77 ]; then
            echo "::error::The suite skipped for want of configuration, but this bundle was enabled. Check the credentials step, OCI_OBJECT_PERSISTENCE_BUCKET, and that the CI group's Object Storage policy still covers the compartment." >&2
            exit 1
          fi
          exit $rc

      # Requirement 4.4's artifact delivery: ship the on-instance heartbeat
      # binary to the kythira-ci-artifacts bucket and mint a short-lived
      # read-only pre-authenticated request URL for it. The URL reaches the
      # instance as a freeform tag (written by the suite after provisioning),
      # is read back through the metadata service by the static cloud-init in
      # the pool's instance configuration, and is fetched through the VCN's
      # service gateway — the subnet has no internet route. The same UPST the
      # suites use authenticates the CLI here (--auth security_token, tenancy
      # from the token's own tenant claim — the audit step's pattern).
      #
      # NOTE the session key: the credentials step deleted its /tmp copy, so
      # this reads it back from the GITHUB_ENV-exported variable. The PAR
      # itself carries no credentials — anyone with the URL can read that one
      # object until expiry, which is the point (cloud-init has no principal
      # yet when it runs).
      - name: Publish heartbeat binary for the instance (Requirement 4.4)
        if: env.BUNDLE_INSTANCE_POOL == 'true'
        run: |
          timeout 600 pip3 install --user --quiet oci-cli
          export PATH="$HOME/.local/bin:$PATH"
          umask 077
          printf '%s' "$KYTHIRA_OCI_SECURITY_TOKEN" > /tmp/oci-pub-upst.token
          printf '%s\n' "$KYTHIRA_OCI_PRIVATE_KEY_PEM" > /tmp/oci-pub-session.pem
          payload=$(printf '%s' "$KYTHIRA_OCI_SECURITY_TOKEN" | cut -d. -f2 | tr '_-' '/+')
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          [ $pad -gt 0 ] && payload="$payload$(printf '=%.0s' $(seq $pad))"
          tenancy=$(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -r '.tenant // empty')
          mkdir -p ~/.oci
          printf '%s\n' \
            '[DEFAULT]' \
            "region=${KYTHIRA_OCI_REGION}" \
            "tenancy=${tenancy}" \
            'security_token_file=/tmp/oci-pub-upst.token' \
            'key_file=/tmp/oci-pub-session.pem' \
            > ~/.oci/config

          object="heartbeat/${GITHUB_RUN_ID}/oci_heartbeat_writer_node"
          oci --auth security_token os object put \
            --bucket-name kythira-ci-artifacts --name "$object" \
            --file build/cmd/oci_heartbeat_writer/oci_heartbeat_writer_node --force

          expires=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)
          access_uri=$(oci --auth security_token os preauth-request create \
            --bucket-name kythira-ci-artifacts \
            --name "heartbeat-${GITHUB_RUN_ID}" \
            --access-type ObjectRead --object-name "$object" \
            --time-expires "$expires" \
            --query 'data."access-uri"' --raw-output)
          rm -f /tmp/oci-pub-upst.token /tmp/oci-pub-session.pem
          url="https://objectstorage.${KYTHIRA_OCI_REGION}.oraclecloud.com${access_uri}"
          # The URL is a capability; mask it like the token it effectively is.
          echo "::add-mask::$url"
          echo "KYTHIRA_OCI_HEARTBEAT_ARTIFACT_URL=$url" >> "$GITHUB_ENV"
          echo "heartbeat binary published; PAR expires $expires"

      # `|| rc=$?`, not `; rc=$?`: GitHub run steps execute under `bash -e`,
      # so a bare failing command ends the step before the rc check ever
      # runs — the step still failed, but with the suite's raw exit code
      # instead of the explanatory error the check exists to print.
      - name: Instance Pool bundle
        if: env.BUNDLE_INSTANCE_POOL == 'true'
        run: |
          rc=0
          ./build/tests/oci_quorum_manager_real_test --log_level=test_suite || rc=$?
          # 77 is the suites' "tenancy not configured" skip. In CI that is a
          # misconfiguration, not a skip — the job was explicitly enabled.
          if [ $rc -eq 77 ]; then
            echo "::error::The suite skipped for want of tenancy configuration, but this bundle was enabled. Check the credential step and the KYTHIRA_OCI_* variables." >&2
            exit 1
          fi
          exit $rc

      - name: Certificates bundle
        if: env.BUNDLE_CERTIFICATES == 'true'
        run: |
          rc=0
          ./build/tests/oci_certificates_provider_real_test --log_level=test_suite || rc=$?
          if [ $rc -eq 77 ]; then
            echo "::error::The suite skipped for want of tenancy configuration, but this bundle was enabled. Check the credential step and the KYTHIRA_OCI_* variables." >&2
            exit 1
          fi
          exit $rc

      # Requirement 13.10's audit, as a job step rather than trust in the
      # fixtures. Both suites tear down unconditionally, including on a signal
      # — but "the teardown ran" and "nothing is left running" are different
      # claims, and every cloud provider in this project leaked something on
      # its first live run.
      #
      # Runs on the same UPST the suites used: the OCI CLI's security_token
      # auth takes the token from a file plus the session private key, and
      # the tenancy OCID the CLI's config insists on is read out of the
      # UPST's own `tenant` claim rather than kept as one more repo variable
      # that could drift from the credential actually in hand. `if: always()`
      # so a failed suite still gets audited — that is the run most likely
      # to have leaked — but if the credentials step itself failed there is
      # no token to audit with, so that case reports itself and exits 0
      # rather than burying the real failure under a second one.
      - name: Audit for leaked instances
        if: always()
        run: |
          if [ -z "${KYTHIRA_OCI_SECURITY_TOKEN:-}" ]; then
            echo "No UPST in the environment (the credentials step failed or never ran) — nothing to audit with."
            exit 0
          fi
          timeout 600 pip3 install --user --quiet oci-cli
          export PATH="$HOME/.local/bin:$PATH"

          umask 077
          printf '%s' "$KYTHIRA_OCI_SECURITY_TOKEN" > /tmp/oci-audit-upst.token
          printf '%s\n' "$KYTHIRA_OCI_PRIVATE_KEY_PEM" > /tmp/oci-audit-session.pem

          payload=$(printf '%s' "$KYTHIRA_OCI_SECURITY_TOKEN" | cut -d. -f2 | tr '_-' '/+')
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          [ $pad -gt 0 ] && payload="$payload$(printf '=%.0s' $(seq $pad))"
          tenancy=$(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -r '.tenant // empty')
          if [ -z "$tenancy" ]; then
            echo "::error::The UPST carries no tenant claim — cannot build a CLI config to audit with." >&2
            exit 1
          fi

          # printf, not a heredoc: these lines are indented for YAML, and a
          # heredoc would carry that indentation into the file, where the
          # CLI's configparser reads an indented line as a continuation of
          # the previous key — a silently broken config.
          mkdir -p ~/.oci
          printf '%s\n' \
            '[DEFAULT]' \
            "region=${KYTHIRA_OCI_REGION}" \
            "tenancy=${tenancy}" \
            'security_token_file=/tmp/oci-audit-upst.token' \
            'key_file=/tmp/oci-audit-session.pem' \
            > ~/.oci/config

          leaked=$(oci --auth security_token compute instance list \
            --compartment-id "$KYTHIRA_OCI_COMPARTMENT_ID" --all \
            --query 'data[?"lifecycle-state"!=`TERMINATED` && "lifecycle-state"!=`TERMINATING`].{id:id, state:"lifecycle-state", name:"display-name", created:"time-created"}' \
            --output json)
          rm -f /tmp/oci-audit-upst.token /tmp/oci-audit-session.pem

          # An empty match prints nothing at all (not []), and a bare jq on
          # empty input errors — both spellings of "clean" have to count 0.
          count=$(printf '%s' "$leaked" | jq 'if . == null then 0 else length end' 2>/dev/null || echo 0)
          [ -z "$count" ] && count=0
          if [ "$count" -ne 0 ]; then
            echo "::error::Post-run audit found $count non-terminated instance(s) in the compartment:" >&2
            echo "$leaked" | jq . >&2
            exit 1
          fi
          echo "Post-run audit clean: no non-terminated instances in the compartment."

  # ── Alibaba Cloud ────────────────────────────────────────────────────────
  # .kiro/specs/alibaba-cloud-services/ — alibaba_ess_quorum_manager and
  # alibaba_oss_persistence_engine. Credentials come from RAM
  # AssumeRoleWithOIDC via the VENDOR'S OWN action (Requirement 17.2): unlike
  # the oci job, which hand-rolls its UPST exchange because its only option
  # was an unaudited third-party action, Alibaba publishes a first-party one,
  # which tracks changes to the exchange that a copy in this repo would not.
  #
  # Neither suite is registered with CTest (they need real credentials and
  # spend real money), so they are built as named targets and run directly —
  # the same contract the oci job follows.
  alibaba:
    name: Real Cloud Tests (Alibaba Cloud)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.alibaba_enabled == 'true'
        || (github.event.inputs.alibaba_enabled == null && vars.REAL_CLOUD_TESTS_ALIBABA_ENABLED == 'true'))

    env:
      BUNDLE_ESS_QUORUM: ${{ (github.event.inputs.alibaba_bundle_ess_quorum == 'true') || (github.event.inputs.alibaba_bundle_ess_quorum == null && vars.REAL_CLOUD_TESTS_ALIBABA_ESS_QUORUM_ENABLED == 'true') }}
      BUNDLE_OSS_PERSISTENCE: ${{ (github.event.inputs.alibaba_bundle_oss_persistence == 'true') || (github.event.inputs.alibaba_bundle_oss_persistence == null && vars.REAL_CLOUD_TESTS_ALIBABA_OSS_PERSISTENCE_ENABLED == 'true') }}
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every provider job carries this guard because the failure it prevents
      # actually happened on the azure job: all bundles off means the job
      # builds, authenticates, runs zero tests and reports SUCCESS.
      - name: Fail closed if no test bundle is enabled
        if: ${{ env.BUNDLE_ESS_QUORUM != 'true' && env.BUNDLE_OSS_PERSISTENCE != 'true' }}
        run: |
          echo "::error::The Alibaba job was enabled but every test bundle is disabled, so it would run zero tests and still report success. Set REAL_CLOUD_TESTS_ALIBABA_ESS_QUORUM_ENABLED and/or REAL_CLOUD_TESTS_ALIBABA_OSS_PERSISTENCE_ENABLED, or pass the alibaba_bundle_* workflow_dispatch inputs. See scripts/ci-cloud-credentials/alibaba/README.md." >&2
          exit 1

      - name: Fail closed if Alibaba CI variables are unset
        run: |
          fail=0
          [ -z "${{ vars.ALIBABA_CI_ROLE_ARN }}" ] && { echo "::error::ALIBABA_CI_ROLE_ARN repository variable is unset." >&2; fail=1; }
          [ -z "${{ vars.ALIBABA_CI_OIDC_PROVIDER_ARN }}" ] && { echo "::error::ALIBABA_CI_OIDC_PROVIDER_ARN repository variable is unset." >&2; fail=1; }
          [ -z "${{ vars.ALIBABA_CI_REGION }}" ] && { echo "::error::ALIBABA_CI_REGION repository variable is unset." >&2; fail=1; }
          if [ "${BUNDLE_ESS_QUORUM}" = "true" ] && [ -z "${{ vars.ALIBABA_SCALING_GROUP_ID }}" ]; then
            echo "::error::ALIBABA_SCALING_GROUP_ID is unset but the ess-quorum bundle is enabled." >&2; fail=1
          fi
          if [ "${BUNDLE_OSS_PERSISTENCE}" = "true" ] && [ -z "${{ vars.ALIBABA_OSS_BUCKET }}" ]; then
            echo "::error::ALIBABA_OSS_BUCKET is unset but the oss-persistence bundle is enabled." >&2; fail=1
          fi
          exit $fail

      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev ccache \
                 autoconf autoconf-archive automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}

      - name: Export Actions cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          export VCPKG_BINARY_SOURCES='clear;x-gha,readwrite'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-realcloud-alibaba-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-realcloud-alibaba-${{ runner.os }}-${{ github.ref_name }}-
            ccache-realcloud-alibaba-${{ runner.os }}-

      - name: ccache size limit
        run: ccache --max-size=2G

      - name: Configure (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/x64-linux

      - name: Build the real-Alibaba suites
        run: |
          targets=""
          [ "${BUNDLE_ESS_QUORUM}" = "true" ] && targets="$targets alibaba_quorum_manager_real_test"
          [ "${BUNDLE_OSS_PERSISTENCE}" = "true" ] && targets="$targets alibaba_oss_persistence_real_test"
          # shellcheck disable=SC2086
          cmake --build build --target $targets

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-realcloud-alibaba-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      # Deliberately AFTER the build and immediately before the test steps.
      # The azure job learned this the expensive way: it logged in first, took
      # ~84 minutes to cold-build, and its credentials had expired before the
      # first test ran. STS credentials are short-lived; keep the gap between
      # minting and using them to the width of the test steps.
      - name: Configure Alibaba Cloud credentials (RAM OIDC)
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.ALIBABA_CI_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CI_OIDC_PROVIDER_ARN }}
          region: ${{ vars.ALIBABA_CI_REGION }}

      # Exit 77 is the suites' "not configured" skip. In CI that is a
      # misconfiguration, not a skip — the bundle was explicitly enabled — so
      # it is converted into a loud failure rather than a silent green.
      - name: Run oss-persistence bundle
        if: ${{ env.BUNDLE_OSS_PERSISTENCE == 'true' }}
        env:
          KYTHIRA_ALIBABA_REGION: ${{ vars.ALIBABA_CI_REGION }}
          KYTHIRA_ALIBABA_ACCESS_KEY_ID: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          KYTHIRA_ALIBABA_ACCESS_KEY_SECRET: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          KYTHIRA_ALIBABA_SECURITY_TOKEN: ${{ env.ALIBABA_CLOUD_SECURITY_TOKEN }}
          KYTHIRA_ALIBABA_OSS_BUCKET: ${{ vars.ALIBABA_OSS_BUCKET }}
        run: |
          rc=0
          ./build/tests/alibaba_oss_persistence_real_test --log_level=test_suite || rc=$?
          if [ $rc -eq 77 ]; then
            echo "::error::The suite skipped for want of configuration, but this bundle was enabled. Check the credentials step and the ALIBABA_* variables." >&2
            exit 1
          fi
          exit $rc

      - name: Run ess-quorum-manager bundle
        if: ${{ env.BUNDLE_ESS_QUORUM == 'true' }}
        env:
          KYTHIRA_ALIBABA_REGION: ${{ vars.ALIBABA_CI_REGION }}
          KYTHIRA_ALIBABA_ACCESS_KEY_ID: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          KYTHIRA_ALIBABA_ACCESS_KEY_SECRET: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          KYTHIRA_ALIBABA_SECURITY_TOKEN: ${{ env.ALIBABA_CLOUD_SECURITY_TOKEN }}
          KYTHIRA_ALIBABA_SCALING_GROUP_ID: ${{ vars.ALIBABA_SCALING_GROUP_ID }}
        run: |
          rc=0
          ./build/tests/alibaba_quorum_manager_real_test --log_level=test_suite || rc=$?
          if [ $rc -eq 77 ]; then
            echo "::error::The suite skipped for want of configuration, but this bundle was enabled. Check the credentials step and the ALIBABA_* variables." >&2
            exit 1
          fi
          exit $rc

      # Every cloud provider in this project leaked something on its first
      # live run. The suites tear down unconditionally, including on a signal,
      # but "the teardown ran" and "nothing is left running" are different
      # claims — and this is the run most likely to have leaked.
      - name: Audit for leaked instances
        if: always()
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ env.ALIBABA_CLOUD_SECURITY_TOKEN }}
        run: |
          if [ -z "${ALIBABA_CLOUD_ACCESS_KEY_ID:-}" ]; then
            echo "No credentials in the environment (the credentials step failed or never ran) — nothing to audit with."
            exit 0
          fi
          if [ "${BUNDLE_ESS_QUORUM}" != "true" ]; then
            echo "ess-quorum bundle did not run; no instances could have been created."
            exit 0
          fi
          timeout 300 curl -sSL -o /tmp/aliyun.tgz \
            https://github.com/aliyun/aliyun-cli/releases/latest/download/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf /tmp/aliyun.tgz -C /tmp && sudo mv /tmp/aliyun /usr/local/bin/
          # The scaling group must be back at zero. A non-zero TotalCapacity
          # means an instance outlived teardown and is being billed.
          capacity=$(aliyun ess DescribeScalingGroups --RegionId "${{ vars.ALIBABA_CI_REGION }}" \
            --ScalingGroupId.1 "${{ vars.ALIBABA_SCALING_GROUP_ID }}" \
            | python3 -c 'import json,sys; g=json.load(sys.stdin)["ScalingGroups"]["ScalingGroup"]; print(g[0]["TotalCapacity"] if g else 0)')
          echo "scaling group TotalCapacity after the run: ${capacity}"
          if [ "${capacity}" != "0" ]; then
            echo "::error::Post-run audit found ${capacity} instance(s) still in the scaling group — teardown did not complete. They are being billed; remove them via the ESS console." >&2
            exit 1
          fi
          echo "Post-run audit clean: the scaling group is back at zero."

  # ── Cloud-vendor monitoring configs (doc/TODO.md "Metrics Backends") ─────
  # Each job below exercises one example config from docker/cloud-monitoring/
  # against the real vendor service: a real OpenTelemetry Collector (or, for
  # OCI, the vendor's own Management Agent) runs the unmodified example
  # config, one synthetic OTLP metric goes in, and the vendor's own query
  # API confirms arrival. See scripts/real-cloud-monitoring/ and
  # doc/cloud_vendor_monitoring.md. No C++ build — these are minutes-scale
  # jobs, gated (like everything here) on the master switch plus their own
  # REAL_CLOUD_TESTS_<PROVIDER>_MONITORING_ENABLED toggle, and all disabled
  # by default because they write to (and cost against) real vendor
  # services.

  aws-monitoring:
    name: Monitoring config (AWS CloudWatch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.aws_monitoring_enabled == 'true'
        || (github.event.inputs.aws_monitoring_enabled == null && vars.REAL_CLOUD_TESTS_AWS_MONITORING_ENABLED == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if AWS_CI_ROLE_ARN is unset
        if: ${{ vars.AWS_CI_ROLE_ARN == '' }}
        run: |
          echo "::error::REAL_CLOUD_TESTS_AWS_MONITORING_ENABLED is true but the AWS_CI_ROLE_ARN repository variable is unset. See scripts/ci-cloud-credentials/aws/README.md." >&2
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-monitoring-aws
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      # The CI role needs the cloudwatch-monitoring policy bundle — re-run
      # scripts/ci-cloud-credentials/aws/provision-oidc-role.sh with it in
      # --bundles if this step fails AccessDenied.
      - name: Run the CloudWatch monitoring-config test
        run: scripts/real-cloud-monitoring/aws-cloudwatch.sh

  azure-monitoring:
    name: Monitoring config (Azure Monitor)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.azure_monitoring_enabled == 'true'
        || (github.event.inputs.azure_monitoring_enabled == null && vars.REAL_CLOUD_TESTS_AZURE_MONITORING_ENABLED == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if Azure monitoring variables are unset
        if: ${{ vars.AZURE_CI_CLIENT_ID == '' || vars.AZURE_CI_TENANT_ID == '' || vars.AZURE_CI_SUBSCRIPTION_ID == '' || vars.AZURE_MONITORING_APP_ID == '' }}
        run: |
          echo "::error::REAL_CLOUD_TESTS_AZURE_MONITORING_ENABLED is true but AZURE_CI_CLIENT_ID/AZURE_CI_TENANT_ID/AZURE_CI_SUBSCRIPTION_ID/AZURE_MONITORING_APP_ID are not all set. See scripts/ci-cloud-credentials/azure/README.md (Monitoring)." >&2
          exit 1

      - name: Azure login (Workload Identity Federation)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_CI_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_CI_SUBSCRIPTION_ID }}

      - name: Run the Azure Monitor monitoring-config test
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.AZURE_MONITORING_CONNECTION_STRING }}
          AZURE_MONITORING_APP_ID: ${{ vars.AZURE_MONITORING_APP_ID }}
        run: scripts/real-cloud-monitoring/azure-monitor.sh

  gcp-monitoring:
    name: Monitoring config (GCP Cloud Monitoring)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.gcp_monitoring_enabled == 'true'
        || (github.event.inputs.gcp_monitoring_enabled == null && vars.REAL_CLOUD_TESTS_GCP_MONITORING_ENABLED == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if GCP WIF variables are unset
        if: ${{ vars.GCP_CI_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_CI_SERVICE_ACCOUNT == '' || vars.GCP_REAL_CLOUD_TESTS_PROJECT == '' }}
        run: |
          echo "::error::REAL_CLOUD_TESTS_GCP_MONITORING_ENABLED is true but GCP_CI_WORKLOAD_IDENTITY_PROVIDER/GCP_CI_SERVICE_ACCOUNT/GCP_REAL_CLOUD_TESTS_PROJECT are not all set. See scripts/ci-cloud-credentials/gcp/README.md." >&2
          exit 1

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      # gcloud supplies the access token for the script's query-side
      # assertion; auth@v2 above wires its credential file into gcloud.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run the GCP Cloud Monitoring monitoring-config test
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_REAL_CLOUD_TESTS_PROJECT }}
        run: scripts/real-cloud-monitoring/gcp-cloud-monitoring.sh

  oci-monitoring:
    name: Monitoring config (OCI Monitoring)
    runs-on: ubuntu-24.04
    # The Management Agent's install + registration + first Prometheus
    # scrape cycle dominates; the script's own assertion deadline is 900s.
    timeout-minutes: 45
    environment: real-cloud-tests
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.oci_monitoring_enabled == 'true'
        || (github.event.inputs.oci_monitoring_enabled == null && vars.REAL_CLOUD_TESTS_OCI_MONITORING_ENABLED == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if OCI monitoring variables are unset
        run: |
          fail=0
          [ -z "${{ vars.OCI_CI_REGION }}" ] && { echo "::error::OCI_CI_REGION repository variable is unset." >&2; fail=1; }
          [ -z "${{ vars.OCI_CI_COMPARTMENT_ID }}" ] && { echo "::error::OCI_CI_COMPARTMENT_ID repository variable is unset." >&2; fail=1; }
          [ -z "${{ vars.OCI_MGMT_AGENT_INSTALLER_URL }}" ] && { echo "::error::OCI_MGMT_AGENT_INSTALLER_URL repository variable is unset — see scripts/ci-cloud-credentials/oci/README.md (Monitoring)." >&2; fail=1; }
          exit $fail

      # Same inline UPST exchange as the oci job above (its comment carries
      # the full rationale); kept immediately before the test so the
      # short-lived token's window matches its use.
      - name: Obtain OCI credentials (Workload Identity Federation)
        env:
          OCI_DOMAIN_URL: ${{ secrets.OCI_DOMAIN_URL }}
          OCI_WIF_CLIENT_ID: ${{ secrets.OCI_WIF_CLIENT_ID }}
          OCI_WIF_CLIENT_SECRET: ${{ secrets.OCI_WIF_CLIENT_SECRET }}
        run: |
          for v in OCI_DOMAIN_URL OCI_WIF_CLIENT_ID OCI_WIF_CLIENT_SECRET; do
            if [ -z "$(eval echo "\$$v")" ]; then
              echo "::error::The $v secret is unset in the real-cloud-tests environment. See scripts/ci-cloud-credentials/oci/README.md (Credentials)." >&2
              exit 1
            fi
          done
          OCI_DOMAIN_URL=$(printf '%s' "$OCI_DOMAIN_URL" | tr -d '[:space:]')
          OCI_WIF_CLIENT_ID=$(printf '%s' "$OCI_WIF_CLIENT_ID" | tr -d '[:space:]')
          OCI_WIF_CLIENT_SECRET=$(printf '%s' "$OCI_WIF_CLIENT_SECRET" | tr -d '[:space:]')

          openssl genrsa -out /tmp/oci-session-key.pem 2048 2>/dev/null
          public_key=$(openssl rsa -in /tmp/oci-session-key.pem -pubout -outform DER 2>/dev/null | base64 -w0)

          jwt=$(timeout 60 curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://cloud.oracle.com" | jq -r '.value')
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "::error::Could not obtain a GitHub OIDC token — is 'id-token: write' still in this job's permissions?" >&2
            exit 1
          fi

          response=$(timeout 120 curl -sS -u "$OCI_WIF_CLIENT_ID:$OCI_WIF_CLIENT_SECRET" \
            "$OCI_DOMAIN_URL/oauth2/v1/token" \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:oci:token-type:oci-upst' \
            --data-urlencode 'subject_token_type=jwt' \
            --data-urlencode "subject_token=$jwt" \
            --data-urlencode "public_key=$public_key")
          token=$(echo "$response" | jq -r '.token // empty')
          if [ -z "$token" ]; then
            sub_payload=$(echo "$jwt" | cut -d. -f2 | tr '_-' '/+')
            pad=$(( (4 - ${#sub_payload} % 4) % 4 ))
            [ $pad -gt 0 ] && sub_payload="$sub_payload$(printf '=%.0s' $(seq $pad))"
            echo "::error::The UPST exchange failed: $response (JWT sub: $(echo "$sub_payload" | base64 -d 2>/dev/null | jq -r '.sub // "undecodable"'))" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          while IFS= read -r keyline; do
            [ -n "$keyline" ] && echo "::add-mask::$keyline"
          done < /tmp/oci-session-key.pem

          {
            echo "KYTHIRA_OCI_SECURITY_TOKEN=$token"
            echo "KYTHIRA_OCI_PRIVATE_KEY_PEM<<KYTHIRA_SESSION_KEY_EOF"
            cat /tmp/oci-session-key.pem
            echo "KYTHIRA_SESSION_KEY_EOF"
            echo "KYTHIRA_OCI_REGION=${{ vars.OCI_CI_REGION }}"
            echo "KYTHIRA_OCI_COMPARTMENT_ID=${{ vars.OCI_CI_COMPARTMENT_ID }}"
          } >> "$GITHUB_ENV"
          rm -f /tmp/oci-session-key.pem
          echo "UPST obtained (${#token} chars)."

      - name: Run the OCI Monitoring monitoring-config test
        env:
          OCI_MGMT_AGENT_INSTALL_KEY: ${{ secrets.OCI_MGMT_AGENT_INSTALL_KEY }}
          OCI_MGMT_AGENT_INSTALLER_URL: ${{ vars.OCI_MGMT_AGENT_INSTALLER_URL }}
        run: scripts/real-cloud-monitoring/oci-monitoring.sh

  alibaba-monitoring:
    name: Monitoring config (Alibaba CloudMonitor)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: real-cloud-tests
    if: |
      (github.event.inputs.run_real_cloud_tests == 'true'
        || (github.event.inputs.run_real_cloud_tests == null && vars.REAL_CLOUD_TESTS_ENABLED == 'true'))
      && (github.event.inputs.alibaba_monitoring_enabled == 'true'
        || (github.event.inputs.alibaba_monitoring_enabled == null && vars.REAL_CLOUD_TESTS_ALIBABA_MONITORING_ENABLED == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if Alibaba monitoring variables are unset
        if: ${{ vars.ALIBABA_CMS_REMOTE_WRITE_URL == '' || vars.ALIBABA_CMS_PROM_QUERY_URL == '' }}
        run: |
          echo "::error::REAL_CLOUD_TESTS_ALIBABA_MONITORING_ENABLED is true but ALIBABA_CMS_REMOTE_WRITE_URL/ALIBABA_CMS_PROM_QUERY_URL are not both set. See scripts/ci-cloud-credentials/alibaba/README.md." >&2
          exit 1

      # CloudMonitor's Prometheus remote-write authenticates with a RAM
      # AccessKey pair over HTTP Basic — no OIDC-federated equivalent
      # exists for this ingestion path, so unlike every other provider here
      # these ARE stored credentials: scope the RAM user to the one
      # CloudMonitor instance (see scripts/ci-cloud-credentials/alibaba/
      # README.md for the deviation writeup).
      - name: Run the Alibaba CloudMonitor monitoring-config test
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          KYTHIRA_CMS_REMOTE_WRITE_URL: ${{ vars.ALIBABA_CMS_REMOTE_WRITE_URL }}
          KYTHIRA_CMS_PROM_QUERY_URL: ${{ vars.ALIBABA_CMS_PROM_QUERY_URL }}
        run: scripts/real-cloud-monitoring/alibaba-cloudmonitor.sh
