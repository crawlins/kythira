        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      - name: Configure (Release, real-cloud tests enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_AWS_REAL_EC2_TESTS=ON

      # One target, not the whole tree: nothing else in this job runs.
      - name: Build
        run: cmake --build build -j$(nproc) --target aws_asg_quorum_manager_real_test

      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — aws-asg"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      # See the identically named steps in the `aws` job for why both exist.
      - name: Clear the build cache's Oracle endpoint
        run: echo "AWS_ENDPOINT_URL=" >> "$GITHUB_ENV"

      - name: Re-configure AWS credentials for the test step (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: kythira-ci-real-cloud-tests-asg
          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      - name: Fail closed if the ASG test binary is missing
        run: |
          if [ ! -x build/tests/aws_asg_quorum_manager_real_test ]; then
            echo "::error::aws_asg_quorum_manager_real_test was not built — check AWSSDK_FOUND (with the autoscaling component) at configure time." >&2
            exit 1
          fi

