          aws-region: ${{ vars.AWS_REAL_CLOUD_TESTS_REGION || 'us-east-1' }}

      # Requirement 4.3-4.4: groups with their desired capacity, launch
      # templates and instances, re-checked for a bounded wait before a
      # finding counts. Fails the job on a leak or when it cannot look.
