name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Every base branch, not just `main`. A **stacked** PR -- one whose base is
    # another feature branch -- used to match no trigger at all and so ran this
    # workflow zero times. That is worse than an absent signal: with no required
    # checks present there is nothing for GitHub to report as missing, so such a
    # PR rendered with a single passing check and `mergeStateStatus=CLEAN`. It
    # looked *greener* than a PR that had actually built. PR #178 was opened
    # that way on August 7, 2026 and is what surfaced this.
    #
    # Retargeting the base to `main` afterwards does not rescue it, which is why
    # the fix has to be here rather than in a habit: this trigger uses the
    # default activity types (`opened`, `synchronize`, `reopened`) and changing
    # a base is `edited`, so a retargeted PR keeps its empty result until
    # something is pushed.
    #
    # The cost is real and accepted: a stacked PR now pays for the full matrix,
    # which since the backend-matrix widening is ~55 minutes of cold build per
    # compat leg. Adding `edited` to the activity types was the cheaper
    # alternative and was not taken -- it would only re-run on a retarget,
    # leaving a PR that is never retargeted still silently uncovered, and it
    # would also fire on every title and description edit.
    branches: ['**']

# Read-only by default. The three jobs that publish results widen this for
# themselves only (build-and-test, coverage, tsan), so a compromised step in
# any other job gets a token that cannot write checks or PR comments.
permissions:
  contents: read

# One CI run per PR (or per branch for pushes). The Actions concurrency cap is
# account-wide, so superseded runs used to sit in the queue for hours and
# starve every other repository: 74 runs were queued on October 3, 2026, most
# of them for commits that already had a newer run.
#
# A new push to a PR cancels the PR's older run, queued or running. On `main`
# only the queue is collapsed (GitHub keeps one pending run per group and
# cancels older pending ones regardless of this flag); a run already in
# progress is left to finish, so every main build that starts also reports.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Build and test ──────────────────────────────────────────────────────────
  # Runs under both GCC and Clang, on both x86_64 and native arm64 runners, to
  # catch compiler- and architecture-specific issues.
  # .kiro/specs/arm64-ci-verification/ (Requirement 1): arm64 legs run on
  # GitHub-hosted ubuntu-24.04-arm runners — native hardware, not emulated.
  build-and-test:
    permissions:
      contents: read
      checks: write         # dorny/test-reporter posts inline results
    name: Build & Test (${{ matrix.compiler }}, ${{ matrix.arch_label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-13
            os: ubuntu-24.04
            arch_label: x64
            timeout_minutes: 180
          - compiler: clang++-18
            os: ubuntu-24.04
            arch_label: x64
            timeout_minutes: 180
          - compiler: g++-13
            os: ubuntu-24.04-arm
            arch_label: arm64
            timeout_minutes: 180
          - compiler: clang++-18
            os: ubuntu-24.04-arm
            arch_label: arm64
            timeout_minutes: 180
          # GCC 14 / libstdc++ 14. This leg exists because the rest of the
          # matrix (g++-13, clang++-18) structurally cannot see a whole class
          # of breakage: libstdc++ 14 dropped transitive includes that 13
          # provided, and GCC 14 promoted several C diagnostics to errors by
          # default. Both were hit for real on Debian 13 (gcc 14.2.0, the same
          # version noble ships) -- see vcpkg-overlays/mvfst/README.md.
          #
          # x64 only, deliberately: this buys compiler coverage, not
          # architecture coverage, and the arm64 legs already cover the latter
          # for the two compilers that CI has always used.
          #
          # vcpkg_cc/vcpkg_cxx are set ONLY on this leg, and point vcpkg's own
          # port builds at GCC 14 as well. That is the entire point -- the
          # mvfst failure this leg is meant to catch happens while vcpkg
          # compiles a dependency, long before any kythira source is touched,
          # so a leg that only set CMAKE_CXX_COMPILER would sail straight past
          # it. On the other four legs these keys are unset, vcpkg keeps using
          # the runner's default c++, and nothing about their behaviour or
          # their cache keys changes.
          #
          # Higher timeout than the others for one reason: pointing vcpkg at a
          # different compiler changes every port's ABI hash, so this leg
          # cannot share the vcpkg binary cache with the g++-13 legs and its
          # first run is a genuinely cold build of the full dependency set.
          # Later runs restore from cache and look like any other leg.
          - compiler: g++-14
            os: ubuntu-24.04
            arch_label: x64
            timeout_minutes: 300
            vcpkg_cc: gcc-14
            vcpkg_cxx: g++-14

    # The read-write build-cache key is an environment secret of
    # build-cache-write, whose deployment branches are main only, so a
    # job on any other ref never receives it and cannot poison the cache
    # main builds from. Other refs run with no environment and fall back
    # to the read-only key. See doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # ── System dependencies ───────────────────────────────────────────────
      # Retries the whole update+install cycle: the ubuntu-24.04-arm runner
      # image has been observed losing outbound HTTP(S) route to
      # ports.ubuntu.com for a minute or more at a time (IPv6 "Network is
      # unreachable" plus IPv4 connection timeouts), well past what apt's
      # own per-package retry window covers. Re-running apt-get update
      # first on each attempt picks a fresh mirror/connection rather than
      # retrying against the same failed one.
      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          # autoconf/autoconf-archive/automake/libtool: not a direct
          # dependency of this project's own code -- required by vcpkg's
          # gperf port (vcpkg_make_configure/vcpkg_run_autoreconf), itself a
          # host-tool dependency of the proxygen port
          # (.kiro/specs/proxygen-http-transport/). Confirmed as the actual
          # CI failure cause (not a code bug) by reading the real CI log's
          # "gperf currently requires the following programs from the system
          # package manager" error.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 g++-13 \
                 g++-14 \
                 clang-18 \
                 cmake \
                 ninja-build \
                 libfiu-dev \
                 ccache \
                 autoconf \
                 autoconf-archive \
                 automake \
                 libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install Python tools
        run: |
          pip3 install --user "clang-format==22.1.5"
          # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect.
          # Without it cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag
          # rather than silently resolving a different feature set than the
          # one named (autodetect mode) — see that file's header comment.
          pip3 install --user -r scripts/kconfig/requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Required to build the lakers (EDHOC) overlay port's ffi/ crate from
      # source (vcpkg's "edhoc" feature below) — lakers publishes no
      # pre-built binaries for x64-linux or arm64-linux, only embedded-MCU
      # targets. Pinned explicitly rather than relying on the runner image's
      # bundled toolchain so this doesn't silently break on a runner image
      # update. dtolnay/rust-toolchain installs a native aarch64-unknown-
      # linux-gnu toolchain on the arm64 runner the same way it installs
      # x86_64-unknown-linux-gnu on x64 (see spike-notes.md).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # ── vcpkg triplet ─────────────────────────────────────────────────────
      # .kiro/specs/arm64-ci-verification/ (Requirement 2): resolved from the
      # runner's own architecture rather than hardcoded, so this same job
      # definition serves both x64 and arm64 matrix entries.
      - name: Resolve vcpkg triplet
        id: triplet
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            echo "value=arm64-linux" >> "$GITHUB_OUTPUT"
          else
            echo "value=x64-linux" >> "$GITHUB_OUTPUT"
          fi

      # ── vcpkg (Boost, Folly, Poco, libcoap, lakers, …) ───────────────────
      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. The writer policy -- only a
      # push to main gets the read-write key -- lives in that action and
      # nowhere else. See .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          # runner.arch is part of the key (Requirement 4) so an arm64 leg
          # can never restore (or silently corrupt) an x86_64-built cache
          # entry, or vice versa — runner.os alone is "Linux" on both.
          #
          # matrix.vcpkg_cxx is appended only on legs that override vcpkg's
          # compiler (currently just g++-14). Without it that leg would share
          # this key with the g++-13 legs and restore a dependency tree built
          # by a different compiler -- the same class of silent cross-
          # contamination runner.arch is here to prevent. The conditional
          # leaves the key byte-identical on every leg that does not set it,
          # so adding the GCC 14 leg neither invalidates the existing caches
          # nor stops this job sharing them with the coverage job below.
          #
          # vcpkg-configuration.json is hashed alongside vcpkg.json because
          # its registry entry is what moves packages (openssl, curl, ...)
          # to a newer vcpkg commit. Without it a registry-only bump hits
          # the old tree, the install step below is skipped, and every leg
          # keeps building against the versions it was meant to replace.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc${{ matrix.vcpkg_cxx && format('-{0}', matrix.vcpkg_cxx) || '' }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action as
          # x-aws against the bucket. Re-exporting it here would override that,
          # and x-gha is a backend vcpkg removed some time ago -- which is why
          # these jobs had no binary cache at all until this change.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          # Build the ports themselves with this leg's compiler, when it asks
          # for one. Guarded rather than exported unconditionally: on the legs
          # that set neither, `export CC=` would hand CMake an empty string as
          # the compiler rather than leaving it to its own detection, which is
          # a worse failure than the one this prevents.
          if [ -n "${{ matrix.vcpkg_cxx }}" ]; then
            export CC="${{ matrix.vcpkg_cc }}"
            export CXX="${{ matrix.vcpkg_cxx }}"
            echo "vcpkg will build ports with CC=$CC CXX=$CXX"
          fi
          # Blobless clone: full commit+tree history (needed for git read-tree
          # when vcpkg checks out port files), but no file blobs until accessed.
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          # Pin the vcpkg tool + scripts + registry to vcpkg.json's
          # builtin-baseline instead of a moving HEAD. This CI bootstraps
          # vcpkg by cloning microsoft/vcpkg at HEAD, but pins port
          # *versions* via vcpkg.json's builtin-baseline -- so the tool and
          # scripts are a moving target while the versions are fixed. On a
          # warm binary cache this is invisible; on any cold build (cache
          # miss, for any reason -- a dependency change, cache eviction, or
          # just this being the first build for a given runner arch) it
          # picks up whatever vcpkg-tool HEAD is that day. Observed directly
          # on this branch (which touches no vcpkg.json dependency at all):
          # an upstream vcpkg-tool regression's SBOM script
          # (scripts/cmake/z_vcpkg_spdx.cmake) called a string(JSON ...
          # STRING_ENCODE) mode the bundled cmake rejects, failing every
          # port build ("building zlib:arm64-linux failed with:
          # BUILD_FAILED"). Pinning to the same commit the manifest's
          # version constraints already resolve against keeps the tool,
          # scripts, and resolved versions consistent and cold builds
          # reproducible regardless of upstream HEAD churn.
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          # --x-feature=edhoc: builds the lakers overlay port (see
          # vcpkg-overlays/lakers/) so LAKERS_AVAILABLE is defined and the
          # EDHOC-to-OSCORE bootstrap path is exercised, not just stubbed.
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      # ── Format check ──────────────────────────────────────────────────────
      # Only run once per workflow run (x64/g++-13), never per-architecture,
      # since clang-format output does not vary by target architecture
      # (.kiro/specs/arm64-ci-verification/ Requirement 8.1).
      - name: Configure (format-check)
        if: matrix.compiler == 'g++-13' && matrix.arch_label == 'x64'
        run: |
          # No launcher here on purpose: this tree exists only to run
          # clang-format and is configured before `Start sccache`, so
          # referencing that step's output would be a forward reference (and
          # actionlint says so). It compiles nothing.
          cmake -B build-fmt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}

      - name: Check formatting
        if: matrix.compiler == 'g++-13' && matrix.arch_label == 'x64'
        run: cmake --build build-fmt --target format-check

      # ── Release build + tests ─────────────────────────────────────────────
      # sccache, not ccache: its objects live in the OCI bucket, so they
      # survive the runner being destroyed. The script decides whether this
      # job may use it by compiling a five-byte file through it, because no
      # sccache exit status distinguishes a healthy server that is already
      # listening from one whose storage backend is unreachable -- see its
      # header for the measured table, and Task 9 for the red build that is
      # what happens when a job trusts the exit status instead.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      - name: Configure (Release)
        run: |
          # Test budgets were implicitly sized against clang++-18 Release, the
          # fastest configuration this matrix builds. Measured on GitHub
          # runners, full suite, same selection: g++-13 Release runs the coap
          # tests 1.3-5.0x slower than clang (median 1.4x), and the same tests
          # that pass 0/12 under clang fail up to 89% under g++. Scaling here
          # covers every leg rather than only Coverage. See
          # doc/coap-flake-investigation.md.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_TEST_TIMEOUT_SCALE=4 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      # The numbers Requirement 5.5 wants in the job summary, and the ones
      # Requirement 6 is checked against. `always()` so a failed build still
      # reports what it cached: a leg with 0 cacheable requests is a finding.
      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — ${{ matrix.compiler }} ${{ matrix.arch_label }}"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      - name: Test
        id: test
        run: |
          # pipefail is not on by default in Actions' `bash -e {0}` shell, and
          # without it `| tee` would swallow ctest's exit code and report every
          # run as a success -- the exact class of bug the check step below
          # exists to catch.
          # --timeout: this project calls enable_testing() without
          # include(CTest), so no DartConfiguration.tcl is generated and there
          # is therefore **no default ctest timeout at all** -- a hung test runs
          # until the job's own budget expires. Observed for real on a boost
          # compat leg: 409 of 413 tests finished in 7 minutes, then one hung
          # for 2h08m until timeout-minutes killed the job. The Test step then
          # reports `cancelled`, which `gh pr checks` renders as a bare `fail`
          # naming nothing; the only clue was the runner's own "Terminate orphan
          # process" line. Three hours spent, no diagnosis produced.
          #
          # A test's own TIMEOUT property still wins where one is set (~122 of
          # 421 tests have one, scaled by KYTHIRA_TEST_TIMEOUT_SCALE); this only
          # supplies a ceiling for the rest. Sized from measurement rather than
          # taste: the slowest test in a real 414-test run took 141s, so 900s is
          # ~6x the observed worst case. The instrumented jobs (coverage, tsan)
          # use 1800 for the same headroom against a slower binary.
          set -o pipefail
          ctest --test-dir build \
            -j$(nproc) \
            --output-on-failure \
            --output-junit ${{ github.workspace }}/test-results.xml \
            --repeat until-pass:3 \
            --no-tests=error \
            --timeout 900 \
            -LE '^(slow|performance|verbose|benchmark|docker)$' \
            2>&1 | tee ctest-out.txt
        continue-on-error: true

      # Asserts the run did the work its exit code implies. Green here means
      # every registered test actually executed. It also lists every test
      # that passed only because `--repeat until-pass:3` retried it, split
      # into known flakes (.github/ctest-retry-allowlist.txt) and new ones.
      # With the repository variable CTEST_STRICT_RETRIES=true a new one fails
      # this step; see the allowlist's header for why that is not yet the
      # default. No --allow-skip: every
      # skip-capable test in this repo carries a label this filter already
      # excludes, so any skip appearing here is a real regression.
      - name: Check the test run did the work
        if: always()
        run: |
          scripts/check-test-run.sh \
            --build-dir build \
            --log ctest-out.txt \
            --floor 400 \
            ${{ vars.CTEST_STRICT_RETRIES == 'true' && '--strict-retries' || '' }} \
            --allow-retry-file .github/ctest-retry-allowlist.txt \
            -- -LE '^(slow|performance|verbose|benchmark|docker)$'

      # future-backend-performance-benchmark Requirement 4: the CTest variant
      # of the backend benchmark asserts only hardware-independent sanity
      # floors and is meant to run in routine CI. The main Test step must keep
      # excluding the `benchmark` label (the label also selects heavier suites
      # nobody wants per PR), so this one test is selected by name and run on
      # its own after the -j$(nproc) suite has finished: a timing floor
      # measured while every core is busy with other tests would measure the
      # contention, not the backend. Retries match the main step; a floor that
      # fails three times in a row is a real regression, and the check below
      # still reports any first-attempt failure the retry absorbed.
      - name: Benchmark sanity floors
        if: always() && steps.test.outcome != 'skipped'
        run: |
          set -o pipefail
          ctest --test-dir build \
            --output-on-failure \
            --repeat until-pass:3 \
            --no-tests=error \
            -R '^future_backend_benchmark_test$' \
            2>&1 | tee ctest-bench-out.txt

      - name: Check the benchmark run did the work
        if: always() && steps.test.outcome != 'skipped'
        run: |
          scripts/check-test-run.sh \
            --build-dir build \
            --log ctest-bench-out.txt \
            --floor 1 \
            ${{ vars.CTEST_STRICT_RETRIES == 'true' && '--strict-retries' || '' }} \
            --allow-retry-file .github/ctest-retry-allowlist.txt \
            -- -R '^future_backend_benchmark_test$'

      # The EC2 tag-scan discovery test (.kiro/specs/multi-machine-placement/
      # task 8) is labelled `slow;localstack`, so the Test step above filters
      # it out, and until this step nothing started a LocalStack for it. Its
      # subject is DescribeInstances filter syntax and tag round-tripping,
      # which only a real EC2 API shape can check, and LocalStack serves that
      # shape with no credentials. One leg is enough: the subject is the API
      # dialogue, not the compiler or the architecture.
      #
      # Pinned to 4.14.0, the tag docker/cloudwatch-localstack-compose.yml
      # already uses, because later LocalStack images need an auth token. The
      # test exits 77 (ctest "Not Run", which ctest does not count as a
      # failure) when LocalStack is unreachable, so the step fails on a skip
      # explicitly: a skip here means the step stopped doing its job.
      - name: Run the EC2 discovery test against LocalStack
        if: matrix.compiler == 'g++-13' && matrix.arch_label == 'x64'
        run: |
          set -o pipefail
          docker run -d --rm --name localstack -p 4566:4566 -e SERVICES=ec2 \
            localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:4566/_localstack/health \
                | grep -Eq '"ec2": "(available|running)"'; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::LocalStack EC2 never became available"
            docker logs localstack | tail -50
            exit 1
          fi
          ctest --test-dir build \
            -R '^aws_ec2_peer_discovery_localstack_test$' \
            --output-on-failure \
            --no-tests=error \
            --timeout 300 \
            2>&1 | tee ctest-localstack-out.txt
          if grep -q 'tests did not run' ctest-localstack-out.txt; then
            echo "::error::aws_ec2_peer_discovery_localstack_test was skipped"
            exit 1
          fi

      - name: Stop LocalStack
        if: always() && matrix.compiler == 'g++-13' && matrix.arch_label == 'x64'
        run: docker stop localstack || true

      - name: Publish test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: always()
        with:
          name: Unit Tests (${{ matrix.compiler }}, ${{ matrix.arch_label }})
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.compiler }}-${{ matrix.arch_label }}
          path: test-results.xml

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  # ── GCP SDK build (google-cloud-cpp) ────────────────────────────────────────
  # Isolated to its own job because the google-cloud-cpp `compute` component
  # builds the entire Compute API surface (large) — forcing it onto every
  # build-and-test matrix leg would risk timeouts. Enables the vcpkg `gcp`
  # feature (google-cloud-cpp compute + privateca), which turns on
  # KYTHIRA_HAS_GCP_SDK / KYTHIRA_HAS_GCP_PRIVATECA, then compiles the GCP
  # quorum-manager / CAS-provider targets and runs their unit tests. This is
  # where the SDK-gated code (gcp_compute_quorum_manager, gcp_mig_quorum_manager,
  # gcp_privateca_certificate_provider) is actually compiled against the SDK;
  # the main build-and-test jobs only exercise the unconditional validators.
  gcp-sdk-build:
    name: GCP SDK Build (clang++-18, x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # The read-write build-cache key is an environment secret of
    # build-cache-write, whose deployment branches are main only, so a
    # job on any other ref never receives it and cannot poison the cache
    # main builds from. Other refs run with no environment and fall back
    # to the read-only key. See doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev ccache \
                 autoconf autoconf-archive automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect
      # (cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag without it).
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      # Distinct cache key ("-gcp" suffix) so this job's vcpkg_installed (which
      # includes google-cloud-cpp via --x-feature=gcp) never collides with the
      # main build-and-test jobs' cache, which is built without that feature.
      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. The writer policy -- only a
      # push to main gets the read-write key -- lives in that action and
      # nowhere else. See .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-gcp-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies (with gcp feature)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action as
          # x-aws against the bucket. Re-exporting it here would override that,
          # and x-gha is a backend vcpkg removed some time ago -- which is why
          # these jobs had no binary cache at all until this change.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=gcp
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      # sccache, not ccache: its objects live in the OCI bucket, so they
      # survive the runner being destroyed. The script decides whether this
      # job may use it by compiling a five-byte file through it, because no
      # sccache exit status distinguishes a healthy server that is already
      # listening from one whose storage backend is unreachable -- see its
      # header for the measured table, and Task 9 for the red build that is
      # what happens when a job trusts the exit status instead.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      - name: Configure (Release, GCP SDK + real-test compile)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_gcp_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            -DKYTHIRA_GCP_REAL_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build GCP targets
        run: |
          cmake --build build -j$(nproc) --target \
            gcp_quorum_manager_unit_test \
            gcp_privateca_provider_unit_test \
            gcp_gcs_client_unit_test \
            gcp_quorum_manager_real_gce_test \
            gcp_privateca_provider_real_test \
            ca_service

      # The numbers Requirement 5.5 wants in the job summary, and the ones
      # Requirement 6 is checked against. `always()` so a failed build still
      # reports what it cached: a leg with 0 cacheable requests is a finding.
      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — gcp-sdk-build"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      - name: Run GCP unit tests
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^(gcp_quorum_manager_unit_test|gcp_privateca_provider_unit_test|gcp_gcs_client_unit_test)$'

  # ── Ion serializer build (ion-c) ─────────────────────────────────────────────
  # The only job that installs the opt-in vcpkg `ion` feature, and therefore the
  # only one under which ion-c is compiled at all or any ion_* test runs. Before
  # it existed, all six of those tests were registered by tests/CMakeLists.txt
  # and then silently skipped everywhere, because no CI image had ion-c in it.
  #
  # It is pinned to GCC 14 on purpose, and that is the load-bearing part rather
  # than an arbitrary compiler choice. vcpkg-overlays/ion-c/0003-… exists because
  # GCC 14 promoted -Wincompatible-pointer-types to an error and ion-c 1.1.3
  # trips it twice; under g++-13 or clang++-18 both sites are warnings at most,
  # so a leg on either compiler would keep building a *reverted* patch happily
  # and prove nothing. Under gcc-14 dropping that patch is a hard build failure
  # here, which is the regression guard the patch previously had none of.
  #
  # vcpkg_cc/vcpkg_cxx equivalents are set inline (this job has no matrix): the
  # ion-c compile happens inside vcpkg's own port build, long before any kythira
  # source is touched, so pointing only CMAKE_CXX_COMPILER at GCC 14 would sail
  # straight past it — the same reasoning as the GCC 14 build-and-test leg.
  #
  # Timeout 300, not 180, for that leg's reason too: CC/CXX are part of every
  # port's ABI hash, so this job's vcpkg binary-cache entries are shared with the GCC 14
  # build-and-test leg and with nothing else, and the first run after either
  # changes is a cold build of the whole dependency set.
  ion-serializer-build:
    name: Ion Serializer Build (g++-14, x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # The read-write build-cache key is an environment secret of
    # build-cache-write, whose deployment branches are main only, so a
    # job on any other ref never receives it and cannot poison the cache
    # main builds from. Other refs run with no environment and fall back
    # to the read-only key. See doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          # g++-14 pulls gcc-14, which is what actually compiles ion-c (a C
          # library) and so what actually enforces the patch this job guards.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 g++-14 cmake ninja-build libfiu-dev ccache \
                 autoconf autoconf-archive automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect
      # (cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag without it).
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # configs/ci_ion_defconfig keeps CONFIG_EDHOC=y, so this job installs the
      # edhoc feature too and needs the Rust toolchain the lakers overlay port
      # builds from source, exactly as the build-and-test legs do.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      # Distinct cache key ("-edhoc-ion-g++-14"): this tree is the edhoc tree
      # plus ion-c AND is built by a different compiler than the default legs,
      # so it must not collide with either the plain edhoc caches or the
      # GCC 14 build-and-test leg's edhoc-only one.
      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. The writer policy -- only a
      # push to main gets the read-write key -- lives in that action and
      # nowhere else. See .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-ion-g++-14-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies (with ion feature)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). The ion tree is the GCC 14
          # edhoc tree plus ion-c, so once that leg has run only the delta is
          # ever built here.
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action as
          # x-aws against the bucket. Re-exporting it here would override that,
          # and x-gha is a backend vcpkg removed some time ago -- which is why
          # these jobs had no binary cache at all until this change.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          # Unconditional here, unlike the matrix leg's guarded export: this job
          # has exactly one compiler and building ion-c under it is the point.
          export CC=gcc-14
          export CXX=g++-14
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          # Both features, not just ion: configs/ci_ion_defconfig is
          # ci_full_defconfig plus CONFIG_ION_SERIALIZER, and CONFIG_EDHOC=y
          # under KYTHIRA_KCONFIG_STRICT=ON hard-fails without lakers.
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc --x-feature=ion
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      # sccache, not ccache: its objects live in the OCI bucket, so they
      # survive the runner being destroyed. The script decides whether this
      # job may use it by compiling a five-byte file through it, because no
      # sccache exit status distinguishes a healthy server that is already
      # listening from one whose storage backend is unreachable -- see its
      # header for the measured table, and Task 9 for the red build that is
      # what happens when a job trusts the exit status instead.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # KYTHIRA_KCONFIG_STRICT=ON is what turns "ion-c is installed" into an
      # assertion: if --x-feature=ion ever stops delivering it, this configure
      # FATAL_ERRORs instead of quietly dropping every target below.
      - name: Configure (Release, Ion serializer)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DKYTHIRA_KCONFIG=configs/ci_ion_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_TEST_TIMEOUT_SCALE=4 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Only the ion-gated targets, not the whole tree: everything else here is
      # byte-identical to what the build-and-test legs already build, and this
      # job is not a second full build.
      - name: Build Ion targets
        run: |
          cmake --build build -j$(nproc) --target \
            ion_binary_decimal_regression_test \
            ion_serializer_concept_test \
            ion_serialization_property_test \
            ion_malformed_message_property_test \
            ion_json_serializer_equivalence_property_test \
            shard_group_id_ion_wire_property_test \
            ion_http_coap_end_to_end_test

      # The numbers Requirement 5.5 wants in the job summary, and the ones
      # Requirement 6 is checked against. `always()` so a failed build still
      # reports what it cached: a leg with 0 cacheable requests is a finding.
      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — ion-serializer-build"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
      # --no-tests=error, not a bare ctest: an empty selection is the exact
      # failure this job exists to catch, and ctest exits 0 on one by default.
      - name: Run Ion tests
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^(ion_binary_decimal_regression_test|ion_serializer_concept_test|ion_serialization_property_test|ion_malformed_message_property_test|ion_json_serializer_equivalence_property_test|shard_group_id_ion_wire_property_test|ion_http_coap_end_to_end_test)$'

  # ── Config variants (minimal, no-cloud, dependency isolation) ───────────────
  # .kiro/specs/ci-build-matrix-coverage/ Requirements 5 and 6. Three checks no
  # other job makes, sharing one vcpkg install (Requirement 7.4):
  #
  #   * configs/minimal_defconfig, strict, built in full. Its tests are a
  #     subset of ci_full_defconfig's, which the build-and-test legs already
  #     run; what nothing checked is that "the smallest buildable
  #     configuration" compiles and links.
  #   * configs/no_cloud_defconfig, NOT strict (its header says why), building
  #     and running the one test its header's usage block names.
  #   * scripts/verify-optional-dependency-isolation.sh (stdexec-future-backend
  #     Property 5): a configure with stdexec hidden still builds.
  #
  # Each gets its own build directory so CMake cache state from one cannot
  # leak into the next (Requirement 5.3).
  #
  # The vcpkg tree is the edhoc tree under the same actions/cache key the x64
  # g++-13/clang++-18 build-and-test legs use, so it restores warm and vcpkg
  # never runs here. clang++-18 is the fastest compiler this workflow builds
  # with (see the Configure (Release) comment in build-and-test).
  config-variants:
    name: Config Variants (clang++-18, x64)
    runs-on: ubuntu-24.04
    # Sized from build-and-test's 180-minute budget for one full cold build,
    # plus headroom for the two smaller builds. Measured on main: 9.6 min
    # with a warm sccache (run 37567880231) and 39.4 min after a change to
    # widely included headers (run 37584489048). No fully cold run has been
    # observed, so the cold-build sizing stands.
    timeout-minutes: 240
    # The read-write build-cache key is an environment secret of
    # build-cache-write, whose deployment branches are main only, so a
    # job on any other ref never receives it and cannot poison the cache
    # main builds from. Other refs run with no environment and fall back
    # to the read-only key. See doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          # autoconf & co. are for vcpkg's gperf port, needed only on a cold
          # vcpkg cache; see the build-and-test job.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev \
                 autoconf autoconf-archive automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect
      # (cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag without it).
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # Only reached on a cold vcpkg cache: the edhoc feature builds the
      # lakers overlay port from Rust source.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. See
      # .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      # Byte-identical to the x64 build-and-test legs' key (they set no
      # vcpkg_cxx), so this job shares their tree rather than keeping a third
      # copy of it.
      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action; see
          # the build-and-test job for why it is not re-exported here, and
          # why vcpkg is pinned to vcpkg.json's builtin-baseline.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      # sccache objects live in the OCI bucket, so the minimal build shares
      # most of its objects with the build-and-test legs; see that job.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # Strict: every symbol minimal_defconfig leaves on must have its
      # dependency found, so this configure is also the check that the file
      # turns off everything the edhoc image cannot satisfy.
      - name: Configure (minimal_defconfig, strict)
        run: |
          cmake -B build-minimal -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/minimal_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}

      # Every target the configuration enables (Requirement 5.1), not a
      # sample: "smallest buildable configuration" is a claim about all of
      # them. Nothing is run; ci_full_defconfig's legs already run a superset.
      - name: Build (minimal_defconfig)
        run: cmake --build build-minimal -j$(nproc)

      # The build directory is several GB of objects nothing below reads.
      - name: Remove the minimal build tree
        run: rm -rf build-minimal

      # Not strict, as no_cloud_defconfig's own header requires: every symbol
      # it names is being turned off on purpose, and strict mode asserts the
      # opposite (that what is left on was found).
      - name: Configure (no_cloud_defconfig)
        run: |
          cmake -B build-nocloud -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/no_cloud_defconfig \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_TEST_TIMEOUT_SCALE=4 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}

      - name: Build (no_cloud_defconfig)
        run: cmake --build build-nocloud -j$(nproc) --target object_store_persistence_unit_test

      # --no-tests=error: an empty selection is exactly the failure this step
      # exists to catch, and ctest exits 0 on one by default.
      - name: Test (no_cloud_defconfig)
        run: |
          set -o pipefail
          ctest --test-dir build-nocloud --output-on-failure --no-tests=error \
            -R '^object_store_persistence_unit_test$' \
            2>&1 | tee ctest-nocloud-out.txt

      - name: Check the no-cloud test run did the work
        if: always()
        run: |
          scripts/check-test-run.sh \
            --build-dir build-nocloud \
            --log ctest-nocloud-out.txt \
            --floor 1 \
            -- -R '^object_store_persistence_unit_test$'

      # The script configures its own throwaway build directory against the
      # prefix below (Requirement 6). CXX, the generator and the launcher come
      # from the environment so its one target builds like the rest of this
      # job instead of with the runner's default g++ and make; the launcher
      # is passed explicitly because the script's default (auto) would pick
      # sccache off PATH even when start-sccache.sh found it unusable.
      - name: Verify optional-dependency isolation
        env:
          KYTHIRA_PREFIX_PATH: ${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}
          KYTHIRA_COMPILER_LAUNCHER: ${{ steps.sccache.outputs.launcher || 'none' }}
          CXX: clang++-18
          CMAKE_GENERATOR: Ninja
        run: scripts/verify-optional-dependency-isolation.sh

      # The opposite of the separate-build-directories rule above: one tree
      # configured with optional features on, then reconfigured with them
      # off, must match a fresh tree. pkg_check_modules() results live in the
      # CMake cache and used to survive the switch. Configure only, no build;
      # libfiu-dev (apt, above) is the pkg-config feature this image has.
      - name: Verify Kconfig reconfigure drops disabled features
        env:
          KYTHIRA_PREFIX_PATH: ${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}
          CXX: clang++-18
        run: scripts/verify-kconfig-reconfigure.sh

      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — config-variants"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

  # ── Alternate CoAP backends (cantcoap + libnyoci) ────────────────────────────
  # The only job that builds with CONFIG_COAP_TRANSPORT_CANTCOAP=y and
  # CONFIG_COAP_TRANSPORT_LIBNYOCI=y. Every coap_cantcoap_* and coap_libnyoci_*
  # target is registered and built in every other job too, but without its
  # library each compiles to a single "backend unavailable, skipped" case and
  # passes, so before this job neither backend's real suite had run in CI at
  # all. See .kiro/specs/ci-build-matrix-coverage/ (Requirement 1, design §2).
  #
  # Same compiler as the g++-13 x64 Build & Test leg, so the vcpkg binary cache
  # already holds every package this tree shares with it and a warm run builds
  # only the two overlay ports. The features are NOT added to the build-and-test
  # legs (Requirement 1.6): their feature set, cache key and runtime are
  # unchanged.
  alt-coap-backends:
    name: Alternate CoAP Backends (g++-13, x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # Same build-cache-write gating as ion-serializer-build; see its comment.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          # autoconf, autoconf-archive, automake and libtool are what the
          # libnyoci overlay port builds with (vcpkg-overlays/libnyoci/README.md);
          # every vcpkg job already installs them for gperf.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 g++-13 cmake ninja-build libfiu-dev ccache \
                 autoconf autoconf-archive automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect
      # (cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag without it).
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # configs/ci_alt_coap_defconfig keeps CONFIG_EDHOC=y, so this job installs
      # the edhoc feature too and needs the Rust toolchain the lakers overlay
      # port builds from source, exactly as the build-and-test legs do.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. The writer policy -- only a
      # push to main gets the read-write key -- lives in that action and
      # nowhere else. See .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      # Distinct key ("-edhoc-coap-alt-"): this tree is the g++-13 edhoc tree
      # plus cantcoap and libnyoci, so restoring the plain edhoc cache would
      # skip the install and leave both libraries missing (which strict mode
      # would then report as a configure failure, not a cache problem).
      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-coap-alt-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies (with alternate CoAP backends)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action as
          # x-aws against the bucket; see the build-and-test job's comment.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage \
            --x-feature=edhoc --x-feature=coap-cantcoap --x-feature=coap-libnyoci
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      # sccache, not ccache: its objects live in the OCI bucket. See the
      # build-and-test job's comment on the same step.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # KYTHIRA_KCONFIG_STRICT=ON is what turns "the two features are
      # installed" into an assertion: if either stops delivering its library,
      # this configure FATAL_ERRORs instead of quietly reverting every
      # alternate-backend suite to its stub.
      - name: Configure (Release, alternate CoAP backends)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DKYTHIRA_KCONFIG=configs/ci_alt_coap_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_TEST_TIMEOUT_SCALE=4 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Fails before the build, not after it, when a backend's test sources
      # would compile without its *_AVAILABLE define: strict mode proves the
      # library was found, this proves the define reached the tests.
      - name: Check both backends are compiled in
        run: scripts/check-coap-alt-backends.sh configured --build-dir build

      # Only the coap_* test targets, not the whole tree: everything else is
      # byte-identical to what the g++-13 build-and-test leg already builds.
      # Every coap_* test, not only the cantcoap and libnyoci ones
      # (Requirement 1.4): shared CoAP headers compiled with
      # CANTCOAP_AVAILABLE/LIBNYOCI_AVAILABLE defined take paths the default
      # build never compiles. The list comes from ctest's registry, so a new
      # coap_* test is picked up without editing this file. Each test maps to
      # the target of the same name or, for the coap_*_example tests (named
      # <target>_test), that name without "_test". The executables do not
      # exist yet, so ctest cannot report them itself: --show-only=json-v1
      # omits the command of a test whose executable is missing.
      - name: Build CoAP test targets
        run: |
          set -o pipefail
          ninja -C build -t targets all | sed -nE 's/^([A-Za-z0-9_]+): .*/\1/p' \
            | sort -u > known-targets.txt
          mapfile -t tests < <(
            ctest --test-dir build -N -R '^coap_' \
              -LE '^(slow|performance|verbose|benchmark|docker)$' \
              | sed -nE 's/^ *Test +#[0-9]+: (coap_[A-Za-z0-9_]+)$/\1/p')
          targets=()
          for t in "${tests[@]}"; do
            if grep -qx "$t" known-targets.txt; then
              targets+=("$t")
            elif grep -qx "${t%_test}" known-targets.txt; then
              targets+=("${t%_test}")
            else
              echo "::error::no build target for test $t" >&2
              exit 1
            fi
          done
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::ctest lists no coap_* tests; nothing to build" >&2
            exit 1
          fi
          echo "Building ${#targets[@]} coap_* targets"
          cmake --build build -j$(nproc) --target "${targets[@]}"

      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — alt-coap-backends"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      # The check that catches a backend silently compiling to its stub, which
      # the configure check and the floor below cannot: each alternate-backend
      # binary must list its real cases and no stub case.
      - name: Check the real suites were built
        run: scripts/check-coap-alt-backends.sh suites --build-dir build

      # Same flags as the build-and-test legs' Test step; see its comments on
      # pipefail, --no-tests=error and --timeout.
      - name: Run CoAP tests
        id: test
        run: |
          set -o pipefail
          ctest --test-dir build \
            -j$(nproc) \
            --output-on-failure \
            --repeat until-pass:3 \
            --no-tests=error \
            --timeout 900 \
            -R '^coap_' \
            -LE '^(slow|performance|verbose|benchmark|docker)$' \
            2>&1 | tee ctest-out.txt
        continue-on-error: true

      # The floor is the count of coap_* tests this filter matched when the job
      # landed; a configure change that drops any of them fails here even if
      # every remaining test passes. See scripts/check-test-run.sh.
      - name: Check the test run did the work
        if: always()
        run: |
          scripts/check-test-run.sh \
            --build-dir build \
            --log ctest-out.txt \
            --floor 72 \
            -- -R '^coap_' -LE '^(slow|performance|verbose|benchmark|docker)$'

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  # ── DNS discovery build (libldns + BIND, Poco DNSSD + Avahi) ─────────────────
  # The only job that builds with CONFIG_DNS_DISCOVERY=y or
  # CONFIG_POCO_DISCOVERY=y. libldns is in no other CI image, so before this job
  # the RFC 1035/2136/6763 peer-discovery classes, the
  # dns_discovery_node/dns_sd_discovery_node binaries and ACME dns-01 (all
  # behind KYTHIRA_HAS_LDNS) were never compiled in CI at all. The same was
  # true of poco_peer_discovery and poco_discovery_node (KYTHIRA_HAS_POCO_DNSSD)
  # until the vcpkg-overlays/poco-dnssd port replaced the hand-built archives.
  #
  # Same compiler and vcpkg tree as the g++-13 x64 Build & Test leg plus the
  # poco-dnssd feature, so on a warm binary cache the only new work is that
  # port and the discovery targets. libldns-dev and bind9 come from apt:
  # libldns has no vcpkg port, and the Dockerfiles that ship these binaries
  # already use Ubuntu's libldns3. libavahi-client-dev is the host library the
  # poco-dnssd port builds against (vcpkg has no avahi port), and
  # avahi-daemon is what poco_peer_discovery_unit_test talks to: constructing
  # a poco_peer_discovery opens an Avahi client, which throws without a
  # running daemon.
  #
  # bind9 supplies named for dns_discovery_bind_integration_test, which starts
  # a throwaway server through scripts/dns-test-server.sh (a CTest fixture) and
  # runs TSIG-signed UPDATEs and ACME dns-01 against it. Two things the package
  # does on install have to be undone for that: it starts named.service on
  # port 53, which nothing here needs, and it loads an AppArmor profile that
  # stops /usr/sbin/named reading a config anywhere outside /etc/bind.
  dns-discovery-build:
    name: DNS Discovery Build (g++-13, x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 g++-13 cmake ninja-build libfiu-dev ccache \
                 autoconf autoconf-archive automake libtool \
                 libldns-dev bind9 libavahi-client-dev avahi-daemon; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt-get install failed after 3 attempts" >&2
              exit 1
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          sudo systemctl disable --now named
          # The package starts the daemon on install; make sure, and fail here
          # rather than as 24 DNSSDExceptions in the Poco test if it did not.
          sudo systemctl start avahi-daemon
          avahi-daemon --check
          if [ -e /etc/apparmor.d/usr.sbin.named ] && [ -d /sys/kernel/security/apparmor ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.named
          fi

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect
      # (cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag without it).
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # configs/ci_dns_defconfig keeps CONFIG_EDHOC=y, so this job installs the
      # edhoc feature too and needs the Rust toolchain the lakers overlay port
      # builds from source, exactly as the build-and-test legs do.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. The writer policy -- only a
      # push to main gets the read-write key -- lives in that action and
      # nowhere else. See .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      # The g++-13 build-and-test legs' key plus the poco-dnssd feature: the
      # tree is theirs with one more port in it. On a miss, every port but
      # poco-dnssd comes from the shared vcpkg binary cache.
      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-poco-dnssd-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action as
          # x-aws against the bucket; see the build-and-test job's comment.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc --x-feature=poco-dnssd
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      # sccache, not ccache: its objects live in the OCI bucket. See the
      # build-and-test job's comment on the same step.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # KYTHIRA_KCONFIG_STRICT=ON is what turns "libldns-dev is installed" into
      # an assertion: if pkg-config ever stops finding ldns, or the poco-dnssd
      # port stops resolving, this configure FATAL_ERRORs instead of quietly
      # dropping every target below.
      - name: Configure (Release, DNS discovery)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DKYTHIRA_KCONFIG=configs/ci_dns_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_TEST_TIMEOUT_SCALE=4 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Only the targets KYTHIRA_HAS_LDNS and KYTHIRA_HAS_POCO_DNSSD change, not
      # the whole tree: the rest is byte-identical to what the build-and-test
      # legs already build. The three discovery nodes are built and not run
      # here; their Docker scenarios need container images this job does not
      # build.
      - name: Build DNS targets
        run: |
          cmake --build build -j$(nproc) --target \
            dns_peer_discovery_unit_test \
            dns_peer_discovery_chaos_test \
            dns_discovery_bind_integration_test \
            acme_certificate_provider_test \
            acme_identifier_type_test \
            acme_test_server_unit_test \
            poco_peer_discovery_unit_test \
            dns_discovery_node \
            dns_sd_discovery_node \
            poco_discovery_node

      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — dns-discovery-build"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      # --no-tests=error, not a bare ctest: an empty selection is the exact
      # failure this job exists to catch, and ctest exits 0 on one by default.
      # The BIND fixture's start/stop tests join the run on their own because
      # dns_discovery_bind_integration_test requires that fixture.
      - name: Run DNS tests
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error --timeout 900 \
            -R '^(dns_peer_discovery_unit_test|dns_peer_discovery_chaos_test|dns_discovery_bind_integration_test|acme_certificate_provider_test|acme_identifier_type_test|acme_test_server_unit_test|poco_peer_discovery_unit_test)$'

      - name: Upload BIND fixture log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dns-test-server-log
          path: build/tests/dns-test-server/named.log
          if-no-files-found: ignore

  # ── No Folly (CONFIG_FOLLY=n) ────────────────────────────────────────────────
  # .kiro/specs/ci-build-matrix-coverage/ Requirement 2. Kconfig documents
  # CONFIG_FOLLY=n as supported, and no other job builds it: every other job
  # has Folly in its prefix, so a stray `#include <folly/...>` or Folly link in
  # backend-independent code compiles everywhere and only breaks a user's
  # Folly-free build.
  #
  # Hiding Folly from find_package() is not enough, because vcpkg puts every
  # port's headers in one include/ directory. scripts/make-folly-free-prefix.sh
  # makes a hard-linked copy of the vcpkg tree with Folly and every port that
  # depends on it deleted, and this job configures against that copy only.
  # The restored vcpkg_installed/ itself is never modified.
  #
  # The vcpkg tree is the edhoc tree under the same actions/cache key the x64
  # g++-13/clang++-18 build-and-test legs use, so it restores warm and vcpkg
  # never runs here. clang++-18 is the fastest compiler this workflow builds
  # with (see the Configure (Release) comment in build-and-test).
  no-folly:
    name: No Folly (clang++-18, x64)
    runs-on: ubuntu-24.04
    # One full build and test run, the same work as a build-and-test leg.
    # Measured on main: 12.8 min with a warm sccache (run 37567880231) and
    # 63.8 min after a change to widely included headers (run 37584489048).
    timeout-minutes: 180
    # The read-write build-cache key is an environment secret of
    # build-cache-write, whose deployment branches are main only, so a
    # job on any other ref never receives it and cannot poison the cache
    # main builds from. Other refs run with no environment and fall back
    # to the read-only key. See doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          # autoconf & co. are for vcpkg's gperf port, needed only on a cold
          # vcpkg cache; see the build-and-test job.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev \
                 autoconf autoconf-archive automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect
      # (cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag without it).
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # Only reached on a cold vcpkg cache: the edhoc feature builds the
      # lakers overlay port from Rust source.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. See
      # .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      # Byte-identical to the x64 build-and-test legs' key (they set no
      # vcpkg_cxx), so this job shares their tree rather than keeping another
      # copy of it.
      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action; see
          # the build-and-test job for why it is not re-exported here, and
          # why vcpkg is pinned to vcpkg.json's builtin-baseline.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      # Requirement 2.2. Reads vcpkg_installed/vcpkg/status rather than
      # running vcpkg, which a warm cache hit never bootstraps.
      - name: Make the Folly-free prefix
        run: |
          scripts/make-folly-free-prefix.sh vcpkg_installed \
            ${{ steps.triplet.outputs.value }} "$RUNNER_TEMP/no-folly-prefix"

      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # Strict (Requirement 2.1): every symbol ci_no_folly_defconfig leaves on
      # must find its dependency in the pruned prefix, so a dependency that
      # turns out to need Folly fails here by name.
      - name: Configure (ci_no_folly_defconfig, strict)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_no_folly_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_TEST_TIMEOUT_SCALE=4 \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/no-folly-prefix"

      # Requirement 2.4: the job must not be able to regress quietly into a
      # Folly build. folly_FOUND is a plain variable, not a cache entry, so
      # the cache-visible trace of a successful find_package(folly) is
      # folly_DIR; with CONFIG_FOLLY=n nothing should even look for it.
      - name: Assert Folly is absent from the build
        run: |
          if grep -E '^folly_DIR:' build/CMakeCache.txt | grep -v -- '-NOTFOUND$'; then
            echo "::error::find_package(folly) succeeded in a CONFIG_FOLLY=n build"
            exit 1
          fi
          if grep -nE 'libfolly|/folly/' build/build.ninja | head -5 | grep .; then
            echo "::error::build.ninja references Folly"
            exit 1
          fi

      # Requirement 2.5, before the build so a missing allowlist entry fails
      # in minutes. The reference tree is configured, never built: ctest only
      # needs its CTestTestfile.cmake files.
      - name: Check the tests CONFIG_FOLLY=n disables
        run: |
          cmake -B build-reference -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            > configure-reference.log
          scripts/check-disabled-tests.py build-reference build \
            configs/no-folly-test-allowlist.txt
          rm -rf build-reference

      # Every target the configuration enables (Requirement 2.3).
      - name: Build
        run: cmake --build build -j$(nproc)

      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — no-folly"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      # Same selection, retries and ceiling as build-and-test's Test step; see
      # its comments for why each flag is there.
      - name: Test
        id: test
        run: |
          set -o pipefail
          ctest --test-dir build \
            -j$(nproc) \
            --output-on-failure \
            --repeat until-pass:3 \
            --no-tests=error \
            --timeout 900 \
            -LE '^(slow|performance|verbose|benchmark|docker)$' \
            2>&1 | tee ctest-out.txt
        continue-on-error: true

      # Same retry policy as build-and-test's check (known flakes in
      # .github/ctest-retry-allowlist.txt, strict under CTEST_STRICT_RETRIES).
      # The floor is the 388 tests the first green run registered, less a
      # small margin; 160 more are on configs/no-folly-test-allowlist.txt.
      - name: Check the test run did the work
        if: always()
        run: |
          scripts/check-test-run.sh \
            --build-dir build \
            --log ctest-out.txt \
            --floor 380 \
            ${{ vars.CTEST_STRICT_RETRIES == 'true' && '--strict-retries' || '' }} \
            --allow-retry-file .github/ctest-retry-allowlist.txt \
            -- -LE '^(slow|performance|verbose|benchmark|docker)$'

  # ── Static analysis (clang-tidy) ────────────────────────────────────────────
  # .kiro/specs/ci-build-matrix-coverage/ Requirement 3: the `static-analysis`
  # target over the whole tree (src/, tests/, examples/, cmd/), against a
  # ci_full_defconfig compilation database, failing on any finding
  # (.clang-tidy sets WarningsAsErrors: "*"). The clang-tidy major version
  # matches the one named at the top of .clang-tidy.
  #
  # Sharded, not diff-scoped: one full run is about 2.5 hours on a 4-core
  # runner (9111 s measured 2026-10-06), and a change to a widely included
  # header reaches most translation units anyway, so a diff-scoped pull
  # request run would often be a full run. Six shards take 27-40 minutes
  # each; every event, pull request or main push, analyses the full tree.
  # KYTHIRA_TIDY_SHARD_COUNT/INDEX split the sorted file list round robin.
  #
  # No compile of project code is needed: clang-tidy only parses.
  # scripts/build-tidy-prerequisites.sh builds what the compile commands
  # include but configure does not write (protoc output and the test PCH),
  # so no finding is an artefact of a missing header (Requirement 3.2).
  static-analysis:
    name: clang-tidy (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-24.04
    # Slowest measured shard: 40 minutes, plus about 3 minutes of setup on a
    # warm vcpkg cache. On main the six shards took 21-45 min (runs
    # 37567880231 and 37584489048); clang-tidy only parses, so sccache does
    # not change this and there is no separate cold figure.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    # Same build-cache environment rule as every other job; see build-and-test.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          # autoconf & co. are for vcpkg's gperf port, needed only on a cold
          # vcpkg cache; see the build-and-test job.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 clang-tidy-18 cmake ninja-build libfiu-dev \
                 autoconf autoconf-archive automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect
      # (cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag without it).
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # Only reached on a cold vcpkg cache: the edhoc feature builds the
      # lakers overlay port from Rust source.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. See
      # .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      # Byte-identical to the x64 build-and-test legs' key (they set no
      # vcpkg_cxx), so this job shares their tree rather than keeping another
      # copy of it.
      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action; see
          # the build-and-test job for why it is not re-exported here, and
          # why vcpkg is pinned to vcpkg.json's builtin-baseline.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # Same flags as the clang++-18 build-and-test leg, so the PCH build hits
      # that leg's sccache entries.
      - name: Configure (ci_full_defconfig, strict)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_TEST_TIMEOUT_SCALE=4 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DKYTHIRA_TIDY_SHARD_COUNT=6 \
            -DKYTHIRA_TIDY_SHARD_INDEX=${{ matrix.shard }}
          echo "This shard analyses $(wc -l < build/tidy-sources.txt) files."

      - name: Build generated sources and precompiled headers
        run: scripts/build-tidy-prerequisites.sh build

      - name: static-analysis
        run: cmake --build build --target static-analysis

  # ── Coverage (clang only) ────────────────────────────────────────────────────
  # ENABLE_COVERAGE uses LLVM source-based instrumentation and requires clang.
  # gcovr-based coverage with GCC is not supported by this project's CMakeLists.
  coverage:
    permissions:
      contents: read
      checks: write         # dorny/test-reporter posts inline results
      pull-requests: write  # sticky coverage comment on the PR
    name: Coverage (clang++-18)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # See build-and-test's identical env block above — ccache >=4.0 defaults
    # to ~/.cache/ccache, not ~/.ccache, so without this the Restore/Save
    # ccache steps below never see what ccache actually wrote.

    # The read-write build-cache key is an environment secret of
    # build-cache-write, whose deployment branches are main only, so a
    # job on any other ref never receives it and cannot poison the cache
    # main builds from. Other refs run with no environment and fall back
    # to the read-only key. See doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Debug + LLVM source-based coverage instrumentation (-g, no
      # optimization, -fprofile-instr-generate/-fcoverage-mapping) produces
      # much larger statically-linked test binaries than the Release build
      # in build-and-test — with ~700 test targets each statically linking
      # Folly/Boost/OpenSSL/the AWS SDK, the runner's default ~14 GB free
      # disk was no longer enough (certificate-authority added roughly 15
      # more such binaries) and the build failed with "No space left on
      # device". The previous prune list (dotnet/android/ghc/CodeQL) already
      # reclaimed some space but coap-transport-security's additional binaries
      # ate back into it and the build started intermittently hitting the
      # same "No space left on device" link failure again — widen the prune
      # list (JVM, Az CLI, PowerShell, GHC's second install location, the
      # runner's swapfile, and apt's package cache) before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/lib/jvm /opt/az /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo apt-get clean || true
          df -h /

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          # autoconf/autoconf-archive/automake/libtool: see the identical
          # addition in build-and-test's own "Install system dependencies"
          # step above for why (vcpkg's gperf port, a host-tool dependency
          # of proxygen, needs them from the system package manager).
          # Bounded and retried, like every other install step. This one had
          # neither, and hung for its full 3-hour job budget without ever
          # reaching a compiler.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
               && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 \
                 llvm-18 \
                 cmake \
                 ninja-build \
                 libfiu-dev \
                 ccache \
                 autoconf \
                 autoconf-archive \
                 automake \
                 libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed or timed out (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect
      # (cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag without it).
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # Required to build the lakers (EDHOC) overlay port's ffi/ crate from
      # source (vcpkg's "edhoc" feature below) — see the identical step in
      # build-and-test for why this is pinned explicitly.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. The writer policy -- only a
      # push to main gets the read-write key -- lives in that action and
      # nowhere else. See .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: x64-linux
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          # This job stays x86_64-only (Requirement 8.2), so runner.arch is
          # always X64 here — included anyway to keep the key format
          # consistent with build-and-test's cache key (Requirement 4).
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action as
          # x-aws against the bucket. Re-exporting it here would override that,
          # and x-gha is a backend vcpkg removed some time ago -- which is why
          # these jobs had no binary cache at all until this change.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          # Pin the vcpkg tool + scripts + registry to vcpkg.json's
          # builtin-baseline instead of a moving HEAD. This CI bootstraps
          # vcpkg by cloning microsoft/vcpkg at HEAD, but pins port
          # *versions* via vcpkg.json's builtin-baseline -- so the tool and
          # scripts are a moving target while the versions are fixed. On a
          # warm binary cache this is invisible; on any cold build (cache
          # miss, for any reason -- a dependency change, cache eviction, or
          # just this being the first build for a given runner arch) it
          # picks up whatever vcpkg-tool HEAD is that day. Observed directly
          # on this branch (which touches no vcpkg.json dependency at all):
          # an upstream vcpkg-tool regression's SBOM script
          # (scripts/cmake/z_vcpkg_spdx.cmake) called a string(JSON ...
          # STRING_ENCODE) mode the bundled cmake rejects, failing every
          # port build ("building zlib:arm64-linux failed with:
          # BUILD_FAILED"). Pinning to the same commit the manifest's
          # version constraints already resolve against keeps the tool,
          # scripts, and resolved versions consistent and cold builds
          # reproducible regardless of upstream HEAD churn.
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux

      # ── Coverage build + tests ────────────────────────────────────────────
      # sccache, not ccache: its objects live in the OCI bucket, so they
      # survive the runner being destroyed. The script decides whether this
      # job may use it by compiling a five-byte file through it, because no
      # sccache exit status distinguishes a healthy server that is already
      # listening from one whose storage backend is unreachable -- see its
      # header for the measured table, and Task 9 for the red build that is
      # what happens when a job trusts the exit status instead.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      - name: Configure (Coverage)
        run: |
          # -DENABLE_COVERAGE=ON on the command line wins over the defconfig's
          # CONFIG_COVERAGE=n (the root CMakeLists.txt documents the
          # precedence at its KCONFIG_COVERAGE block), so the explicit
          # feature set and coverage instrumentation compose.
          cmake -B build-coverage -G Ninja \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_TEST_TIMEOUT_SCALE=4 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/x64-linux

      - name: Build (Coverage)
        run: cmake --build build-coverage -j$(nproc)

      # The numbers Requirement 5.5 wants in the job summary, and the ones
      # Requirement 6 is checked against. `always()` so a failed build still
      # reports what it cached: a leg with 0 cacheable requests is a finding.
      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — coverage"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      - name: Test (Coverage)
        id: test-coverage
        run: |
          set -o pipefail
          find build-coverage -name '*.profraw' -delete
          LLVM_PROFILE_FILE='${{ github.workspace }}/build-coverage/%p-%m.profraw' \
          ctest --test-dir build-coverage \
            -j$(nproc) \
            --output-on-failure \
            --output-junit ${{ github.workspace }}/coverage-test-results.xml \
            --repeat until-pass:3 \
            --no-tests=error \
            --timeout 1800 \
            -LE '^(slow|performance|verbose|benchmark|docker)$' \
            2>&1 | tee ctest-coverage-out.txt
        continue-on-error: true

      # The coverage percentage is only meaningful if the tests behind it ran.
      # A silently shrinking test set lowers coverage without any job turning
      # red, which reads as a code regression rather than a CI one.
      - name: Check the coverage test run did the work
        if: always()
        run: |
          scripts/check-test-run.sh \
            --build-dir build-coverage \
            --log ctest-coverage-out.txt \
            --floor 395 \
            ${{ vars.CTEST_STRICT_RETRIES == 'true' && '--strict-retries' || '' }} \
            --allow-retry-file .github/ctest-retry-allowlist.txt \
            -- -LE '^(slow|performance|verbose|benchmark|docker)$'

      - name: Publish coverage test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: always()
        with:
          name: Coverage Tests
          path: coverage-test-results.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload coverage test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-test-results
          path: coverage-test-results.xml

      - name: Fail if coverage tests failed
        if: steps.test-coverage.outcome == 'failure'
        run: exit 1

      # ── Measure coverage and enforce floor ────────────────────────────────
      - name: Measure coverage
        id: coverage
        run: |
          # Merge per-process profiles into a single profdata file.
          mapfile -t PROFRAW < <(find build-coverage -name '*.profraw')
          llvm-profdata-18 merge -sparse "${PROFRAW[@]}" \
            -o build-coverage/merged.profdata

          # Collect instrumented test binaries (no extension = executable).
          mapfile -t BINS < <(find build-coverage/tests -maxdepth 1 \
            -executable -type f | sort)
          MAIN_BIN="${BINS[0]}"
          EXTRA_ARGS=()
          for b in "${BINS[@]:1}"; do EXTRA_ARGS+=(-object "$b"); done

          IGNORE=(
            --ignore-filename-regex='.*/build-coverage/.*'
            --ignore-filename-regex='.*/vcpkg_installed/.*'
            --ignore-filename-regex='.*/usr/.*'
            --ignore-filename-regex='.*/cmd/.*'
            --ignore-filename-regex='.*/tests/docker_chaos/.*'
            --ignore-filename-regex='.*/tests/aws_quorum_manager_localstack_test.*'
            --ignore-filename-regex='.*/tests/aws_quorum_manager_real_ec2_test.*'
            --ignore-filename-regex='.*/tests/ca_cluster_node_real_ec2_test.*'
            --ignore-filename-regex='.*/tests/ca_cluster_node_rpc_tls_real_ec2_test.*'
            --ignore-filename-regex='.*/tests/aws_real_ec2_test_support.*'
            --ignore-filename-regex='.*/tests/future_backend_benchmark_test.*'
            --ignore-filename-regex='.*/tests/multi_raft_http_benchmark_test.*'
            --ignore-filename-regex='.*/tests/multi_raft_kv_workload.*'
            --ignore-filename-regex='.*/tests/multi_raft_transport_harness.*'
            --ignore-filename-regex='.*/examples/.*'
          )

          # Coverage summary. The ratchet below reads col 7 of the TOTAL row,
          # which is *function* coverage; line coverage is col 10.
          llvm-cov-18 report \
            --instr-profile=build-coverage/merged.profdata \
            "$MAIN_BIN" "${EXTRA_ARGS[@]}" \
            "${IGNORE[@]}" | tee build-coverage/coverage-summary.txt

          # HTML report.
          mkdir -p ${{ github.workspace }}/coverage-html
          llvm-cov-18 show \
            --instr-profile=build-coverage/merged.profdata \
            "$MAIN_BIN" "${EXTRA_ARGS[@]}" \
            --format=html \
            --output-dir=${{ github.workspace }}/coverage-html \
            "${IGNORE[@]}"

          # Parse coverage percentage from the TOTAL row.
          # llvm-cov report columns: Filename Regions Miss Cover% Functions Miss Cover% Lines Miss Cover% ...
          # $7 is the function-coverage % — the same field the pre-commit hook gates on.
          NEW_PCT=$(awk '/^TOTAL/ { gsub(/%/, "", $7); print $7; exit }' \
            build-coverage/coverage-summary.txt)
          OLD_FLOOR=$(cat ${{ github.workspace }}/coverage_floor.txt)

          echo "Coverage: ${NEW_PCT}%  Floor: ${OLD_FLOOR}%"
          echo "coverage_pct=${NEW_PCT}" >> "$GITHUB_OUTPUT"

          # The tolerance absorbs run-to-run noise in CI's own measurement
          # (scheduling, test retries, coverage counters) — see commit 089927a
          # and the 88.10%-vs-88.16% failure it left behind. It is NOT there to
          # absorb a systematic gap between a dev machine's figure and this
          # one: coverage_floor.txt is now set only from a green run of this
          # job, so the two numbers are measured the same way and the band is
          # free to do the job it was added for. scripts/pre-commit-coverage.sh
          # gates against the floor locally but no longer raises it; when this
          # job reports a durable improvement, update the file by hand.
          TOLERANCE=0.50
          awk -v new="${NEW_PCT}" -v old="${OLD_FLOOR}" -v tol="${TOLERANCE}" \
            'BEGIN { if (new+0 < old+0-tol) {
              printf "FAILED: %.2f%% is below floor %.2f%% (tolerance %.2f%%)\n", new, old, tol; exit 1 } }'

      - name: Write coverage job summary
        if: always() && steps.coverage.outputs.coverage_pct != ''
        run: |
          PCT="${{ steps.coverage.outputs.coverage_pct }}"
          FLOOR=$(cat ${{ github.workspace }}/coverage_floor.txt)
          if awk "BEGIN { exit !($PCT >= 85) }"; then
            ICON="🟢"
          elif awk "BEGIN { exit !($PCT >= 70) }"; then
            ICON="🟡"
          else
            ICON="🔴"
          fi
          {
            echo "## ${ICON} Coverage Report"
            echo ""
            echo "| | Value |"
            echo "|---|---|"
            echo "| **Function coverage** | **${PCT}%** |"
            echo "| Floor | ${FLOOR}% |"
            echo ""
            echo "<details><summary>Full llvm-cov summary</summary>"
            echo ""
            echo '```'
            cat build-coverage/coverage-summary.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage PR comment
        if: github.event_name == 'pull_request' && steps.coverage.outputs.coverage_pct != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pct  = '${{ steps.coverage.outputs.coverage_pct }}';
            const floor = require('fs').readFileSync('${{ github.workspace }}/coverage_floor.txt', 'utf8').trim();
            const icon  = parseFloat(pct) >= 85 ? '🟢' : parseFloat(pct) >= 70 ? '🟡' : '🔴';
            const body  = `## ${icon} Coverage Report\n\n| | Value |\n|---|---|\n| **Function coverage** | **${pct}%** |\n| Floor | ${floor}% |`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('Coverage Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage-html/
          # One run's report is ~5 MB and is only looked at while its PR is
          # open; at the 90-day default, 456 copies once held 97% of the
          # repo's artifact storage.
          retention-days: 7

  # ── ThreadSanitizer (Beast + Proxygen concurrency suites) ───────────────────
  # Both .kiro/specs/boost-beast-http-transport/ and
  # .kiro/specs/proxygen-http-transport/'s own tasks.md flagged the same
  # final open follow-up: their concurrency-safety claims (Property 6/
  # Requirement 3.5's structural per-connection serialization, in
  # particular) had only ever been exercised under ad hoc, uncommitted
  # `-fsanitize=address` runs during development (doc/CHANGELOG.md's July
  # 28, 2026 entry), never a registered, repeatable CI build. This is
  # that — the first ThreadSanitizer-instrumented CI job for any transport
  # in this project, via KYTHIRA_SANITIZER=thread (root CMakeLists.txt,
  # this project's first sanitizer-support CMake option). Single leg
  # (g++-13/x64, matching this project's own prior documented ad hoc ASan
  # runs' compiler choice) — the point is instrumented coverage of this
  # project's own concurrency-sensitive code, not compiler/arch matrix
  # breadth the way build-and-test's own matrix is for. The Beast side of
  # this job builds/runs the one-file-per-concern
  # beast_client_test/beast_server_test/beast_integration_test/beast_ssl_test/
  # beast_cross_transport_equivalence_test targets (tests/beast_transport_test.cpp
  # was split into these; see .kiro/specs/boost-beast-http-transport/tasks.md's
  # Known Follow-ups for the round-2 bugs a per-binary TSan pass against this
  # split found beyond what the original monolithic binary surfaced).
  tsan:
    permissions:
      contents: read
      checks: write         # dorny/test-reporter posts inline results
    name: ThreadSanitizer (Beast + Proxygen concurrency suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    # The read-write build-cache key is an environment secret of
    # build-cache-write, whose deployment branches are main only, so a
    # job on any other ref never receives it and cannot poison the cache
    # main builds from. Other refs run with no environment and fall back
    # to the read-only key. See doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 g++-13 \
                 cmake \
                 ninja-build \
                 libfiu-dev \
                 ccache \
                 autoconf \
                 autoconf-archive \
                 automake \
                 libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect
      # (cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag without it).
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. The writer policy -- only a
      # push to main gets the read-write key -- lives in that action and
      # nowhere else. See .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: x64-linux
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-X64-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action as
          # x-aws against the bucket. Re-exporting it here would override that,
          # and x-gha is a backend vcpkg removed some time ago -- which is why
          # these jobs had no binary cache at all until this change.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          # Pin the vcpkg tool + scripts + registry to vcpkg.json's
          # builtin-baseline instead of a moving HEAD. This CI bootstraps
          # vcpkg by cloning microsoft/vcpkg at HEAD, but pins port
          # *versions* via vcpkg.json's builtin-baseline -- so the tool and
          # scripts are a moving target while the versions are fixed. On a
          # warm binary cache this is invisible; on any cold build (cache
          # miss, for any reason -- a dependency change, cache eviction, or
          # just this being the first build for a given runner arch) it
          # picks up whatever vcpkg-tool HEAD is that day. Observed directly
          # on this branch (which touches no vcpkg.json dependency at all):
          # an upstream vcpkg-tool regression's SBOM script
          # (scripts/cmake/z_vcpkg_spdx.cmake) called a string(JSON ...
          # STRING_ENCODE) mode the bundled cmake rejects, failing every
          # port build ("building zlib:arm64-linux failed with:
          # BUILD_FAILED"). Pinning to the same commit the manifest's
          # version constraints already resolve against keeps the tool,
          # scripts, and resolved versions consistent and cold builds
          # reproducible regardless of upstream HEAD churn.
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux

      # sccache, not ccache: its objects live in the OCI bucket, so they
      # survive the runner being destroyed. The script decides whether this
      # job may use it by compiling a five-byte file through it, because no
      # sccache exit status distinguishes a healthy server that is already
      # listening from one whose storage backend is unreachable -- see its
      # header for the measured table, and Task 9 for the red build that is
      # what happens when a job trusts the exit status instead.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      - name: Configure (ThreadSanitizer)
        run: |
          cmake -B build-tsan -G Ninja \
            -DKYTHIRA_SANITIZER=thread \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/x64-linux

      - name: Assert ThreadSanitizer was requested
        run: |
          cached=$(grep -E '^KYTHIRA_SANITIZER:' build-tsan/CMakeCache.txt | cut -d= -f2)
          if [ "$cached" != "thread" ]; then
            echo "::error::KYTHIRA_SANITIZER is '$cached', expected 'thread'"
            exit 1
          fi
          echo "confirmed: KYTHIRA_SANITIZER=$cached"

      # three_way_http_transport_equivalence_test was previously excluded from
      # this job after it reproduced an identical early SIGSEGV (~2.1s in, zero
      # output -- crashing before Boost.Test's crash handler was installed) on
      # two separate real runs. Root cause: it was the only Folly-touching
      # Boost.Test binary in the suite that never called folly::init(), so
      # Folly's registration-gated singletons (folly::Timekeeper, reached via
      # future timeouts) could be touched before registrationComplete() ran.
      # As the only binary combining the Beast (boost::asio) and Proxygen
      # (Folly) transports, its thread interleavings differ from the sibling
      # beast_*/proxygen suites, and TSan's perturbed ordering turned that
      # latent abort into the output-less crash. Fixed by installing the same
      # FollyInitFixture the ~118 other Folly tests use; re-enabled here so this
      # job verifies it stays fixed.
      - name: Build (ThreadSanitizer)
        run: |
          cmake --build build-tsan -j$(nproc) \
            --target beast_client_test \
            --target beast_server_test \
            --target beast_integration_test \
            --target beast_ssl_test \
            --target beast_cross_transport_equivalence_test \
            --target proxygen_transport_test \
            --target three_way_http_transport_equivalence_test \
            --target tcp_connection_tracker_unit_test \
            --target tcp_rpc_unit_test \
            --target tls_tcp_rpc_integration_test \
            --target tcp_gossip_transport_integration_test

      # Asserts the flag was honoured, not merely passed. A TSan job that
      # quietly builds uninstrumented binaries still runs every test and still
      # reports green -- it just stops detecting races, which is the only
      # reason this job exists. The cache variable checked after configure
      # records intent; __tsan_init records what the compiler actually
      # emitted, so this is the assertion that can't be satisfied by a
      # well-formed but ineffective build.
      - name: Assert the binaries really are ThreadSanitizer-instrumented
        run: |
          uninstrumented=0
          for t in beast_client_test beast_server_test beast_integration_test \
                   beast_ssl_test beast_cross_transport_equivalence_test \
                   proxygen_transport_test three_way_http_transport_equivalence_test \
                   tcp_connection_tracker_unit_test tcp_rpc_unit_test \
                   tls_tcp_rpc_integration_test tcp_gossip_transport_integration_test; do
            bin="build-tsan/tests/$t"
            if [ ! -x "$bin" ]; then
              echo "::error::$t was not built"
              uninstrumented=1
              continue
            fi
            # Two accepted signals so this can't false-fail on a link-mode
            # change: an undefined __tsan_init against the default shared
            # libtsan, or a direct libtsan dependency.
            if ! { nm -D "$bin" 2>/dev/null | grep -q __tsan_init; } \
               && ! { ldd "$bin" 2>/dev/null | grep -q libtsan; }; then
              echo "::error::$t references neither __tsan_init nor libtsan — it is not ThreadSanitizer-instrumented"
              uninstrumented=1
            fi
          done
          if [ "$uninstrumented" -ne 0 ]; then exit 1; fi
          echo "confirmed: all 11 targets are ThreadSanitizer-instrumented"

      # The numbers Requirement 5.5 wants in the job summary, and the ones
      # Requirement 6 is checked against. `always()` so a failed build still
      # reports what it cached: a leg with 0 cacheable requests is a finding.
      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — tsan"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      - name: Test under ThreadSanitizer
        id: test-tsan
        env:
          # second_deadlock_stack: the more useful of the two stacks TSan
          # prints for a lock-order-inversion report. halt_on_error left at
          # its default (0) so one finding doesn't hide any others in the
          # same run. suppressions: see tests/tsan_suppressions.txt for why
          # folly::/wangle:: races are excluded.
          TSAN_OPTIONS: "second_deadlock_stack=1 suppressions=${{ github.workspace }}/tests/tsan_suppressions.txt"
        run: |
          set -o pipefail
          ctest --test-dir build-tsan \
            -R 'beast_client_test|beast_server_test|beast_integration_test|beast_ssl_test|beast_cross_transport_equivalence_test|proxygen_transport_test|three_way_http_transport_equivalence_test|tcp_connection_tracker_unit_test|^tcp_rpc_unit_test$|tls_tcp_rpc_integration_test|tcp_gossip_transport_integration_test' \
            --output-on-failure \
            --no-tests=error \
            --timeout 1800 \
            --output-junit ${{ github.workspace }}/tsan-test-results.xml \
            2>&1 | tee ctest-tsan-out.txt
        continue-on-error: true

      # This job's `-R` is an explicit list of eleven target names, which is the
      # shape most prone to silent decay: rename or drop any one of them and
      # ctest matches ten, runs ten, and still exits 0.
      #
      # This comment used to claim that deriving the expectation from `ctest -N`
      # made that mismatch fail loudly. It does not, and the claim was the
      # dangerous part: `ctest -N` applies the same `-R` to the same registry,
      # so it also answers ten, the derived expectation becomes ten, ten run,
      # and the check passes. The protection being relied on did not exist.
      #
      # `--floor 11` is what actually holds the list to its length, because 11 is
      # written here rather than read from the build. Adding a target to the
      # `-R` list means raising it in the same edit.
      - name: Check the ThreadSanitizer run did the work
        if: always()
        run: |
          scripts/check-test-run.sh \
            --build-dir build-tsan \
            --log ctest-tsan-out.txt \
            --floor 11 \
            ${{ vars.CTEST_STRICT_RETRIES == 'true' && '--strict-retries' || '' }} \
            --allow-retry-file .github/ctest-retry-allowlist.txt \
            -- -R 'beast_client_test|beast_server_test|beast_integration_test|beast_ssl_test|beast_cross_transport_equivalence_test|proxygen_transport_test|three_way_http_transport_equivalence_test|tcp_connection_tracker_unit_test|^tcp_rpc_unit_test$|tls_tcp_rpc_integration_test|tcp_gossip_transport_integration_test'

      - name: Publish ThreadSanitizer test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: always()
        with:
          name: ThreadSanitizer Tests
          path: tsan-test-results.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload ThreadSanitizer test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tsan-test-results
          path: tsan-test-results.xml

      - name: Fail if ThreadSanitizer found anything
        if: steps.test-tsan.outcome == 'failure'
        run: exit 1

  # ── Future-backend compatibility (whole suite across all 3 backends) ────────
  # Originally proxygen-only (Requirement 19.3, below); boost-beast was added
  # after every beast_* target turned out to be broken under both non-folly
  # backends precisely because nothing here built them. It now builds and runs
  # the *whole* suite, because that argument never applied only to Beast:
  # `future_default<T>` resolves through KYTHIRA_DEFAULT_FUTURE_BACKEND in 118
  # of the 390 files under tests/, and while this job was HTTP-only, 113 of
  # them — every raft_*, every coap_*, the learner/membership/peer2peer
  # suites — had never executed under stdexec or boost even once. Beast was
  # not special; it was just the cell somebody happened to land on. Running
  # the full suite is also the only version of this that stays correct on its
  # own: any hand-listed set of targets silently stops covering tests added
  # after it was written, which is the same "reports success while doing
  # nothing" failure this file's other assertions exist to prevent.
  # proxygen_client/server's generic bridge (Requirement 14) is designed to
  # work under any KYTHIRA_DEFAULT_FUTURE_BACKEND, with the Folly-native
  # fast path (Requirement 16) layered on top only when that backend is
  # Folly specifically — but until now, this project's CI only ever built
  # under the default (folly) backend, so the "generic bridge is used
  # instead under stdexec/boost" direction of Requirement 19.3 was written
  # to be correct (tests/proxygen_transport_test.cpp's
  # folly_fast_path_is_taken/generic_bridge_forced_matches_fast_path_result
  # compute their expectation from Types's own future_template member
  # rather than hardcoding "folly_fast_path") but never actually confirmed
  # under a real stdexec/boost build. `stdexec`/`boost-thread` are already
  # unconditional (non-feature-gated) vcpkg.json dependencies, so this
  # reuses the same vcpkg_installed cache build-and-test's own jobs already
  # populate — no new vcpkg install, just a different
  # -DKYTHIRA_DEFAULT_FUTURE_BACKEND configure flag.
  future-backend-compat:
    name: Full suite (${{ matrix.backend }} future backend)
    runs-on: ubuntu-24.04
    # Was 180 ("matches build-and-test's budget"), and that stopped being
    # enough. The stdexec leg is materially heavier than a Build & Test leg,
    # and pooling the heavy TUs (17c720a, df8dbdf) traded wall time for the
    # memory headroom it needed: measured on real runs, stdexec took 2h01m on
    # PR #314 and 2h00m on PR #315 -- both of which ran *before* those pooling
    # commits landed -- and 172 minutes on main immediately after them. That is
    # 96% of a 180-minute budget, and it is main's own steady state, not an
    # outlier.
    #
    # Eight minutes of headroom is not a budget, it is a coin flip. Any PR that
    # adds cost on top -- most obviously one touching vcpkg.json or
    # vcpkg-overlays/**, which changes the vcpkg cache key and forces a cold
    # dependency build -- goes over. PR #316 did exactly that and timed out
    # three times in Build, never reaching a single test.
    #
    # 300 matches the GCC 14 leg's budget and is sized for the genuinely bad
    # case: cold vcpkg *and* a cold compiler cache. Measured on run
    # 33997439418, the leg this budget was raised for: 95 minutes installing
    # dependencies, 114 building, 8 testing -- 218 minutes, which 180 kills
    # and 300 does not.
    #
    # Re-measured September 10, 2026, after the OCI build cache landed, and
    # HALF THE SENTENCE ABOVE USED TO BE WRONG. It read "cold ccache ... is
    # the normal state on a branch that touches dependencies, since ccache
    # keys are scoped per ref". This job has no ccache Restore/Save steps any
    # more: its compiler cache is sccache against the OCI bucket, keyed by the
    # compilation and not by the ref, so a branch does not start cold. The
    # first run of a brand-new ref (PR #331, run 34416241108) built in 3
    # minutes. Five consecutive main runs since both caches went live finish
    # the whole leg in 12-13 minutes.
    #
    # 300 is kept anyway, and the reason is narrower than it was. The 218
    # minute case is still reachable -- it needs a change that actually misses
    # the vcpkg *binary* cache (a real dependency bump, not merely a new ref)
    # together with header churn that misses sccache -- but it is no longer
    # what an ordinary branch does. A ceiling costs nothing when unused. What
    # it does cost is the window a wedged job burns before it is killed, which
    # is now ~23x the normal run time; if that becomes the failing mode worth
    # optimising, lower this, do not lower it to reclaim minutes that warm
    # runs were never spending.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        backend: [stdexec, boost]

    # The read-write build-cache key is an environment secret of
    # build-cache-write, whose deployment branches are main only, so a
    # job on any other ref never receives it and cannot poison the cache
    # main builds from. Other refs run with no environment and fall back
    # to the read-only key. See doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 g++-13 \
                 cmake \
                 ninja-build \
                 libfiu-dev \
                 ccache \
                 autoconf \
                 autoconf-archive \
                 automake \
                 libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # kconfiglib, so the -DKYTHIRA_KCONFIG= below actually takes effect
      # (cmake/Kconfig.cmake FATAL_ERRORs on the explicit flag without it).
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Exports the environment vcpkg's x-aws backend and sccache's s3 backend
      # both read, and installs the pinned sccache. The writer policy -- only a
      # push to main gets the read-write key -- lives in that action and
      # nowhere else. See .kiro/specs/oci-build-cache/ and doc/ci_build_cache.md.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: x64-linux
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-X64-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          # VCPKG_BINARY_SOURCES arrives from the OCI build cache action as
          # x-aws against the bucket. Re-exporting it here would override that,
          # and x-gha is a backend vcpkg removed some time ago -- which is why
          # these jobs had no binary cache at all until this change.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          # Pin the vcpkg tool + scripts + registry to vcpkg.json's
          # builtin-baseline instead of a moving HEAD. This CI bootstraps
          # vcpkg by cloning microsoft/vcpkg at HEAD, but pins port
          # *versions* via vcpkg.json's builtin-baseline -- so the tool and
          # scripts are a moving target while the versions are fixed. On a
          # warm binary cache this is invisible; on any cold build (cache
          # miss, for any reason -- a dependency change, cache eviction, or
          # just this being the first build for a given runner arch) it
          # picks up whatever vcpkg-tool HEAD is that day. Observed directly
          # on this branch (which touches no vcpkg.json dependency at all):
          # an upstream vcpkg-tool regression's SBOM script
          # (scripts/cmake/z_vcpkg_spdx.cmake) called a string(JSON ...
          # STRING_ENCODE) mode the bundled cmake rejects, failing every
          # port build ("building zlib:arm64-linux failed with:
          # BUILD_FAILED"). Pinning to the same commit the manifest's
          # version constraints already resolve against keeps the tool,
          # scripts, and resolved versions consistent and cold builds
          # reproducible regardless of upstream HEAD churn.
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux

      # sccache, not ccache: its objects live in the OCI bucket, so they
      # survive the runner being destroyed. The script decides whether this
      # job may use it by compiling a five-byte file through it, because no
      # sccache exit status distinguishes a healthy server that is already
      # listening from one whose storage backend is unreachable -- see its
      # header for the measured table, and Task 9 for the red build that is
      # what happens when a job trusts the exit status instead.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      - name: Configure (${{ matrix.backend }} backend)
        run: |
          # KYTHIRA_TEST_TIMEOUT_SCALE=4 for the same reason build-and-test
          # sets it: the per-test budgets were implicitly sized against
          # clang++-18 Release, and this job compiles with g++-13, which runs
          # the coap suite 1.3-5.0x slower. Without it the coap tests this job
          # newly runs would fail on timeout rather than on behaviour, and
          # every one of those failures would be attributed to the backend.
          # See doc/coap-flake-investigation.md.
          cmake -B build-${{ matrix.backend }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DKYTHIRA_DEFAULT_FUTURE_BACKEND=${{ matrix.backend }} \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_TEST_TIMEOUT_SCALE=4 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/x64-linux

      # This job's entire value is that it builds under a *non-default*
      # backend. If the flag ever stopped taking effect -- a stale cache in a
      # reused build dir, a renamed option, a reordered step -- every target
      # would silently be rebuilt under the default and both matrix legs would
      # certify folly a second time while still reporting green. CMake already
      # FATAL_ERRORs on an invalid value; this asserts the valid one landed.
      - name: Assert the build really is configured for ${{ matrix.backend }}
        run: |
          actual=$(grep -E '^KYTHIRA_DEFAULT_FUTURE_BACKEND:' \
                     build-${{ matrix.backend }}/CMakeCache.txt | cut -d= -f2)
          if [ "$actual" != "${{ matrix.backend }}" ]; then
            echo "::error::this job claims to test the ${{ matrix.backend }} backend, but CMakeCache.txt says '$actual'"
            exit 1
          fi
          echo "confirmed: KYTHIRA_DEFAULT_FUTURE_BACKEND=$actual"

      # No --target list. An explicit list is what kept this job HTTP-only for
      # as long as it was: it covered exactly the targets somebody had already
      # suspected, and nothing else -- including every target added since.
      # Building the default target set means a test added tomorrow is covered
      # under all three backends without anyone remembering to add it here.
      # This job builds the DEFAULT target set (see the note above): on a cold
      # ccache that is ~1000 compile and link steps, most of them test binaries
      # statically linking Folly, Boost, OpenSSL and the AWS SDK.
      #
      # It was terminating with exit 143 and "the runner has received a shutdown
      # signal", always at the same translation unit
      # (examples/raft/proxygen_transport_example.cpp, the heaviest TU in the
      # tree under a template-heavy backend), on `main` and on PR branches
      # alike. A warm-ccache run compiled that same file in 90 s and finished
      # all 1022 steps, so the file is not inherently fatal — the trigger is how
      # much real compilation happens at once when the cache is cold.
      #
      # The reporting below is what identified the mechanism, and it ruled out
      # the obvious guess. Measured on a failing run:
      #
      #     disk:   /dev/root 145G, 91G available, 38% used
      #     memory: 15Gi total, 14Gi available, Swap 3.0Gi
      #
      # So disk is not the constraint — there is 91 GB spare — and the Coverage
      # job's "~14 GB free" premise does not hold on this runner image. Memory
      # is: 15 GiB against a build that peaks well above it, with only 3 GiB of
      # swap to absorb the spike. That the `always()` report below does NOT run
      # on a failure is itself evidence: the runner process is being killed, not
      # the build step, which is what the platform reclaiming an over-memory VM
      # looks like.
      #
      # The fix therefore spends the abundant resource on the scarce one: a
      # 24 GiB swapfile carved out of that idle disk, so the peak spills instead
      # of being killed. Note this is the exact OPPOSITE trade to the Coverage
      # job, which deletes its swapfile to buy disk — both directions are now
      # backed by measurements from the job that needed them.
      #
      # Parallelism is deliberately left at -j$(nproc). The failing runs reached
      # step 505 of 1024 in ~70 minutes, so -j2 would not fit the 180-minute
      # budget; swap buys the headroom without trading the wall clock.
      - name: Add swap headroom and report resources
        run: |
          echo "── before ──"; df -h /; free -h
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          # Prefer swapping over killing: the default of 60 is tuned for
          # interactive latency, which is not what a batch compile wants.
          sudo sysctl vm.swappiness=80
          echo "── after ──"; df -h /; free -h

      - name: Build
        # -j3 rather than -j$(nproc), on this job only.
        #
        # NOTE: this alone did NOT fix the failure it was introduced for, and
        # the arithmetic originally written here was wrong. It cited the
        # heaviest TU as 2.27 GiB (proxygen_transport_example) and concluded
        # that 4 x 2.27 overran the runner while 3 x 2.27 did not. The real
        # figure is 5.6 GiB: three_way_http_transport_equivalence_test measures
        # 5,649 MiB of compiler RSS under this backend, and there are four TUs
        # of that class. THREE of those at once already exceeds a 16 GiB
        # runner, so no realistic global -j was ever going to fix it -- the leg
        # kept failing at -j3, just by thrashing to the job timeout instead of
        # having its VM reclaimed.
        #
        # The actual fix is the heavy_tu job pool declared in the top-level
        # CMakeLists.txt, which serialises exactly the TUs of that class and
        # leaves everything else parallel. See that comment for the measured
        # numbers -- it is where the per-TU compiler-RSS table lives.
        #
        # The pool is necessary and was not sufficient on its own: it bounded
        # the four tests/ TUs it was written for, and cmd/multi_raft_node's
        # main.cpp was outside it at 10,974 MiB -- larger than any of them.
        # That TU is now split four ways and pooled too.
        #
        # -j3 is kept, and that experiment HAS NOW BEEN RUN -- do not repeat
        # it. Restoring -j$(nproc) with the job pool in place is green but
        # SLOWER, measured on this leg:
        #
        #     -j3      + pool   1 h 51 m   (baseline)
        #     -j(nproc)+ pool   2 h 09 m   (+18 min, ~16% slower)
        #     -j3      no pool  2 h 27 m / 2 h 32 m
        #
        # The fourth worker is affordable -- it no longer fails -- but it does
        # not pay. Adding parallelism making the build SLOWER is the signature
        # of residual memory pressure: the pool bounds the one 5.6 GiB compile,
        # but three other workers beside it still push the runner into some
        # swapping.
        #
        # So the pool and -j3 address different things and both earn their
        # place: the pool bounds the worst single allocation, -j3 bounds the
        # aggregate. Note also that the pool's headline speedup came from
        # ending the thrashing, not from restored parallelism.
        #
        # If a stall like this recurs and is visible only on the runner,
        # instrument rather than guess. Every local hypothesis about this leg
        # was falsified by measurement on the failing tree -- the heaviest TU
        # and the TU it stalled on both compiled fine alone, and two runs
        # stalled at the same step NUMBER on DIFFERENT translation units,
        # which is what told us the step index was incidental and the binding
        # constraint was runner-side. What settles it is sampling memory,
        # swap, disk, load and the live compiler count every 30s, plus
        # wrapping the build in `timeout` inside the job budget.
        #
        # Sample into the job LOG, never an uploaded artifact: an artifact
        # does not survive a platform timeout kill, which is how earlier
        # diagnoses of this leg were lost. A build that times out on its own
        # terms also leaves the `always()` reporting steps to run, instead of
        # being skipped by the platform killing the job.
        run: cmake --build build-${{ matrix.backend }} -j3

      # `always()`, because the interesting case is the one where Build died:
      # a near-zero figure here names the mechanism the logs above could not.
      - name: Report headroom after build
        if: always()
        run: |
          echo "── disk after build ──"; df -h /
          echo "── memory after build ──"; free -h

      # The numbers Requirement 5.5 wants in the job summary, and the ones
      # Requirement 6 is checked against. `always()` so a failed build still
      # reports what it cached: a leg with 0 cacheable requests is a finding.
      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — ${{ matrix.backend }} backend"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
      # Same selection as build-and-test's own Test step -- the whole registered
      # suite minus the label classes that job also excludes -- so this leg and
      # the folly legs differ in exactly one variable, the backend. Anything
      # that fails here and passes there is a backend defect by construction.
      #
      # `continue-on-error` + an explicit fail step at the end, rather than
      # letting ctest fail the step directly, so the check-test-run.sh step
      # below still runs and reports on a red run. It is on a red run that its
      # output matters most: it distinguishes "N tests failed" from "the job
      # ran nothing and ctest reported that as a failure".
      - name: Test (whole suite under the ${{ matrix.backend }} backend)
        id: test
        run: |
          set -o pipefail
          ctest --test-dir build-${{ matrix.backend }} \
            -j$(nproc) \
            --output-on-failure \
            --output-junit ${{ github.workspace }}/test-results-${{ matrix.backend }}.xml \
            --repeat until-pass:3 \
            --no-tests=error \
            --timeout 900 \
            -LE '^(slow|performance|verbose|benchmark|docker)$' \
            2>&1 | tee ctest-out.txt
        continue-on-error: true

      # Asserts the run did the work its exit code implies: that every
      # registered test actually executed, that the count was not zero, that
      # nothing skipped, and it reports any first-attempt failure absorbed by
      # --repeat until-pass:3 (fatal outside .github/ctest-retry-allowlist.txt
      # when the CTEST_STRICT_RETRIES repository variable is true). The
      # expected count is derived from `ctest -N` with the same filter, so it
      # follows the CMake test registry rather than a literal that goes stale.
      - name: Check the ${{ matrix.backend }} run did the work
        if: always()
        run: |
          scripts/check-test-run.sh \
            --build-dir build-${{ matrix.backend }} \
            --log ctest-out.txt \
            --floor 400 \
            ${{ vars.CTEST_STRICT_RETRIES == 'true' && '--strict-retries' || '' }} \
            --allow-retry-file .github/ctest-retry-allowlist.txt \
            -- -LE '^(slow|performance|verbose|benchmark|docker)$'

      - name: Upload ${{ matrix.backend }} test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-future-backend-${{ matrix.backend }}
          path: test-results-${{ matrix.backend }}.xml

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  # ── Packer template checks (ca_cluster_node AMI) ────────────────────────────
  # Static-only: no AWS credentials, no EC2 spend, no vcpkg/C++ build — cheap
  # enough to just always run rather than wire up per-job path filtering.
  # `packer validate -syntax-only` (rather than a full `validate`) is used
  # deliberately: a full validate would try to evaluate the template's
  # `amazon-parameterstore` data source, which calls the AWS SSM API and
  # would fail (or hang) without credentials — this job intentionally has
  # none. The real, credential-backed `packer validate` runs inside
  # scripts/build.sh, after its own `aws sts get-caller-identity` check.
  # See .kiro/specs/ca-cluster-node-ami/.
  packer-ca-cluster-node:
    name: Packer (ca_cluster_node AMI)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Every network command is bounded and retried. Unbounded, this step hung
      # for its whole 15-minute job budget and reported as a Packer failure —
      # see the note on the build-and-test install step for why a retry without
      # a timeout is no defence at all.
      - name: Install Packer and shellcheck
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if timeout 120 bash -c 'curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -' \
               && timeout 120 sudo apt-add-repository -y "deb [arch=$(dpkg --print-architecture)] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
               && timeout 300 sudo apt-get update -q \
               && timeout 600 sudo apt-get install -y --no-install-recommends packer shellcheck; then
              exit 0
            fi
            echo "::warning::Packer/shellcheck install failed or timed out (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::Packer/shellcheck install failed after 3 attempts" >&2
          exit 1

      - name: packer fmt -check
        run: packer fmt -check -diff packer/ca_cluster_node/*.pkr.hcl

      - name: packer init + validate (syntax only, no AWS credentials)
        run: |
          packer init packer/ca_cluster_node/ca_cluster_node.pkr.hcl
          packer validate -syntax-only packer/ca_cluster_node/ca_cluster_node.pkr.hcl

      - name: shellcheck
        run: shellcheck packer/ca_cluster_node/scripts/*.sh

      - name: Secret-absence check
        run: |
          ! grep -riE 'unseal|auth.?token|bootstrap.*key' \
            packer/ca_cluster_node/ca_cluster_node.pkr.hcl \
            packer/ca_cluster_node/scripts/provision.sh

  # ── API documentation → GitHub Pages ───────────────────────────────────────
  # This job builds the docs on **every** push and pull request, and is a real
  # gate: `Doxyfile` sets WARN_AS_ERROR = FAIL_ON_WARNINGS, so any documentation
  # warning fails it.
  #
  # It used to be `if: github.event_name == 'push'`, which meant it never ran on
  # a PR -- the skipped `docs` check people kept seeing. Combined with the old
  # WARN_AS_ERROR = NO that made it doubly inert: it could not run where it would
  # block a regression, and could not have failed if it had. The tree carried 69
  # unnoticed Doxygen warnings when this was fixed.
  #
  # Deployment is split into `docs-deploy` below so that only the deploy half
  # needs Pages credentials and the `github-pages` environment. A PR build gets
  # the gate without touching a deployment.
  # Guards a limit GitHub enforces at workflow-VALIDATION time, where nothing
  # in this file's normal checks can see it. A workflow_dispatch block with
  # more than 25 inputs makes the whole file invalid: the workflow stops being
  # dispatchable AND stops running on its schedule, and it surfaces only as a
  # zero-job run whose name is the file path — never as a PR check.
  #
  # That happened. PR #257 took real-cloud-tests.yml from 24 inputs to 27, all
  # of its checks passed, it merged, and the real-cloud workflow was dead on
  # main until this guard's fix landed. A comment would not have caught it,
  # because there was one place to look and no reason to look there.
  # Validates every configs/*_defconfig against Kconfig, so that renaming or
  # removing a symbol cannot leave a stale defconfig behind (kconfig-integration
  # Req 5.4), and fails if a defconfig is applied by no workflow and is not in
  # configs/defconfig-usage-allowlist.txt (ci-build-matrix-coverage Req 4).
  # Calls the scripts directly rather than the `kconfig-check` CMake target:
  # the target only exists after a configure, which needs the vcpkg tree. The
  # first script is the target's whole body, so the two cannot drift.
  kconfig-check:
    name: Kconfig defconfig check
    runs-on: ubuntu-24.04
    # Needs no build or vcpkg tree: under 10 s on main, cold or warm.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt
      - name: Every defconfig loads against Kconfig without a warning
        run: python3 scripts/kconfig/check_defconfigs.py Kconfig configs
      - name: Every defconfig is applied by a workflow or allowlisted
        run: python3 scripts/kconfig/check_defconfig_usage.py

  workflow-input-limits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: No workflow may declare more than 25 workflow_dispatch inputs
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          LIMIT = 25
          bad = False
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              with open(path) as fh:
                  doc = yaml.safe_load(fh)
              # PyYAML resolves the bare `on:` key to the boolean True.
              triggers = doc.get(True) or doc.get('on') or {}
              dispatch = (triggers or {}).get('workflow_dispatch') or {}
              inputs = (dispatch or {}).get('inputs') or {}
              n = len(inputs)
              if n:
                  print(f"{path}: {n} workflow_dispatch input(s)")
              if n > LIMIT:
                  print(f"::error file={path}::{n} workflow_dispatch inputs exceeds "
                        f"GitHub's limit of {LIMIT}. The workflow will fail validation "
                        f"and stop running entirely, including on its schedule.")
                  bad = True
          sys.exit(1 if bad else 0)
          PY
      # A tag or branch can be moved to new code by whoever controls the
      # action's repository, and these jobs hold cloud credentials. Pins
      # name the release in a trailing comment so updates stay reviewable.
      - name: Actions are SHA-pinned and checkouts drop the token
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = False
          files = sorted(glob.glob('.github/workflows/*.yml') +
                         glob.glob('.github/actions/*/action.yml'))
          for path in files:
              lines = open(path).read().split('\n')
              for n, line in enumerate(lines, 1):
                  m = re.match(r'\s*(?:- )?uses:\s*(\S+)', line)
                  if not m or m.group(1).startswith('./'):
                      continue
                  if not re.fullmatch(r'[^@\s]+@[0-9a-f]{40}', m.group(1)):
                      print(f"::error file={path},line={n}::{m.group(1)} is not "
                            f"pinned to a full commit SHA")
                      bad = True
                  if m.group(1).startswith('actions/checkout@') and \
                          'persist-credentials: false' not in '\n'.join(lines[n:n + 4]):
                      print(f"::error file={path},line={n}::actions/checkout "
                            f"without persist-credentials: false")
                      bad = True
              for n, line in enumerate(lines, 1):
                  if 'git clone' in line and 'microsoft/vcpkg.git' in line and \
                          'git -C /tmp/vcpkg checkout' not in '\n'.join(lines[n:n + 25]):
                      print(f"::error file={path},line={n}::vcpkg cloned at HEAD; "
                            f"check out vcpkg.json's builtin-baseline")
                      bad = True
          sys.exit(1 if bad else 0)
          PY

  # Static lint of the AWS CI role's bundle policies: no statement may stop,
  # start, terminate or retag an EC2 instance without a tag condition, the
  # bundles' shared statements must agree, and every bundle together must fit
  # IAM's inline policy limit. Needs no AWS credentials. The live role only
  # changes when provision-oidc-role.sh is re-run, so this is the one place a
  # regression in policies/ shows up before it reaches the account.
  aws-ci-policies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Lint the AWS CI bundle policies
        run: python3 scripts/ci-cloud-credentials/aws/render-ci-policy.py --check

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      pages: write       # configure-pages, on the main-push path only

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Bounded and retried. Unbounded, this step hung for the docs job's whole
      # 30-minute budget without ever invoking Doxygen, and reported as a docs
      # failure — the generate step never ran.
      - name: Install Doxygen
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
               && timeout 600 sudo apt-get install -y --no-install-recommends doxygen; then
              exit 0
            fi
            echo "::warning::doxygen install failed or timed out (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::doxygen install failed after 3 attempts" >&2
          exit 1

      # Fails on any warning -- see WARN_AS_ERROR in Doxyfile.
      - name: Generate documentation
        run: doxygen Doxyfile

      # The external comparison register of
      # .kiro/specs/multi-raft-performance/ Requirement 9 exists twice by
      # design: as machine-readable data, and rendered in full into
      # doc/multi_raft_performance_comparison.md because Requirement 11.4
      # asks for it in full rather than as a summary. Two copies of the same
      # content is a drift hazard, so this asserts they agree -- and it also
      # runs the register's own validation, which is what enforces "a field
      # the source does not state is recorded as not stated, never inferred"
      # (9.2) and the minimum comparison set (9.4). Costs about a second.
      - name: Check the external comparison register renders current
        run: ./scripts/render-external-register.py --check

      # The cloud quorum managers' docker/*_quorum_manager/*.env.example files document every
      # field of their config structs, but nothing compiles them, so a field
      # added or renamed in a header would leave the example silently stale.
      # This fails the job instead. Pure text parsing; well under a second.
      - name: Check the cloud .env.example files cover their config structs
        run: ./scripts/check-cloud-env-examples.py

      - name: Setup GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      # Uploaded unconditionally: on main it is what `docs-deploy` publishes, and
      # on a PR it gives the reviewer a downloadable copy of the rendered docs.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: doxygen-output/html

  # Publishes the artifact `docs` produced. Pushes to main only -- `on:` above
  # restricts push to main already, so the ref test is belt-and-braces.
  # Requires GitHub Pages to be enabled in the repository settings with the
  # source set to "GitHub Actions".
  docs-deploy:
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      pages: write       # publish the Pages artifact
      id-token: write    # request OIDC token for deployment

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
