# The ledger module's own workflow (services/ledger/, services/README.md
# "CI", .kiro/specs/verifiable-ledger/). ci.yml is the gate: its Ion
# Serializer Build job builds the module with ci_ion_defconfig and runs its
# tests, the three-process cluster and crash tests included, on every pull
# request. This workflow adds, for changes to the module or what its daemon
# builds on, the container scenario (task 11, Requirement 12.5):
# services/ledger/tests/docker/, three ledger_node members under kills and
# partitions with every replica's journal verified after, under both
# runtimes CLAUDE.md requires: rootful Docker and rootless Podman.
#
# It reuses the Ion Serializer Build tree, as redis-module.yml's
# engine-containers job does: same compiler (g++-14, whose libstdc++ is
# Ubuntu 24.04's, the image base), same vcpkg features and cache key, same
# defconfig, so the vcpkg cache and sccache objects that job writes are
# what this one reads.
#
# NOT a required check: GitHub reports nothing for a workflow its paths
# filter skips, so a required check from it would hang every unrelated pull
# request. Whoever merges a pull request that touches the module waits for
# this workflow too (services/README.md).

name: Ledger Module

on:
  push:
    branches: [main]
    paths:
      - "services/ledger/**"
      - ".github/workflows/ledger-module.yml"
      - ".github/actions/setup-container-runtime/**"
      - "tests/docker_chaos/os_faults.hpp"
      - "cmake/kythira_test_helpers.cmake"
      - "configs/ci_ion_defconfig"
      # What the daemon is built from in core: the multi-Raft host, the
      # Beast transport its Raft and API run on, the RocksDB engine, and
      # the snapshot stream a lagging member catches up through.
      - "include/raft/multi_raft*.hpp"
      - "include/raft/beast_*.hpp"
      - "include/raft/rocksdb_kv_engine.hpp"
      - "src/rocksdb_kv_engine.cpp"
      - "include/raft/snapshot_stream.hpp"
  pull_request:
    branches: ['**']
    # Keep in step with the push list above.
    paths:
      - "services/ledger/**"
      - ".github/workflows/ledger-module.yml"
      - ".github/actions/setup-container-runtime/**"
      - "tests/docker_chaos/os_faults.hpp"
      - "cmake/kythira_test_helpers.cmake"
      - "configs/ci_ion_defconfig"
      - "include/raft/multi_raft*.hpp"
      - "include/raft/beast_*.hpp"
      - "include/raft/rocksdb_kv_engine.hpp"
      - "src/rocksdb_kv_engine.cpp"
      - "include/raft/snapshot_stream.hpp"
  schedule:
    # Monday 09:00 UTC, an hour after redis-module.yml's run.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      runtime:
        description: "Which runtime leg(s) of the container job to run"
        type: choice
        options: [both, docker, podman]
        default: both

permissions:
  contents: read

# A new push to a pull request cancels its older run; on main a run that has
# started is left to finish (same policy as ci.yml).
concurrency:
  group: ledger-module-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  containers:
    name: Ledger chaos scenario (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # The read-write build-cache key is an environment secret of
    # build-cache-write (main only); see ci.yml and doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(inputs.runtime && inputs.runtime != 'both' && format('["{0}"]', inputs.runtime) || '["docker", "podman"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install system dependencies
        run: |
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 g++-14 cmake ninja-build libfiu-dev \
                 autoconf autoconf-archive automake libtool mold; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # Docker as the runner ships it, or rootless Podman with netavark and
      # aardvark-dns, set up the one way every container workflow shares.
      - name: Set up the container runtime
        uses: ./.github/actions/setup-container-runtime
        with:
          runtime: ${{ matrix.runtime }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: x64-linux
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          pr-access-key-id: ${{ secrets.OCI_BUILD_CACHE_PR_ACCESS_KEY_ID }}
          pr-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_PR_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          # The Ion Serializer Build job's key (ci.yml), on purpose.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-ion-rocksdb-g++-14-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          # CC/CXX are part of every port's ABI hash: the Ion job's.
          export CC=gcc-14
          export CXX=g++-14
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux --no-print-usage --x-feature=edhoc --x-feature=ion --x-feature=rocksdb
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux

      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # Strict, so a tree that lost RocksDB or ion-c fails here rather than
      # building ledger_node as the self-test only, which defines no
      # container targets. CONTAINER_RUNTIME is explicit because the runner
      # has both binaries and auto-detection prefers docker.
      - name: Configure (ci_ion_defconfig, strict)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DKYTHIRA_KCONFIG=configs/ci_ion_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_LINKER=mold \
            -DCONTAINER_RUNTIME=${{ matrix.runtime }} \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/x64-linux

      # Builds ledger_node, ledger_ctl and the scenario, stages the image,
      # and runs the scenario against a live stack.
      - name: docker-ledger-chaos-tests
        run: cmake --build build --target docker-ledger-chaos-tests -j"$(nproc)"

      - name: Podman service log
        if: always() && matrix.runtime == 'podman'
        run: tail -n 200 "$RUNNER_TEMP/podman-service.log" || true

      - name: Leftover containers
        if: always()
        run: ${{ matrix.runtime }} ps -a
