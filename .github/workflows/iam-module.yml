# The IAM module's own workflow (services/iam/, services/README.md "CI",
# .kiro/specs/iam-compatible-auth/ Requirement 17). ci.yml is the gate: it
# builds the module and runs its tests on every pull request, because
# ci_full_defconfig sets CONFIG_IAM=y. This workflow adds, for changes to
# the module or what it builds on:
#
#   - the boundary check (also in ci.yml's kconfig-check job);
#   - a module-on build of just the module's targets, with its tests, so a
#     module change gets an answer in minutes instead of after the full
#     build-and-test legs;
#   - a module-off configure (configs/ci_no_iam_defconfig) that asserts no
#     IAM target or test exists with the switch off.
#
# The module-off configure does not build core: ci.yml's config-variants job
# already builds every target of minimal_defconfig, where CONFIG_IAM is off
# by default, and the boundary check's core-includes-module rule keeps core
# from including a module header at all.
#
# NOT a required check: GitHub reports nothing for a workflow its paths
# filter skips, so a required check from it would hang every unrelated pull
# request. Whoever merges a pull request that touches the module waits for
# this workflow too (services/README.md).
#
# The container job (task 9, Requirement 17.3) runs the module's compose
# scenario, services/iam/tests/docker/, under both runtimes CLAUDE.md
# requires: rootful Docker and rootless Podman. It is here rather than in
# container-tests.yml because that workflow configures without
# CONFIG_IAM, so the targets do not exist there, and because a module
# change should get this answer on its own pull request, not a week later.
# The same job then runs the conformance stack (task 23, Requirement 15.1):
# boto3 and the AWS CLI v2 against IAM, STS, the Kythira CA's issuer and
# two Redis gateways' IAM AUTH.

name: IAM Module

on:
  push:
    branches: [main]
    paths:
      - "services/iam/**"
      - "services/README.md"
      - "cmake/kythira_test_helpers.cmake"
      - "cmake/Kconfig.cmake"
      - "scripts/check_module_boundaries.py"
      - "scripts/tests/test_check_module_boundaries.py"
      - "configs/ci_full_defconfig"
      - "configs/ci_no_iam_defconfig"
      - "Kconfig"
      - "CMakeLists.txt"
      # Core pieces only the module's daemon and scenario use today.
      - "include/raft/beast_https_server.hpp"
      - "tests/docker_chaos/os_faults.hpp"
      # The core headers of Requirement 17.2, which the module builds on.
      - "include/raft/jwt.hpp"
      - "include/raft/sigv4_verifier.hpp"
      - "include/raft/sigv4_failure_limiter.hpp"
      - "include/raft/aws_query_protocol.hpp"
      - "include/raft/cloud_credential_exchange.hpp"
      - "include/raft/aws_web_identity_credentials.hpp"
      - "include/raft/azure_federated_credential.hpp"
      - "include/raft/aws_request_authorizer.hpp"
      - "include/raft/credential_verifier.hpp"
      # The conformance stack's other daemons (task 23).
      - "cmd/ca_cluster_node/**"
      - "services/redis/cmd/redis_gateway_node/**"
      - ".github/actions/setup-container-runtime/**"
      - ".github/workflows/iam-module.yml"
  pull_request:
    branches: ['**']
    # Keep in step with the push list above.
    paths:
      - "services/iam/**"
      - "services/README.md"
      - "cmake/kythira_test_helpers.cmake"
      - "cmake/Kconfig.cmake"
      - "scripts/check_module_boundaries.py"
      - "scripts/tests/test_check_module_boundaries.py"
      - "configs/ci_full_defconfig"
      - "configs/ci_no_iam_defconfig"
      - "Kconfig"
      - "CMakeLists.txt"
      # Core pieces only the module's daemon and scenario use today.
      - "include/raft/beast_https_server.hpp"
      - "tests/docker_chaos/os_faults.hpp"
      # The core headers of Requirement 17.2, which the module builds on.
      - "include/raft/jwt.hpp"
      - "include/raft/sigv4_verifier.hpp"
      - "include/raft/sigv4_failure_limiter.hpp"
      - "include/raft/aws_query_protocol.hpp"
      - "include/raft/cloud_credential_exchange.hpp"
      - "include/raft/aws_web_identity_credentials.hpp"
      - "include/raft/azure_federated_credential.hpp"
      - "include/raft/aws_request_authorizer.hpp"
      - "include/raft/credential_verifier.hpp"
      # The conformance stack's other daemons (task 23).
      - "cmd/ca_cluster_node/**"
      - "services/redis/cmd/redis_gateway_node/**"
      - ".github/actions/setup-container-runtime/**"
      - ".github/workflows/iam-module.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iam-module-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundary:
    name: IAM module boundary check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fixture tests first, so a broken checker cannot pass the tree by
      # reporting nothing (same order as ci.yml's kconfig-check).
      - name: Module boundary checker passes its fixture tests
        run: python3 scripts/tests/test_check_module_boundaries.py -v
      - name: services/iam uses only Kythira's public surface
        run: python3 scripts/check_module_boundaries.py

  build:
    name: IAM module on and off (clang++-18, x64)
    runs-on: ubuntu-24.04
    # A warm vcpkg tree and sccache make this minutes. A cold vcpkg tree is
    # config-variants' 78-minute install, which this job shares by key.
    timeout-minutes: 180
    # The read-write build-cache key is an environment secret of
    # build-cache-write (main only); same-repository pull requests write
    # with the create-only pr key, and everything else reads only. See
    # doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          ./scripts/drop-unused-apt-repos.sh
          # autoconf & co. are for vcpkg's gperf port, needed only on a cold
          # vcpkg cache; see ci.yml's build-and-test job.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev \
                 autoconf autoconf-archive automake libtool mold; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # Only reached on a cold vcpkg cache: the edhoc feature builds the
      # lakers overlay port from Rust source.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          pr-access-key-id: ${{ secrets.OCI_BUILD_CACHE_PR_ACCESS_KEY_ID }}
          pr-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_PR_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      # Byte-identical to ci.yml's x64 clang++-18 key (config-variants and
      # the clang build-and-test leg), so this job reuses their tree.
      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-clang++-18-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          # clang-built ports, for mold: see ci.yml's build-and-test vcpkg step.
          export CC=clang-18 CXX=clang++-18
          export LDFLAGS="-Wl,--push-state,--no-as-needed -latomic -Wl,--pop-state"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      - name: Configure (module on, ci_full_defconfig, strict)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_LINKER=mold \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}

      # Every test labelled iam, built by name: the module's tests and core's
      # IAM suites (JWT, OIDC issuer, SigV4, credential exchange), which the
      # module builds on. The list comes from ctest, so a new test joins
      # without an edit here.
      - name: Build the module's tests
        run: |
          mapfile -t tests < <(ctest --test-dir build -N -L '^iam$' \
            | sed -n 's/^ *Test *#[0-9]*: \(.*\)$/\1/p')
          if (( ${#tests[@]} == 0 )); then
            echo "::error::no test carries the iam label in the module-on build"
            exit 1
          fi
          echo "IAM tests: ${tests[*]}"
          cmake --build build -j"$(nproc)" --target "${tests[@]}"

      - name: Run the module's tests
        run: ctest --test-dir build -L '^iam$' --output-on-failure --no-tests=error

      - name: Configure (module off, ci_no_iam_defconfig, strict)
        run: |
          cmake -B build-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_no_iam_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_LINKER=mold \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}

      - name: Assert nothing of the module is configured with it off
        run: |
          rc=0
          # `iam-module`, not `iam`: core's IAM suites carry `iam` too and
          # rightly exist with the module off.
          if ctest --test-dir build -N -L '^iam-module$' | grep -q '^ *Test *#'; then :; else
            echo "::error::no iam-module test in the module-on build, so the check below proves nothing"
            rc=1
          fi
          if ctest --test-dir build-off -N -L '^iam-module$' | grep -q '^ *Test *#'; then
            echo "::error::an iam-module test exists with CONFIG_IAM off"
            rc=1
          fi
          # Every output Ninja knows; a module target or object would sit
          # under build-off/services/iam/ or be named after the module.
          if ninja -C build-off -t targets all \
               | grep -E '(^|/)services/iam/|kythira_iam|iam_policy_test'; then
            echo "::error::a services/iam target exists with CONFIG_IAM off"
            rc=1
          fi
          exit $rc

  container:
    name: IAM cluster in containers (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install system dependencies
        run: |
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev \
                 autoconf autoconf-archive automake libtool mold; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # Docker as the runner ships it, or rootless Podman with netavark and
      # aardvark-dns, set up the one way every container workflow shares.
      - name: Set up the container runtime
        uses: ./.github/actions/setup-container-runtime
        with:
          runtime: ${{ matrix.runtime }}

      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: x64-linux
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          pr-access-key-id: ${{ secrets.OCI_BUILD_CACHE_PR_ACCESS_KEY_ID }}
          pr-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_PR_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      # The build job's key, so both share one tree.
      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-clang++-18-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          export CC=clang-18 CXX=clang++-18
          export LDFLAGS="-Wl,--push-state,--no-as-needed -latomic -Wl,--pop-state"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux

      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # CONTAINER_RUNTIME is explicit because the runner has both binaries
      # and auto-detection prefers docker.
      - name: Configure (module on, ci_full_defconfig)
        id: configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_LINKER=mold \
            -DCONTAINER_RUNTIME=${{ matrix.runtime }} \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/x64-linux

      # Builds iam_node, kythira-iam, iam_test_certs and the scenario, stages
      # the image, and runs the scenario against a live stack.
      - name: docker-iam-node-tests
        run: cmake --build build --target docker-iam-node-tests -j"$(nproc)"

      # Task 23 (Requirement 15.1): the conformance stack (the CA and two
      # IAM-enabled Redis gateways besides the voters), driven by boto3 and
      # the AWS CLI v2 at pinned versions.
      - name: docker-iam-conformance-tests
        if: always() && steps.configure.outcome == 'success'
        run: cmake --build build --target docker-iam-conformance-tests -j"$(nproc)"

      - name: Podman service log
        if: always() && matrix.runtime == 'podman'
        run: tail -n 200 "$RUNNER_TEMP/podman-service.log" || true

      - name: Leftover containers
        if: always()
        run: ${{ matrix.runtime }} ps -a
