name: CoAP Flake Measurement

# Measures the per-test failure rate of the coap suite. Manually dispatched:
# this is a diagnostic instrument, not a PR gate.
#
# It exists because the coap tests have been "fixed" repeatedly by raising
# timeouts and shrinking iteration counts (92d824b, bc39d04, 9727d38, 5a9c5ff)
# without any measurement showing the change helped. A fix that cannot be
# measured cannot be distinguished from luck, so this job establishes the
# before/after number that every such change should be judged against.
#
# Two deliberate differences from the `Test` step in ci.yml:
#
#   * `-j` is kept, and defaults to $(nproc), because parallelism is part of
#     the phenomenon under study — six coap test files bind port 5683 and two
#     more share 19683, so concurrent execution is exactly when they collide.
#     Running this serially would hide the effect it is meant to quantify.
#
#   * `--repeat until-pass:3` is NOT used. ci.yml retries each failing test up
#     to three times, so a test it reports as failed had already failed three
#     times over. That is the right behaviour for a gate and the wrong one for
#     a measurement: it reports the post-retry rate, not the flake rate.
#
# Read the numbers with two caveats, both learned by getting them wrong on a
# trial run outside GitHub Actions:
#
#   * `-L coap` on its own is a HARSHER condition than ci.yml, not an equal
#     one. It packs only coap tests onto every -j slot, so port and socket
#     contention is far denser than CI's mixed workload. On that trial the
#     coap-only failure set did not match CI's at all: the two tests actually
#     failing CI passed every iteration, while two that never fail CI failed
#     most of them. Use `exclude_labels` (with a blank `label`) to reproduce
#     CI's selection when the question is "why is CI red", and keep coap-only
#     for stress.
#
#   * The measurement is only meaningful against a baseline gathered the same
#     way. A rate from one ref means little; a before/after pair on identical
#     hardware and selection is the unit of evidence. At 20 iterations a shift
#     of one or two runs is inside binomial noise -- treat it as no change.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many times to run the coap suite"
        type: string
        required: false
        default: "20"
      jobs:
        description: "ctest -j value (blank = nproc; 1 = serial, to isolate contention effects)"
        type: string
        required: false
        default: ""
      label:
        description: >
          CTest label to measure. Use the literal 'all' for no label filter --
          an empty value does NOT work, because GitHub substitutes this input's
          default whenever a dispatch passes an empty string, so `-f label=""`
          silently runs the coap-only selection instead of the full suite.
        type: string
        required: false
        default: "coap"
      profile:
        description: >
          Build profile. 'release' matches ci.yml's Build & Test
          (-DCMAKE_BUILD_TYPE=Release). 'coverage' matches its Coverage job
          (-DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug), which is
          substantially slower — and the leading hypothesis for CI's coap
          failures is that they are specific to that slower build rather than
          to the tests themselves.
        type: choice
        required: false
        default: release
        options: [release, coverage]
      compiler:
        description: >
          Compiler to measure. ci.yml builds every leg with both, but every
          measurement so far used clang++-18 only, so the timeout scale is
          validated for clang alone.
        type: choice
        required: false
        default: "clang++-18"
        options: ["clang++-18", "g++-13"]
      arch:
        description: >
          Architecture. arm64 runners are slower than x64, so whether a scale
          of 4 is sufficient there is untested.
        type: choice
        required: false
        default: x64
        options: [x64, arm64]
      timeout_scale:
        description: >
          KYTHIRA_TEST_TIMEOUT_SCALE for the build. Must match what the CI job
          being modelled uses, or the measurement silently tests something
          other than what CI runs — ci.yml's Coverage job passes 4, and a run
          that omits it measures unscaled timeouts on a branch whose whole
          purpose is the scaling.
        type: string
        required: false
        default: ""
      exclude_labels:
        description: >
          CTest -LE exclusion regex. Set to ci.yml's own value
          '^(slow|performance|verbose|benchmark|docker)$' together with a blank
          `label` to measure under CI-like conditions rather than coap-only.
        type: string
        required: false
        default: ""
      test_regex:
        description: "CTest -R name regex (blank = no name filter)"
        type: string
        required: false
        default: ""
      sim_extra_latency_ms:
        description: "KYTHIRA_SIM_EXTRA_LATENCY_MS: extra ms added to every network simulator edge (0 = off)"
        type: string
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  measure:
    name: Measure ${{ github.event.inputs.label || 'coap' }} @ ${{ github.event.inputs.compiler || 'clang++-18' }}/${{ github.event.inputs.arch || 'x64' }}
    runs-on: ${{ github.event.inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    # The read-write build-cache key is an environment secret of
    # build-cache-write, whose deployment branches are main only, so a
    # job on any other ref never receives it and cannot poison the cache
    # main builds from. Other refs run with no environment and fall back
    # to the read-only key. See doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Drop runner-image apt sources this project never installs from; a
          # 403 from one of them fails `apt-get update` and short-circuits the
          # install. See the script header.
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if sudo apt-get update -q && sudo apt-get install -y --no-install-recommends \
                 clang-18 g++-13 cmake ninja-build libfiu-dev ccache \
                 autoconf autoconf-archive automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Exports the environment vcpkg's x-aws backend reads (and sccache's,
      # where a leg uses it). Writer policy lives in the action: only a push
      # to main gets the read-write key. See .kiro/specs/oci-build-cache/.
      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ github.event.inputs.arch == 'arm64' && 'arm64-linux' || 'x64-linux' }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      - name: Cache vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        run: |
          # Per-package binary cache keyed on vcpkg's own ABI hash (port version,
          # triplet, compiler, features, patches). Unlike the whole-tree
          # actions/cache above, jobs with different feature sets share every
          # package they have in common -- the gcp tree is the edhoc tree plus
          # google-cloud-cpp, so only the delta is ever built.
          # VCPKG_BINARY_SOURCES comes from the OCI build cache action as x-aws
          # against the bucket; re-exporting here would override it, and x-gha
          # is a backend vcpkg removed some time ago.
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          # Pin the tool + scripts to vcpkg.json's builtin-baseline, not HEAD
          # (same reasoning as ci.yml's build-and-test job).
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet "$TRIPLET" --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux
          TRIPLET: ${{ github.event.inputs.arch == 'arm64' && 'arm64-linux' || 'x64-linux' }}

      # Same compiler cache as every ci.yml job (oci-build-cache Req 5.1).
      # Without it CMake's `auto` launcher picks the apt-installed ccache,
      # which starts empty on every runner, so each dispatch recompiled the
      # whole tree cold. The script probes with a real compile and leaves the
      # launcher unset when the bucket is unreachable, so a cache failure
      # falls back to an uncached build rather than a red one.
      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # Dispatch inputs reach the shell through env, never by expression
      # interpolation into the script: an interpolated input is pasted in as
      # shell source before bash parses it, so a crafted value runs commands.
      - name: Configure
        env:
          SCALE: ${{ github.event.inputs.timeout_scale }}
          PROFILE: ${{ github.event.inputs.profile }}
          COMPILER: ${{ github.event.inputs.compiler || 'clang++-18' }}
          ARCH: ${{ github.event.inputs.arch || 'x64' }}
          TRIPLET: ${{ github.event.inputs.arch == 'arm64' && 'arm64-linux' || 'x64-linux' }}
          LAUNCHER: ${{ steps.sccache.outputs.launcher || 'none' }}
        run: |
          SCALE_ARG=""
          [ -n "$SCALE" ] && SCALE_ARG="-DKYTHIRA_TEST_TIMEOUT_SCALE=$SCALE"
          echo "configure: profile=$PROFILE compiler=$COMPILER arch=$ARCH ${SCALE_ARG:-<no timeout scale>}"
          if [ "$PROFILE" = "coverage" ]; then
            # Models ci.yml's Coverage job: instrumented AND Debug. Note that
            # job also passes -DKYTHIRA_TEST_TIMEOUT_SCALE; pass the same value
            # via `timeout_scale` or this measures a configuration CI does not
            # actually run.
            cmake -B build -G Ninja \
              -DENABLE_COVERAGE=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              $SCALE_ARG \
              -DKYTHIRA_COMPILER_LAUNCHER="$LAUNCHER" \
              -DCMAKE_CXX_COMPILER="$COMPILER" \
              -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/vcpkg_installed/$TRIPLET"
          else
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              $SCALE_ARG \
              -DKYTHIRA_COMPILER_LAUNCHER="$LAUNCHER" \
              -DCMAKE_CXX_COMPILER="$COMPILER" \
              -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/vcpkg_installed/$TRIPLET"
          fi

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: |
          {
            echo "### sccache — coap-flake-measure"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      - name: Run the suite N times and record every result
        env:
          TEST_REGEX: ${{ github.event.inputs.test_regex }}
          SIM_EXTRA_LATENCY_MS: ${{ github.event.inputs.sim_extra_latency_ms }}
          ITER: ${{ github.event.inputs.iterations || '20' }}
          LABEL: ${{ github.event.inputs.label }}
          EXCLUDE: ${{ github.event.inputs.exclude_labels }}
          JOBS: ${{ github.event.inputs.jobs }}
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          set -uo pipefail
          [ -z "$JOBS" ] && JOBS="$(nproc)"
          SEL=()
          # 'all' is the explicit no-label-filter sentinel; see the input's
          # description for why an empty string cannot serve that purpose.
          [ -n "$LABEL" ] && [ "$LABEL" != "all" ] && SEL+=(-L "$LABEL")
          [ -n "$EXCLUDE" ] && SEL+=(-LE "$EXCLUDE")
          [ -n "$TEST_REGEX" ] && SEL+=(-R "$TEST_REGEX")
          # Read by the network simulator; 0 leaves every edge as configured.
          export KYTHIRA_SIM_EXTRA_LATENCY_MS="${SIM_EXTRA_LATENCY_MS:-0}"
          echo "KYTHIRA_SIM_EXTRA_LATENCY_MS=$KYTHIRA_SIM_EXTRA_LATENCY_MS"
          [ ${#SEL[@]} -eq 0 ] && SEL+=(-L coap)
          mkdir -p flake-results
          echo "Measuring ${SEL[*]} over $ITER iterations at -j$JOBS"
          for i in $(seq 1 "$ITER"); do
            # No --repeat: a retry would measure ci.yml's masking, not the flake.
            # Failures are expected here, so never let one abort the loop.
            # --output-junit is resolved relative to --test-dir, while the >
            # redirect is relative to the shell's CWD. A relative path here
            # silently wrote the XML into build/flake-results/ where the upload
            # never looked, producing an artifact of logs with no JUnit and a
            # summary reporting "0 runs parsed". Absolute path keeps both in
            # the directory that actually gets uploaded.
            # Under the coverage profile, set the same profile-file pattern
            # ci.yml's Coverage job uses, so instrumentation cost is included.
            if [ "$PROFILE" = "coverage" ]; then
              export LLVM_PROFILE_FILE="$PWD/build/%p-%m.profraw"
            fi
            ctest --test-dir build "${SEL[@]}" -j"$JOBS" \
              --output-junit "$PWD/flake-results/run-$i.xml" \
              --output-on-failure \
              > "flake-results/run-$i.log" 2>&1 || true
            echo "  iteration $i/$ITER done"
            grep -nE "error: in|fatal error: in|\*\*\*Failed|\*\*\*Timeout|\*\*\*Exception|Test case .* did not|check .* has failed" "flake-results/run-$i.log" | head -60 || true
          done

      - name: Summarise per-test failure rates
        if: always()
        run: |
          python3 - <<'PY' | tee flake-results/summary.md
          import glob, xml.etree.ElementTree as ET
          from collections import defaultdict
          runs = sorted(glob.glob("flake-results/run-*.xml"))
          fails, seen = defaultdict(int), defaultdict(int)
          for r in runs:
              try:
                  root = ET.parse(r).getroot()
              except ET.ParseError:
                  continue
              for tc in root.iter("testcase"):
                  name = tc.get("name")
                  seen[name] += 1
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      fails[name] += 1
          print(f"# CoAP flake measurement\n")
          print(f"Completed runs parsed: **{len(runs)}**\n")
          if not fails:
              print("No failures observed across any run.")
          else:
              print("| Test | Failures | Runs | Rate |")
              print("|---|---:|---:|---:|")
              for name, n in sorted(fails.items(), key=lambda kv: -kv[1]):
                  total = seen[name] or len(runs)
                  print(f"| `{name}` | {n} | {total} | {100.0*n/total:.0f}% |")
          PY

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coap-flake-results
          path: flake-results/
