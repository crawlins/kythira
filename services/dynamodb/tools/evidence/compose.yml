# Wire-evidence recording in containers (.kiro/specs/dynamodb-compatible-api/
# task 1): the recording stub and one service per client, wired by service
# name (no static addresses, no host networking), so it runs the same under
# rootful Docker and rootless Podman (CLAUDE.md). record.sh drives it:
# `up -d stub`, waits until the stub answers (no healthcheck: rootless
# Podman needs systemd to run one), then `run --rm <client>` for each
# client in turn.
#
# EVIDENCE_OUT is the host directory the stub writes <client>.jsonl into.
#
# The `kythira` profile is the conformance run on Kythira (tasks 11 and
# 24, clients_on_kythira.sh): three dynamodb_gateway_node containers
# (ddb-1 .. ddb-3, a Raft cluster wired by service name) and `forwarder`,
# the stub with --dynamodb-upstream, which serves the KCL clients' Kinesis
# calls itself and passes every client's DynamoDB calls to ddb-2. The
# `terraform` client runs only there. The API, Raft and the
# gateways' forwarding are plaintext inside this private network; nothing
# is published on the host. `up` without the profile never starts them.

name: kythira-dynamodb-evidence

services:
  stub:
    image: docker.io/library/python:3.13.9-slim
    command: ["python3", "/tools/recording_stub.py", "--port", "8000", "--out", "/out"]
    volumes:
      - ./:/tools:ro
      - ${EVIDENCE_OUT:?set EVIDENCE_OUT}:/out

  aws-cli:
    image: docker.io/amazon/aws-cli:2.31.30
    entrypoint: ["sh", "/tools/clients/aws_cli.sh"]
    environment:
      ENDPOINT: http://stub:8000
    volumes:
      - ./:/tools:ro
    depends_on:
      - stub

  boto3:
    image: docker.io/library/python:3.13.9-slim
    entrypoint: ["sh", "-c", "pip install -q --root-user-action=ignore -r /tools/clients/requirements.txt && python3 /tools/clients/boto3_client.py"]
    environment:
      ENDPOINT: http://stub:8000
    volumes:
      - ./:/tools:ro
    depends_on:
      - stub

  # The Java clients share one image and a Maven repository volume; the
  # client name is the run argument (java-sdk, lock-client, kcl2, kcl3,
  # streams-adapter). Sources are copied out of the read-only mount so
  # Maven can write target/.
  java:
    image: docker.io/library/maven:3.9.11-eclipse-temurin-21
    entrypoint: ["sh", "-c", "rm -rf /work && cp -r /tools/clients /work && exec sh /work/run_java.sh \"$$0\""]
    environment:
      ENDPOINT: http://stub:8000
    volumes:
      - ./:/tools:ro
      - m2:/root/.m2
    depends_on:
      - stub

  # Terraform's AWS provider against Kythira (task 24); it fetches the
  # provider from the Terraform registry.
  terraform:
    image: docker.io/hashicorp/terraform:1.9.8
    profiles: ["kythira"]
    entrypoint: ["sh", "/tools/clients/terraform/run_terraform.sh"]
    environment:
      ENDPOINT: http://forwarder:8000
    volumes:
      - ./:/tools:ro
    depends_on:
      - forwarder

  ddb-1: &ddb
    image: kythira-dynamodb-node:dev
    profiles: ["kythira"]
    environment: &ddb_env
      KYTHIRA_DYNAMODB_NODE_ID: "1"
      KYTHIRA_DYNAMODB_PEERS: "1=http://ddb-1:7000,2=http://ddb-2:7000,3=http://ddb-3:7000"
      KYTHIRA_DYNAMODB_PEER_GATEWAYS: "2=ddb-2:8000,3=ddb-3:8000"
      KYTHIRA_DYNAMODB_FORWARD_SECRET: kcl-on-kythira-forward-secret
      KYTHIRA_DYNAMODB_INSECURE_PLAINTEXT: "1"
      KYTHIRA_DYNAMODB_LOG_LEVEL: warning
      # The keys the evidence clients sign with (EVIDENCE-<client>).
      KYTHIRA_DYNAMODB_STATIC_KEYS: >-
        EVIDENCE-aws-cli:evidence-secret-not-a-credential:000000000000:aws-cli:admin,EVIDENCE-boto3:evidence-secret-not-a-credential:000000000000:boto3:admin,EVIDENCE-java-sdk:evidence-secret-not-a-credential:000000000000:java-sdk:admin,EVIDENCE-lock-client:evidence-secret-not-a-credential:000000000000:lock-client:admin,EVIDENCE-terraform:evidence-secret-not-a-credential:000000000000:terraform:admin,EVIDENCE-kcl2:evidence-secret-not-a-credential:000000000000:kcl2:admin,EVIDENCE-kcl3:evidence-secret-not-a-credential:000000000000:kcl3:admin,EVIDENCE-streams-adapter:evidence-secret-not-a-credential:000000000000:streams-adapter:admin

  ddb-2:
    <<: *ddb
    environment:
      <<: *ddb_env
      KYTHIRA_DYNAMODB_NODE_ID: "2"
      KYTHIRA_DYNAMODB_PEER_GATEWAYS: "1=ddb-1:8000,3=ddb-3:8000"

  ddb-3:
    <<: *ddb
    environment:
      <<: *ddb_env
      KYTHIRA_DYNAMODB_NODE_ID: "3"
      KYTHIRA_DYNAMODB_PEER_GATEWAYS: "1=ddb-1:8000,2=ddb-2:8000"

  forwarder:
    image: docker.io/library/python:3.13.9-slim
    profiles: ["kythira"]
    command: ["python3", "/tools/recording_stub.py", "--port", "8000", "--out", "/out",
              "--dynamodb-upstream", "ddb-2:8000"]
    volumes:
      - ./:/tools:ro
      - ${EVIDENCE_OUT:?set EVIDENCE_OUT}:/out
    depends_on:
      - ddb-1
      - ddb-2
      - ddb-3

volumes:
  m2:
