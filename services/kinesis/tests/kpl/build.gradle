// A KPL producer for the Kinesis container scenario's conformance case
// (.kiro/specs/kinesis-compatible-streams/ task 17): user records through
// the Kinesis Producer Library with aggregation on, read back by KCL,
// which deaggregates them. Version pinned, the same as the wire evidence
// (tests/evidence/clients/kpl).

plugins {
    id 'application'
}

repositories {
    // repo1 is the same Maven Central; the CI proxy rate-limits the other name less.
    maven { url = 'https://repo1.maven.org/maven2' }
}

dependencies {
    implementation 'com.amazonaws:amazon-kinesis-producer:0.15.12'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'kythira.kpl.KplProducer'
}
