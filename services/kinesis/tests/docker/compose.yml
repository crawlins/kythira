# Three Kinesis gateway nodes and their clients
# (.kiro/specs/kinesis-compatible-streams/ task 7, Requirement 9), driven
# by kinesis_node_scenario_test.
#
# CLAUDE.md's container rules, as they apply here:
#
#   * **No static IPs.** No `ipam`, no `ipv4_address`; rootless Podman drops
#     them silently. Raft RPC, forwarded writes, segment fetches and every
#     client address nodes by **service name** (kin-1 .. kin-3).
#   * **No runtime named anywhere.** The scenario test drives this file
#     through `container_runtime()` / `compose_prefix()`
#     (tests/docker_chaos/os_faults.hpp), honouring
#     $KYTHIRA_CONTAINER_RUNTIME and $KYTHIRA_COMPOSE_COMMAND.
#   * **No capabilities, no privileged or host networking.**
#
# The API and Raft RPC are plaintext inside this private network
# (KINESIS_ALLOW_PLAINTEXT, KYTHIRA_ALLOW_PLAINTEXT_RAFT): what this
# scenario checks is the SDKs against a cluster. The gateway's TLS, the
# peer client's certificate checks and the forwarding HMAC have their own
# tests (kinesis_gateway_test, kinesis_forward_test). Nothing is published
# on the host, so two stacks never contend for a port.
#
# The clients are in the `clients` profile, so `up` never starts them; the
# scenario runs each with `compose --profile clients run --rm`. The KCL
# workers are in the `kcl` profile, the S3 mock in `s3` and the DynamoDB
# lease stores with their workers in `leases`, for the same reason. Each node
# keeps its Raft state and segments in its own named volume, so
# `stop`/`start` resumes it and `down -v` is a clean slate.

name: kythira-kinesis-scenario

x-node: &node
  image: kythira-kinesis-node:dev
  networks:
    - kinesis_net

x-env: &env
  KYTHIRA_PEERS: "1=http://kin-1:7100,2=http://kin-2:7100,3=http://kin-3:7100"
  KYTHIRA_RAFT_BIND: 0.0.0.0
  KYTHIRA_RAFT_PORT: "7100"
  KYTHIRA_ALLOW_PLAINTEXT_RAFT: "true"
  KYTHIRA_ELECTION_TIMEOUT_MIN_MS: "1000"
  KYTHIRA_ELECTION_TIMEOUT_MAX_MS: "2000"
  KYTHIRA_LOG_LEVEL: warning
  KINESIS_LISTEN: 0.0.0.0:4567
  KINESIS_ALLOW_PLAINTEXT: "true"
  KINESIS_STATIC_KEYS_FILE: /etc/kinesis/keys
  KINESIS_DATA_DIR: /var/lib/kinesis
  # Peer gateways default to each Raft host with this node's listen port:
  # kin-N:4567.
  KINESIS_FORWARD_SECRET: kinesis-scenario-forward-secret
  # The catalog in one group and every shard in another, so a reshard is a
  # cross-group transaction (task 11).
  KYTHIRA_SHARD_CUTS: "k/"
  # Seconds, not a minute, between maintenance passes: the resharding case
  # waits for the pass to finish a reshard a node kill interrupted.
  KINESIS_MAINTENANCE_INTERVAL_MS: "2000"
  # Tiering to the S3 mock (task 17's tiering case), off unless the
  # scenario sets these in its environment and recreates the nodes. The
  # mock does not check signatures, but the SDK will not sign without some
  # credentials.
  KINESIS_TIER_AFTER_MS: "${KINESIS_SCENARIO_TIER_AFTER_MS:-0}"
  KINESIS_TIER_S3_BUCKET: "${KINESIS_SCENARIO_TIER_BUCKET:-}"
  KINESIS_TIER_S3_ENDPOINT: "${KINESIS_SCENARIO_TIER_ENDPOINT:-}"
  AWS_ACCESS_KEY_ID: scenario-s3-key
  AWS_SECRET_ACCESS_KEY: scenario-s3-secret
  AWS_EC2_METADATA_DISABLED: "true"

services:
  kin-1:
    <<: *node
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "1"
    volumes:
      - ./keys.txt:/etc/kinesis/keys:ro
      - kin-1-data:/var/lib/kinesis

  kin-2:
    <<: *node
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "2"
    volumes:
      - ./keys.txt:/etc/kinesis/keys:ro
      - kin-2-data:/var/lib/kinesis

  kin-3:
    <<: *node
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "3"
    volumes:
      - ./keys.txt:/etc/kinesis/keys:ro
      - kin-3-data:/var/lib/kinesis

  # The in-memory S3 mock (cmd/chaos_s3_mock, staged into the node image)
  # that the tiering case tiers to, in the `s3` profile: S3 on :9000 and
  # its fault knobs on :9001, reached by service name. Its objects live in
  # memory, so the scenario never restarts it.
  s3mock:
    image: kythira-kinesis-node:dev
    profiles: ["s3"]
    entrypoint: ["/usr/local/bin/chaos_s3_mock"]
    networks:
      - kinesis_net

  # The AWS CLI v2, at the version the wire evidence pins
  # (services/kinesis/tests/evidence/README.md).
  aws-cli:
    image: docker.io/amazon/aws-cli:2.31.0
    profiles: ["clients"]
    networks:
      - kinesis_net
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""

  # boto3 producer and polling consumer (kinesis_e2e.py).
  boto3:
    image: kythira-kinesis-clients:dev
    profiles: ["clients"]
    networks:
      - kinesis_net
    environment:
      AWS_EC2_METADATA_DISABLED: "true"

  # aws-sdk-cpp producer and polling consumer (kinesis_sdk_cpp).
  sdk-cpp:
    image: kythira-kinesis-sdk-cpp:dev
    profiles: ["clients"]
    networks:
      - kinesis_net
    environment:
      AWS_EC2_METADATA_DISABLED: "true"

  # KCL 2.x workers with their leases on the cluster (task 9), one per
  # node so that killing a node also cuts one worker off. In the `kcl`
  # profile; the scenario starts them with `up -d` and reads their EVENT
  # lines from `logs`.
  kcl-1: &kcl
    image: kythira-kinesis-kcl:dev
    profiles: ["kcl"]
    networks:
      - kinesis_net
    environment:
      AWS_ACCESS_KEY_ID: AKIDKINESISCLIENT01
      AWS_SECRET_ACCESS_KEY: kinesis-scenario-client-secret
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      KCL_FAILOVER_MILLIS: "10000"
    command: ["http://kin-1:4567", "kcl", "kcl-app", "worker-1"]

  kcl-2:
    <<: *kcl
    command: ["http://kin-2:4567", "kcl", "kcl-app", "worker-2"]

  kcl-3:
    <<: *kcl
    command: ["http://kin-3:4567", "kcl", "kcl-app", "worker-3"]

  # KCL 2.x workers in enhanced fan-out mode (task 13): they register a
  # consumer and subscribe to shards over HTTP/2 (h2c). In the `kcl-efo`
  # profile. They sign with the admin key: RegisterStreamConsumer is a
  # control-plane write in AWS's action annotations, so the static-key
  # read-write role does not include it (doc/fan-out.md).
  kcl-efo-1: &kcl_efo
    <<: *kcl
    profiles: ["kcl-efo"]
    environment:
      AWS_ACCESS_KEY_ID: AKIDKINESISADMIN001
      AWS_SECRET_ACCESS_KEY: kinesis-scenario-admin-secret
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      KCL_FAILOVER_MILLIS: "10000"
      KCL_RETRIEVAL: fanout
    command: ["http://kin-1:4567", "efo", "efo-app", "efo-worker-1"]

  kcl-efo-2:
    <<: *kcl_efo
    command: ["http://kin-2:4567", "efo", "efo-app", "efo-worker-2"]

  # Task 16: KCL's own lease tables in DynamoDB, in the `leases` profile.
  # ddb-leases is Kythira's DynamoDB (one dynamodb_gateway_node on the
  # memory engine, staged into the node image when the build has it);
  # ddb-local is DynamoDB Local. Each takes the client key, the one the
  # workers sign with.
  ddb-leases:
    image: kythira-kinesis-node:dev
    profiles: ["leases"]
    networks:
      - kinesis_net
    entrypoint: ["/usr/local/bin/dynamodb_gateway_node"]
    environment:
      KYTHIRA_DYNAMODB_PORT: "8000"
      KYTHIRA_DYNAMODB_INSECURE_PLAINTEXT: "1"
      KYTHIRA_DYNAMODB_STATIC_KEYS: AKIDKINESISCLIENT01:kinesis-scenario-client-secret:111122223333:client:admin
      KYTHIRA_DYNAMODB_DISK_FLOOR_BYTES: "0"
      KYTHIRA_DYNAMODB_COMPAT: throttling=off

  ddb-local:
    image: docker.io/amazon/dynamodb-local:3.3.2
    profiles: ["leases"]
    networks:
      - kinesis_net

  # Four applications on one stream: KCL 2.x and 3.x, each with its lease
  # table on ddb-leases and on ddb-local.
  kcl2-kythira-ddb: &kcl_ddb
    image: kythira-kinesis-kcl:dev
    profiles: ["leases"]
    networks:
      - kinesis_net
    environment: &kcl_ddb_env
      AWS_ACCESS_KEY_ID: AKIDKINESISCLIENT01
      AWS_SECRET_ACCESS_KEY: kinesis-scenario-client-secret
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      KCL_FAILOVER_MILLIS: "10000"
      KCL_LEASES: dynamodb
      KCL_DYNAMODB_ENDPOINT: http://ddb-leases:8000
    command: ["http://kin-1:4567", "leases", "kcl2-on-kythira-ddb", "kcl2-k"]

  kcl3-kythira-ddb:
    <<: *kcl_ddb
    entrypoint: ["/opt/kcl3-sample/bin/kythira-kcl3-sample"]
    command: ["http://kin-2:4567", "leases", "kcl3-on-kythira-ddb", "kcl3-k"]

  kcl2-ddb-local:
    <<: *kcl_ddb
    environment:
      <<: *kcl_ddb_env
      KCL_DYNAMODB_ENDPOINT: http://ddb-local:8000
    command: ["http://kin-3:4567", "leases", "kcl2-on-ddb-local", "kcl2-l"]

  kcl3-ddb-local:
    <<: *kcl_ddb
    entrypoint: ["/opt/kcl3-sample/bin/kythira-kcl3-sample"]
    environment:
      <<: *kcl_ddb_env
      KCL_DYNAMODB_ENDPOINT: http://ddb-local:8000
    command: ["http://kin-1:4567", "leases", "kcl3-on-ddb-local", "kcl3-l"]

networks:
  kinesis_net:
    driver: bridge

volumes:
  kin-1-data:
  kin-2-data:
  kin-3-data:
