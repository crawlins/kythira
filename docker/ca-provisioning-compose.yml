# Demonstrates ca_service (oneshot mode) provisioning a shared root CA and
# per-service leaf certificates into named volumes before dependent node
# containers start. The mtls-node1/mtls-node2 services are illustrative stubs
# (Alpine + a shell check) — wiring up an actual mTLS chaos test node is future
# work, tracked separately from the certificate-authority framework itself.
#
# No static IP addresses are configured anywhere in this file; containers
# address each other by compose service name only, so it works unmodified
# under both Docker and rootless Podman (see CLAUDE.md's container runtime
# compatibility rules).
#
# Key isolation: each service gets its own volume holding only its own
# cert/key/chain, and the public root certificate lives in a separate
# ca-trust volume. ca-service mounts every per-service volume beneath its
# output directory, so ca_service's on-disk layout is unchanged:
#
#   ca-trust          -> /ca                (root_ca.pem)
#   mtls-node1-tls    -> /ca/mtls-node1     (cert.pem, key.pem, chain.pem)
#   mtls-node2-tls    -> /ca/mtls-node2     (cert.pem, key.pem, chain.pem)
#
# Each node mounts ca-trust plus its own volume only, both read-only, at the
# same paths, so a compromised node cannot read a peer's private key. The
# nested mountpoint directories already exist inside ca-trust (the runtime
# created them while ca-service ran, and depends_on orders the nodes after
# it), so the read-only ca-trust mount needs no directory created in it.
# Adding a service means adding its <name>-tls volume, a matching mount and
# --service argument on ca-service, and mounting only that volume on the
# new node.

networks:
  ca-provisioning-net:
    driver: bridge

volumes:
  ca-trust:
  mtls-node1-tls:
  mtls-node2-tls:

services:
  ca-service:
    image: kythira-ca-service:dev
    build:
      context: ..
      dockerfile: docker/ca_service/Dockerfile
    networks:
      - ca-provisioning-net
    volumes:
      - ca-trust:/ca
      - mtls-node1-tls:/ca/mtls-node1
      - mtls-node2-tls:/ca/mtls-node2
    command:
      - "--out-dir=/ca"
      - "--service=mtls-node1"
      - "--service=mtls-node2"
      - "--domain=cluster.example.local"

  mtls-node1:
    image: alpine:3.20
    hostname: mtls-node1
    networks:
      ca-provisioning-net:
    volumes:
      - ca-trust:/ca:ro
      - mtls-node1-tls:/ca/mtls-node1:ro
    depends_on:
      ca-service:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        set -e
        test -f /ca/root_ca.pem
        test -f /ca/mtls-node1/cert.pem
        test -f /ca/mtls-node1/key.pem
        test -f /ca/mtls-node1/chain.pem
        test ! -e /ca/mtls-node2/key.pem
        echo "mtls-node1: certificate material present"

  mtls-node2:
    image: alpine:3.20
    hostname: mtls-node2
    networks:
      ca-provisioning-net:
    volumes:
      - ca-trust:/ca:ro
      - mtls-node2-tls:/ca/mtls-node2:ro
    depends_on:
      ca-service:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        set -e
        test -f /ca/root_ca.pem
        test -f /ca/mtls-node2/cert.pem
        test -f /ca/mtls-node2/key.pem
        test -f /ca/mtls-node2/chain.pem
        test ! -e /ca/mtls-node1/key.pem
        echo "mtls-node2: certificate material present"
