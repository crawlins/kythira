# docker/cloud-monitoring/oci-management-agent-prometheus-emitter.properties
# — example OCI Management Agent Prometheus-emitter data-source config
# routing Kythira's metrics to OCI Monitoring (doc/TODO.md "Metrics
# Backends", OCI Monitoring entry; operator docs in
# doc/cloud_vendor_monitoring.md).
#
# Kythira deliberately ships no bespoke OCI Monitoring kythira::metrics
# implementation, and the OpenTelemetry Collector has no OCI Monitoring
# exporter either (checked against opentelemetry-collector-contrib
# v0.116) — so this entry uses the vendor's own agent: the OCI Management
# Agent's PrometheusEmitter plugin scrapes the node's existing Prometheus
# endpoint (prometheus_metrics + prometheus_scrape_server, enabled on
# chaos_node via PROMETHEUS_METRICS_PORT) and posts the samples to OCI
# Monitoring's PostMetricData API under the namespace below.
#
# Install: drop this file (any name, .properties extension) into
#   /opt/oracle/mgmt_agent/agent_inst/discovery/PrometheusEmitter/
# on a host running the Management Agent (or register it as a
# management-agent Prometheus data source via the OCI CLI), after
# replacing:
#   - url:           the node's real host:port (HTTP only)
#   - compartmentId: the OCID of the compartment to post metrics into
#
# The agent's dynamic-group policy must allow the namespace/compartment
# pair, e.g.:
#   Allow dynamic-group MgmtAgentGroup to use metrics in compartment <c>
#     where target.metrics.namespace='kythira_chaos_node'

url=http://localhost:9464/metrics
namespace=kythira_chaos_node
compartmentId=ocid1.compartment.oc1..replace-with-your-compartment-ocid

# Fixed dimensions stamped on every uploaded datapoint (the node already
# labels series with node_id; add deployment-level identity here).
metricDimensions=deployment=example

# Scrape interval, minutes (minimum 1, vendor default 5).
scheduleMins=1
