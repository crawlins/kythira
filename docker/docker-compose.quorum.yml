# docker-compose.quorum.yml — 3-node kythira cluster with docker_quorum_manager enabled.
#
# Each node mounts the Docker socket so that the Raft leader can provision
# replacement containers directly through the Docker daemon.  No static IPs
# are used; containers address each other by service/hostname (CLAUDE.md rule).
#
# Set KYTHIRA_CONTAINER_RUNTIME / KYTHIRA_COMPOSE_COMMAND before invoking if
# running under rootless Podman (see CLAUDE.md), and point CONTAINER_SOCKET at
# the Podman API socket (e.g. $XDG_RUNTIME_DIR/podman/podman.sock); it is
# mounted at /var/run/docker.sock inside each node, where the manager looks.
#
# Per-test cluster isolation: override QUORUM_CLUSTER via:
#   QUORUM_CLUSTER=mytest docker compose -f docker-compose.quorum.yml up -d

services:
  qnode1:
    image: kythira-chaos-node:dev
    # Named and labelled exactly as docker_quorum_manager names the containers
    # it provisions, so assess_quorum and decommission_node find these too.
    container_name: kythira-${QUORUM_CLUSTER:-kythira-quorum-test}-1
    labels:
      kythira.cluster: "${QUORUM_CLUSTER:-kythira-quorum-test}"
      kythira.node_id: "1"
    hostname: qnode1
    environment:
      NODE_ID: "1"
      PEERS: "2:qnode2:7000,3:qnode3:7000"
      RPC_PORT: "7000"
      HTTP_PORT: "8080"
      FIU_PORT: "9000"
      DATA_DIR: "/var/lib/chaos_node"
      # A vote request to a dead or paused peer takes about 600 ms to fail
      # (100 ms RPC timeout, three attempts with backoff), and a candidate
      # can wait on it before it counts its votes. Below that, a failed leader is followed by split votes
      # and a second leader change in the middle of provisioning a
      # replacement, which the new leader then duplicates.
      ELECTION_TIMEOUT_MIN_MS: "1000"
      ELECTION_TIMEOUT_MAX_MS: "2000"
      HEARTBEAT_INTERVAL_MS: "100"
      QUORUM_MANAGER: "docker"
      QUORUM_IMAGE: "kythira-chaos-node:dev"
      QUORUM_CLUSTER: "${QUORUM_CLUSTER:-kythira-quorum-test}"
      QUORUM_NETWORK: "${QUORUM_NETWORK:-kythira-quorum-net}"
      QUORUM_TARGET: "${QUORUM_TARGET:-3}"
      # The replacement is promoted, and the failed node removed and
      # decommissioned, on later quorum checks; the 30 s default would
      # leave the healing tests waiting minutes for that.
      QUORUM_CHECK_INTERVAL_MS: "${QUORUM_CHECK_INTERVAL_MS:-5000}"
    ports:
      - "7101:7000"
      - "8181:8080"
      - "9101:9000"
    volumes:
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    networks:
      - kythira-quorum-net

  qnode2:
    image: kythira-chaos-node:dev
    # Named and labelled exactly as docker_quorum_manager names the containers
    # it provisions, so assess_quorum and decommission_node find these too.
    container_name: kythira-${QUORUM_CLUSTER:-kythira-quorum-test}-2
    labels:
      kythira.cluster: "${QUORUM_CLUSTER:-kythira-quorum-test}"
      kythira.node_id: "2"
    hostname: qnode2
    environment:
      NODE_ID: "2"
      PEERS: "1:qnode1:7000,3:qnode3:7000"
      RPC_PORT: "7000"
      HTTP_PORT: "8080"
      FIU_PORT: "9000"
      DATA_DIR: "/var/lib/chaos_node"
      # A vote request to a dead or paused peer takes about 600 ms to fail
      # (100 ms RPC timeout, three attempts with backoff), and a candidate
      # can wait on it before it counts its votes. Below that, a failed leader is followed by split votes
      # and a second leader change in the middle of provisioning a
      # replacement, which the new leader then duplicates.
      ELECTION_TIMEOUT_MIN_MS: "1000"
      ELECTION_TIMEOUT_MAX_MS: "2000"
      HEARTBEAT_INTERVAL_MS: "100"
      QUORUM_MANAGER: "docker"
      QUORUM_IMAGE: "kythira-chaos-node:dev"
      QUORUM_CLUSTER: "${QUORUM_CLUSTER:-kythira-quorum-test}"
      QUORUM_NETWORK: "${QUORUM_NETWORK:-kythira-quorum-net}"
      QUORUM_TARGET: "${QUORUM_TARGET:-3}"
      # The replacement is promoted, and the failed node removed and
      # decommissioned, on later quorum checks; the 30 s default would
      # leave the healing tests waiting minutes for that.
      QUORUM_CHECK_INTERVAL_MS: "${QUORUM_CHECK_INTERVAL_MS:-5000}"
    ports:
      - "7102:7000"
      - "8182:8080"
      - "9102:9000"
    volumes:
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    networks:
      - kythira-quorum-net

  qnode3:
    image: kythira-chaos-node:dev
    # Named and labelled exactly as docker_quorum_manager names the containers
    # it provisions, so assess_quorum and decommission_node find these too.
    container_name: kythira-${QUORUM_CLUSTER:-kythira-quorum-test}-3
    labels:
      kythira.cluster: "${QUORUM_CLUSTER:-kythira-quorum-test}"
      kythira.node_id: "3"
    hostname: qnode3
    environment:
      NODE_ID: "3"
      PEERS: "1:qnode1:7000,2:qnode2:7000"
      RPC_PORT: "7000"
      HTTP_PORT: "8080"
      FIU_PORT: "9000"
      DATA_DIR: "/var/lib/chaos_node"
      # A vote request to a dead or paused peer takes about 600 ms to fail
      # (100 ms RPC timeout, three attempts with backoff), and a candidate
      # can wait on it before it counts its votes. Below that, a failed leader is followed by split votes
      # and a second leader change in the middle of provisioning a
      # replacement, which the new leader then duplicates.
      ELECTION_TIMEOUT_MIN_MS: "1000"
      ELECTION_TIMEOUT_MAX_MS: "2000"
      HEARTBEAT_INTERVAL_MS: "100"
      QUORUM_MANAGER: "docker"
      QUORUM_IMAGE: "kythira-chaos-node:dev"
      QUORUM_CLUSTER: "${QUORUM_CLUSTER:-kythira-quorum-test}"
      QUORUM_NETWORK: "${QUORUM_NETWORK:-kythira-quorum-net}"
      QUORUM_TARGET: "${QUORUM_TARGET:-3}"
      # The replacement is promoted, and the failed node removed and
      # decommissioned, on later quorum checks; the 30 s default would
      # leave the healing tests waiting minutes for that.
      QUORUM_CHECK_INTERVAL_MS: "${QUORUM_CHECK_INTERVAL_MS:-5000}"
    ports:
      - "7103:7000"
      - "8183:8080"
      - "9103:9000"
    volumes:
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    networks:
      - kythira-quorum-net

networks:
  kythira-quorum-net:
    # An explicit name, so it is the network QUORUM_NETWORK names: without it
    # compose prefixes the project name and the manager attaches provisioned
    # containers to a network that does not exist.
    name: ${QUORUM_NETWORK:-kythira-quorum-net}
    driver: bridge
