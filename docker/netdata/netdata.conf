# docker/netdata/netdata.conf — example NetData configuration for the
# NetData metrics backend (include/raft/netdata_metrics.hpp,
# doc/netdata_metrics_backend.md).
#
# NetData's StatsD collector is enabled by default on UDP/TCP 8125; this
# file just pins the settings the backend depends on explicitly, so a
# deployment that starts from a stripped-down netdata.conf doesn't silently
# lose the listener. The scenario test
# (tests/docker_chaos/netdata_metrics_scenario_test.cpp) mounts this file
# into a real netdata/netdata container.

[statsd]
    enabled = yes
    # NetData's statsd listener binds localhost by default, which is
    # unreachable from another compose container — the run-4 scenario-test
    # evidence was a healthy node, a healthy NetData, and zero statsd
    # charts. Bind all interfaces so node1's datagrams arrive.
    bind to = udp:* tcp:*
    # The backend sends one datagram per payload, several metrics per
    # datagram, newline-separated — the protocol's standard multi-metric
    # packet form.
    update every = 1
