# Elastic shard capacity, end to end, on containers.
# `.kiro/specs/elastic-shard-capacity/` task 16; driven by
# `tests/docker_chaos/elastic_capacity_docker_test.cpp`.
#
# Three `multi_raft_node` hosts. Node 1 runs the capacity controller over
# `docker_quorum_manager` and serves its control plane on 7003; nodes 2 and 3
# are members whose placement-driver hooks call it. The scenario: load splits
# the two starting shards, shards per node cross the high watermark, the
# controller creates a fourth container through the container API, and admits
# it onto shards as a learner that is then promoted.
#
# CLAUDE.md's container rules, and how each is met:
#
#   * **No static IPs.** Every host is addressed by name. The names are the
#     ones `docker_quorum_manager` gives the containers it creates,
#     `kythira-<cluster>-<id>`, so PEERS can name ids 4..6 before they exist:
#     both Docker's embedded DNS and Podman's aardvark-dns resolve a container
#     name on a user-defined network once that container is there.
#   * **No hardcoded runtime.** The harness picks it with `container_runtime()`
#     and `compose_prefix()`. The container API the controller calls is
#     whatever socket CONTAINER_SOCKET names (the harness points it at the
#     rootless Podman socket under Podman). Podman serves the
#     Docker-compatible API there.
#   * **No privileges.** No `privileged`, no `cap_add`, no host networking.
#     No node mounts the API socket either: only `container-api-proxy` does,
#     and it forwards just the calls docker_quorum_manager makes, for this
#     cluster's containers, with no HostConfig (docker/container_api_proxy/
#     proxy.py). The controller dials it over the network.
#
# The capacity plane requires the shared bearer token in
# KYTHIRA_CAPACITY_TOKEN (16+ characters; the harness generates one per run).
# Every node gets it here, and the controller hands it to each container it
# creates, so a new member can call back. Published ports still bind to
# 127.0.0.1, because the data and control surfaces take commands without
# authentication. Set KYTHIRA_BIND_ADDRESS to publish them elsewhere, on a
# machine where that is safe.
#
# The network has an explicit `name:` because the controller attaches the
# containers it creates to it by that name; a compose-prefixed name would
# leave them unable to reach anyone.

x-shape: &shape
  # The cluster's shape. The controller copies these into every container it
  # creates (see docker/multi_raft_node/entrypoint.sh), so they are the same
  # everywhere by construction.
  PEERS: "1:kythira-${CAPACITY_CLUSTER:?set CAPACITY_CLUSTER}-1:7000,2:kythira-${CAPACITY_CLUSTER}-2:7000,3:kythira-${CAPACITY_CLUSTER}-3:7000,4:kythira-${CAPACITY_CLUSTER}-4:7000,5:kythira-${CAPACITY_CLUSTER}-5:7000,6:kythira-${CAPACITY_CLUSTER}-6:7000"
  VOTERS: "1,2,3"
  GROUPS: "2"
  KEY_COUNT: "1000"
  TICK_INTERVAL_MS: "5"
  TRANSPORT: "httplib"
  SERIALIZER: "json"
  PERSISTENCE: "memory"
  RAFT_PORT: "7000"
  DATA_PORT: "7001"
  CONTROL_PORT: "7002"
  SPLIT_KEYS: "${SPLIT_KEYS:-60}"
  CAPACITY_HEARTBEAT_MS: "1000"
  KYTHIRA_CAPACITY_TOKEN: "${KYTHIRA_CAPACITY_TOKEN:?set KYTHIRA_CAPACITY_TOKEN to a random 16+ character token}"

services:
  node1:
    image: ${CAPACITY_IMAGE:-kythira-multi-raft-node:dev}
    container_name: kythira-${CAPACITY_CLUSTER}-1
    hostname: kythira-${CAPACITY_CLUSTER}-1
    labels:
      kythira.cluster: "${CAPACITY_CLUSTER}"
      kythira.node_id: "1"
    environment:
      <<: *shape
      NODE_ID: "1"
      CAPACITY_ROLE: "controller"
      CAPACITY_PORT: "7003"
      CAPACITY_CLUSTER: "${CAPACITY_CLUSTER}"
      CAPACITY_NETWORK: "kythira-${CAPACITY_CLUSTER}-net"
      CAPACITY_IMAGE: "${CAPACITY_IMAGE:-kythira-multi-raft-node:dev}"
      CAPACITY_MAX_NODES: "4"
      CAPACITY_SHARDS_HIGH: "3"
      CAPACITY_SHARDS_LOW: "1"
      CAPACITY_SUSTAINED_MS: "5000"
      CAPACITY_DOCKER_URL: "http://container-api-proxy:2375"
    depends_on:
      - container-api-proxy
    ports:
      - "${KYTHIRA_BIND_ADDRESS:-127.0.0.1}:${NODE1_DATA_PORT:-27101}:7001"
      - "${KYTHIRA_BIND_ADDRESS:-127.0.0.1}:${NODE1_CONTROL_PORT:-27201}:7002"
      - "${KYTHIRA_BIND_ADDRESS:-127.0.0.1}:${CAPACITY_PUBLISHED_PORT:-27003}:7003"
    networks:
      - capacity_net

  node2:
    image: ${CAPACITY_IMAGE:-kythira-multi-raft-node:dev}
    container_name: kythira-${CAPACITY_CLUSTER}-2
    hostname: kythira-${CAPACITY_CLUSTER}-2
    labels:
      kythira.cluster: "${CAPACITY_CLUSTER}"
      kythira.node_id: "2"
    environment:
      <<: *shape
      NODE_ID: "2"
      CAPACITY_ROLE: "member"
      CAPACITY_CONTROLLER: "kythira-${CAPACITY_CLUSTER}-1:7003"
    ports:
      - "${KYTHIRA_BIND_ADDRESS:-127.0.0.1}:${NODE2_DATA_PORT:-27102}:7001"
      - "${KYTHIRA_BIND_ADDRESS:-127.0.0.1}:${NODE2_CONTROL_PORT:-27202}:7002"
    networks:
      - capacity_net

  node3:
    image: ${CAPACITY_IMAGE:-kythira-multi-raft-node:dev}
    container_name: kythira-${CAPACITY_CLUSTER}-3
    hostname: kythira-${CAPACITY_CLUSTER}-3
    labels:
      kythira.cluster: "${CAPACITY_CLUSTER}"
      kythira.node_id: "3"
    environment:
      <<: *shape
      NODE_ID: "3"
      CAPACITY_ROLE: "member"
      CAPACITY_CONTROLLER: "kythira-${CAPACITY_CLUSTER}-1:7003"
    ports:
      - "${KYTHIRA_BIND_ADDRESS:-127.0.0.1}:${NODE3_DATA_PORT:-27103}:7001"
      - "${KYTHIRA_BIND_ADDRESS:-127.0.0.1}:${NODE3_CONTROL_PORT:-27203}:7002"
    networks:
      - capacity_net

  container-api-proxy:
    image: kythira-container-api-proxy:dev
    build:
      context: container_api_proxy
    environment:
      PROXY_CLUSTER: "${CAPACITY_CLUSTER}"
      PROXY_IMAGE: "${CAPACITY_IMAGE:-kythira-multi-raft-node:dev}"
      PROXY_NETWORK: "kythira-${CAPACITY_CLUSTER}-net"
    volumes:
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - capacity_net

networks:
  capacity_net:
    name: kythira-${CAPACITY_CLUSTER}-net
    driver: bridge
