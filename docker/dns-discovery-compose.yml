networks:
  dns-test-net:
    driver: bridge

# The TSIG key the bind9 entrypoint generates at start; the nodes sign their
# RFC 2136 updates with it, since the zone accepts no unsigned update.
volumes:
  dns-test-bind9-tsig:

services:
  dns-test-bind9:
    image: kythira-bind9:dev
    container_name: dns-test-bind9
    networks:
      - dns-test-net
    volumes:
      - dns-test-bind9-tsig:/tsig
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "example.local", "SOA", "+short"]
      interval: 2s
      timeout: 3s
      retries: 15

  dns-discovery-node1:
    image: kythira-dns-discovery:dev
    container_name: dns-discovery-node1
    hostname: dns-discovery-node1
    networks:
      dns-test-net:
    volumes:
      - dns-test-bind9-tsig:/tsig:ro
    environment:
      TSIG_KEY_DIR: "/tsig"
      NODE_ID: node1
      HTTP_PORT: "9021"
      RPC_PORT: "7021"
      DNS_SERVER: "dns-test-bind9"
      DNS_ZONE: "example.local."
      DNS_SHARED_NAME: "cluster.example.local."
    ports:
      - "${KYTHIRA_BIND_ADDRESS:-127.0.0.1}:9021:9021"
    depends_on:
      dns-test-bind9:
        condition: service_healthy

  dns-discovery-node2:
    image: kythira-dns-discovery:dev
    container_name: dns-discovery-node2
    hostname: dns-discovery-node2
    networks:
      dns-test-net:
    volumes:
      - dns-test-bind9-tsig:/tsig:ro
    environment:
      TSIG_KEY_DIR: "/tsig"
      NODE_ID: node2
      HTTP_PORT: "9022"
      RPC_PORT: "7022"
      DNS_SERVER: "dns-test-bind9"
      DNS_ZONE: "example.local."
      DNS_SHARED_NAME: "cluster.example.local."
    ports:
      - "${KYTHIRA_BIND_ADDRESS:-127.0.0.1}:9022:9022"
    depends_on:
      dns-test-bind9:
        condition: service_healthy

  dns-discovery-node3:
    image: kythira-dns-discovery:dev
    container_name: dns-discovery-node3
    hostname: dns-discovery-node3
    networks:
      dns-test-net:
    volumes:
      - dns-test-bind9-tsig:/tsig:ro
    environment:
      TSIG_KEY_DIR: "/tsig"
      NODE_ID: node3
      HTTP_PORT: "9023"
      RPC_PORT: "7023"
      DNS_SERVER: "dns-test-bind9"
      DNS_ZONE: "example.local."
      DNS_SHARED_NAME: "cluster.example.local."
    ports:
      - "${KYTHIRA_BIND_ADDRESS:-127.0.0.1}:9023:9023"
    depends_on:
      dns-test-bind9:
        condition: service_healthy
