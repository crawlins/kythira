# docker/telegraf/telegraf.conf — example Telegraf agent configuration for
# the Telegraf metrics backend (include/raft/telegraf_metrics.hpp,
# doc/telegraf_metrics_backend.md).
#
# The backend emits InfluxDB line protocol over UDP (default) or TCP to
# socket_listener; from there, swap the [[outputs.file]] below for whatever
# output plugin you already run (InfluxDB, Graphite, Kafka, ...) — the point
# of this backend is to inherit Telegraf's fan-out rather than pick one.
#
# The file output is what the scenario test asserts against
# (tests/docker_chaos/telegraf_metrics_scenario_test.cpp): it proves Telegraf
# really parsed the lines, since unparseable input never reaches an output.

[agent]
  interval = "2s"
  flush_interval = "2s"

[[inputs.socket_listener]]
  service_address = "udp://:8094"
  data_format = "influx"

# /tmp rather than a named volume: the official telegraf image's entrypoint
# drops root to the `telegraf` user even when the container is started as
# 0:0, so a root-owned volume mount is unwritable and the agent exits at
# startup ("permission denied" — run-4 scenario-test evidence). The scenario
# test reads the file back via `<runtime> exec cat`, so no volume is needed.
[[outputs.file]]
  files = ["/tmp/telegraf-out.influx"]
  data_format = "influx"
